name: Competition Agent3 Semantic Microbatch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: competition-agent3-semantic-microbatch-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-microbatch:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      COMPETITION_SOURCE_COMMIT: ${{ github.sha }}
      COMPETITION_BASE_PYTHON: /opt/python/3.11.9/bin/python3.11
      COMPETITION_VENV_ROOT: /opt/actions-runner-public/competition-runtime-venvs
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Materialize exact source commit archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/agent3-semantic-microbatch-${COMPETITION_SOURCE_COMMIT}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/agent3-semantic-microbatch-${COMPETITION_SOURCE_COMMIT}"
          rm -rf "$ARCHIVE" "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          downloaded=0
          for attempt in $(seq 1 8); do
            echo "Archive download attempt ${attempt}/8"
            if curl --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 300 \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${COMPETITION_SOURCE_COMMIT}" \
              -o "$ARCHIVE"; then
              downloaded=1
              break
            fi
            rm -f "$ARCHIVE"
            sleep $((attempt * 5))
          done
          test "$downloaded" = "1"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          test -f "$EXTRACTED/src/services/agent3_runtime_v23215_service.py"
          test -f "$EXTRACTED/scripts/verify_agent3_semantic_sop_microbatch.py"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$COMPETITION_SOURCE_COMMIT" > .competition-source-commit

      - name: Prepare verified application runtime
        run: |
          set -euo pipefail
          mkdir -p dist/agent3-semantic-microbatch
          chmod +x scripts/prepare_competition_runtime_venv.sh
          scripts/prepare_competition_runtime_venv.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/dist/agent3-semantic-microbatch" \
            | tee dist/agent3-semantic-microbatch/runtime-prepare.log
          RUNTIME_PYTHON="$(tail -n 1 dist/agent3-semantic-microbatch/runtime-prepare.log)"
          test -x "$RUNTIME_PYTHON"
          printf 'RUNTIME_PYTHON=%s\n' "$RUNTIME_PYTHON" >> "$GITHUB_ENV"

      - name: Compile scoped runtime and verifier
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m py_compile \
            src/services/agent3_runtime_v23215_service.py \
            src/services/agent_token_runtime_v225_service.py \
            src/services/agent_runtime_contract_v225_service.py \
            scripts/verify_agent3_semantic_sop_microbatch.py \
            tests/test_agent3_semantic_sop_microbatch_v1.py

      - name: Verify semantic SOP and safety invariants
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" scripts/verify_agent3_semantic_sop_microbatch.py \
            | tee dist/agent3-semantic-microbatch/verification.json

      - name: Run Agent3 semantic and microbatch regression
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m unittest -q tests.test_agent3_semantic_sop_microbatch_v1 \
            | tee dist/agent3-semantic-microbatch/unittest.txt

      - name: Assert exact source identity
        run: |
          set -euo pipefail
          test "$(cat .competition-source-commit)" = "$COMPETITION_SOURCE_COMMIT"
          grep -q '"verified": true' dist/agent3-semantic-microbatch/verification.json
