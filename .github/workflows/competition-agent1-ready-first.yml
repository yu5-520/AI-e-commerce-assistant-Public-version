name: Competition Agent1 Ready First

on:
  pull_request:
    paths:
      - 'src/services/agent_runtime_hard_interface_v22515_service.py'
      - 'src/services/agent_runtime_hard_interface_v2257_service.py'
      - 'src/services/agent_input_contract_v2258_service.py'
      - 'src/services/agent_input_transport_v2258_service.py'
      - 'src/services/agent_token_runtime_hash_exact_v2259_service.py'
      - 'src/services/station_agent_worker_v2259_service.py'
      - 'tests/test_agent1_ready_first_runtime_v1.py'
      - 'scripts/verify_agent1_ready_first_runtime.py'
      - 'scripts/prepare_competition_runtime_venv.sh'
      - 'governance/agent1_ready_first_runtime_v1.json'
      - 'governance/competition_lineage_update_policy.json'
      - '.github/workflows/competition-agent1-ready-first.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: competition-agent1-ready-first-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready-first:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      COMPETITION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPETITION_BASE_PYTHON: /opt/python/3.11.9/bin/python3.11
      COMPETITION_VENV_ROOT: /opt/actions-runner-public/competition-runtime-venvs
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Materialize exact source commit archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/agent1-ready-first-${COMPETITION_SOURCE_COMMIT}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/agent1-ready-first-${COMPETITION_SOURCE_COMMIT}"
          rm -rf "$ARCHIVE" "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          downloaded=0
          for attempt in $(seq 1 8); do
            echo "Archive download attempt ${attempt}/8"
            if curl --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 300 \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${COMPETITION_SOURCE_COMMIT}" \
              -o "$ARCHIVE"; then
              downloaded=1
              break
            fi
            rm -f "$ARCHIVE"
            sleep $((attempt * 5))
          done
          test "$downloaded" = "1"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          test -f "$EXTRACTED/src/services/agent_runtime_hard_interface_v22515_service.py"
          test -f "$EXTRACTED/scripts/verify_agent1_ready_first_runtime.py"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$COMPETITION_SOURCE_COMMIT" > .competition-source-commit

      - name: Prepare verified application runtime
        run: |
          set -euo pipefail
          mkdir -p dist/agent1-ready-first
          chmod +x scripts/prepare_competition_runtime_venv.sh
          scripts/prepare_competition_runtime_venv.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/dist/agent1-ready-first" \
            | tee dist/agent1-ready-first/runtime-prepare.log
          RUNTIME_PYTHON="$(tail -n 1 dist/agent1-ready-first/runtime-prepare.log)"
          test -x "$RUNTIME_PYTHON"
          printf 'RUNTIME_PYTHON=%s\n' "$RUNTIME_PYTHON" >> "$GITHUB_ENV"

      - name: Compile scoped runtime and verifier
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m py_compile \
            src/services/agent_runtime_hard_interface_v22515_service.py \
            scripts/verify_agent1_ready_first_runtime.py \
            tests/test_agent1_ready_first_runtime_v1.py

      - name: Verify ownership and safety invariants
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" scripts/verify_agent1_ready_first_runtime.py \
            | tee dist/agent1-ready-first/verification.json

      - name: Run ready-first behavior regression
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" -m pytest -q tests/test_agent1_ready_first_runtime_v1.py \
            | tee dist/agent1-ready-first/pytest.txt

      - name: Assert exact source identity
        run: |
          set -euo pipefail
          test "$(cat .competition-source-commit)" = "$COMPETITION_SOURCE_COMMIT"
          grep -q '"verified": true' dist/agent1-ready-first/verification.json
