name: Public PR Security Gate

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check_public_runner_boundary.py'
      - 'tests/test_public_release_runner_boundary.py'
      - '.gitignore'
      - 'LICENSE'
      - 'Z_CENTURY_TECHNOLOGY_NOTICE.md'
      - 'governance/ip/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/check_public_runner_boundary.py'
      - 'tests/test_public_release_runner_boundary.py'

permissions:
  contents: read

jobs:
  public-runner-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify public PR runner boundary
        run: python3 scripts/check_public_runner_boundary.py
