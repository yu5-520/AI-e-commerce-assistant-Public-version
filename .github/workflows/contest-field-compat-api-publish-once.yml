name: Publish verified field compatibility through Git Data API

on:
  push:
    branches:
      - migration/bulk-bootstrap
    paths:
      - .github/workflows/contest-field-compat-api-publish-once.yml

permissions:
  contents: write

concurrency:
  group: contest-field-compat-api-publish-once
  cancel-in-progress: false

jobs:
  api-publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      WORK: /opt/actions-runner-public/_work/AI-e-commerce-assistant-Public-version/AI-e-commerce-assistant-Public-version
      BASE_COMMIT: 42732acfdec2dc7d94693880c4e9969ceffad04e
      BASE_TREE: cff2774369c17e1b42be12d1f11d3974529a0c46
      EXPECTED_LOCAL_COMMIT: 92c57d8e1f626b7e293fdeb3ac0f6e56bd76691b
      EXPECTED_TREE: afe853c3afa1e445caad93ceb4bde1ad9bd51e1d
      TARGET_BRANCH: migration/contest-field-compat-applied-v1
      API_PYTHON: /opt/python/3.11.9/bin/python3.11
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - name: Verify local sealed commit
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$WORK" 2>/dev/null || true
          cd "$WORK"
          test "$(git rev-parse HEAD)" = "$EXPECTED_LOCAL_COMMIT"
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = "14"
          test -z "$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '(__pycache__|\.py[co]$)' || true)"
          echo "LOCAL_SEALED_COMMIT=PASS"

      - name: Publish Blob Tree Commit and Ref through API
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          "$API_PYTHON" - <<'PY' | tee /tmp/field-compat-api-publish.json
          from __future__ import annotations

          import base64
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          root = Path(os.environ["WORK"])
          owner = "yu5-520"
          repo = "AI-e-commerce-assistant-Public-version"
          base_commit = os.environ["BASE_COMMIT"]
          base_tree = os.environ["BASE_TREE"]
          expected_local_commit = os.environ["EXPECTED_LOCAL_COMMIT"]
          expected_tree = os.environ["EXPECTED_TREE"]
          target_branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GH_API_TOKEN"]
          api = f"https://api.github.com/repos/{owner}/{repo}"

          def git(*args: str) -> str:
              return subprocess.run(
                  ["git", *args], cwd=root, check=True,
                  capture_output=True, text=True,
              ).stdout.strip()

          def request(method: str, path: str, payload=None):
              body = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              last = None
              for attempt in range(1, 9):
                  req = urllib.request.Request(
                      api + path,
                      data=body,
                      method=method,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "contest-field-compat-api-publisher",
                          "Content-Type": "application/json",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return json.loads(response.read().decode())
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                      last = exc
                      if isinstance(exc, urllib.error.HTTPError) and exc.code < 500 and exc.code not in {408, 409, 429}:
                          detail = exc.read().decode(errors="replace")
                          raise RuntimeError(f"GITHUB_API_{method}_{path}:{exc.code}:{detail}") from exc
                      time.sleep(attempt * 5)
              raise RuntimeError(f"GITHUB_API_RETRIES_EXHAUSTED:{method}:{path}:{last}")

          assert git("rev-parse", "HEAD") == expected_local_commit
          assert git("rev-parse", "HEAD^") == base_commit
          assert git("rev-parse", "HEAD^{tree}") == expected_tree

          current_ref = request("GET", f"/git/ref/heads/{target_branch}")
          current_sha = current_ref["object"]["sha"]
          if current_sha != base_commit:
              raise RuntimeError(f"TARGET_BRANCH_LEASE_MISMATCH:{current_sha}:{base_commit}")

          paths = git("diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD").splitlines()
          if len(paths) != 14:
              raise RuntimeError(f"FILE_COUNT_MISMATCH:{len(paths)}")

          entries = []
          blobs = []
          for relative in paths:
              data = (root / relative).read_bytes()
              blob = request("POST", "/git/blobs", {
                  "content": base64.b64encode(data).decode(),
                  "encoding": "base64",
              })
              mode_line = git("ls-tree", base_commit, "--", relative)
              mode = mode_line.split()[0] if mode_line else "100644"
              entries.append({
                  "path": relative,
                  "mode": mode,
                  "type": "blob",
                  "sha": blob["sha"],
              })
              blobs.append({"path": relative, "sha": blob["sha"], "size": len(data), "mode": mode})

          tree = request("POST", "/git/trees", {
              "base_tree": base_tree,
              "tree": entries,
          })
          if tree["sha"] != expected_tree:
              raise RuntimeError(f"TREE_SHA_MISMATCH:{tree['sha']}:{expected_tree}")

          commit = request("POST", "/git/commits", {
              "message": "migration(contest): apply verified dual-read new-write fields [skip ci]",
              "tree": tree["sha"],
              "parents": [base_commit],
          })

          request("PATCH", f"/git/refs/heads/{target_branch}", {
              "sha": commit["sha"],
              "force": False,
          })

          remote_ref = request("GET", f"/git/ref/heads/{target_branch}")
          remote_commit = request("GET", f"/git/commits/{remote_ref['object']['sha']}")
          if remote_ref["object"]["sha"] != commit["sha"]:
              raise RuntimeError("REMOTE_REF_MISMATCH")
          if remote_commit["tree"]["sha"] != expected_tree:
              raise RuntimeError("REMOTE_TREE_MISMATCH")
          if [item["sha"] for item in remote_commit.get("parents") or []] != [base_commit]:
              raise RuntimeError("REMOTE_PARENT_MISMATCH")

          result = {
              "schema": "contest.field_compat_api_publish_receipt.v1",
              "state": "FIELD_COMPATIBILITY_APPLIED_VERIFIED",
              "sourceLocalCommit": expected_local_commit,
              "remoteCommit": commit["sha"],
              "parentCommit": base_commit,
              "treeSha": tree["sha"],
              "targetBranch": target_branch,
              "fileCount": len(paths),
              "blobs": blobs,
              "mainMutated": False,
              "physicalDeletionExecuted": False,
              "databaseMutated": False,
              "providerCallsExecuted": 0,
          }
          print(json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2))
          PY

          grep -q '"state": "FIELD_COMPATIBILITY_APPLIED_VERIFIED"' /tmp/field-compat-api-publish.json
          grep -q "\"treeSha\": \"$EXPECTED_TREE\"" /tmp/field-compat-api-publish.json
          grep -q '"fileCount": 14' /tmp/field-compat-api-publish.json
          echo "FIELD_COMPAT_API_PUBLISH=PASS"

      - name: Upload API publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: contest-field-compat-api-publish-receipt
          path: /tmp/field-compat-api-publish.json
          if-no-files-found: error
          retention-days: 14
