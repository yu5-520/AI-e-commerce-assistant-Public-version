name: Resume layered root composition review

on:
  push:
    branches:
      - migration/bulk-bootstrap
    paths:
      - .github/workflows/contest-root-composition-resume-once.yml

permissions:
  contents: write

concurrency:
  group: contest-root-composition-resume-once
  cancel-in-progress: false

jobs:
  regenerate-root-evidence:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      TARGET_BRANCH: analysis/contest-lineage-v1
      AUDIT_PYTHON: /opt/python/3.11.9/bin/python3.11
      Z_INTERFACE_ROOT: governance/contest/z-interface/Z1.0.5
      EXPECTED_Z_COMPILER_BLOB: 7a9546b02fd598548891fd080c98a6553695b796
      EXPECTED_GOVERNANCE_BLOB: ab680dbf7351f48218ffcc5496c85a3fcf4f7d99
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Verify composition authorities
        shell: bash
        run: |
          set -euo pipefail
          test -x "$AUDIT_PYTHON"
          "$AUDIT_PYTHON" -m py_compile \
            tools/contest_governance/root_equivalence.py \
            tools/contest_governance/run_selection.py

          interface="$GITHUB_WORKSPACE/$Z_INTERFACE_ROOT/tools/registry_compiler/compile_registry.py"
          test "$(git hash-object "$interface")" = "$EXPECTED_Z_COMPILER_BLOB"
          test "$(git hash-object GOVERNANCE_VERSION.md)" = "$EXPECTED_GOVERNANCE_BLOB"
          grep -q 'Registry Root Hash: sha256:ff37e43cd374986b1edf1ff735e97d6b19c9635efd2a0167e68f2943444dcdbd' GOVERNANCE_VERSION.md
          echo "ROOT_COMPOSITION_AUTHORITIES=PASS"

      - name: Generate verified root-composition review
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          rm -rf governance/contest/generated

          "$AUDIT_PYTHON" tools/contest_governance/run_selection.py \
            --root "$GITHUB_WORKSPACE" \
            --request governance/contest/selection-request.json \
            --output governance/contest/generated \
            --z-source "$GITHUB_WORKSPACE/$Z_INTERFACE_ROOT" \
            | tee /tmp/contest-root-composition-resume-summary.json

          grep -q '"rootEquivalent": true' governance/contest/generated/registry-snapshot.json
          grep -q '"verified": true' governance/contest/generated/registry-snapshot.json
          grep -q '"layerDeclarationsMatch": true' governance/contest/generated/registry-snapshot.json
          grep -q '"observedRootsMatchContract": true' governance/contest/generated/registry-snapshot.json
          grep -q '"literalRootEqualityRequired": false' governance/contest/generated/registry-snapshot.json
          grep -q 'REGISTRY_DOCUMENTS_VERIFIED_LAYERED_ROOT_COMPOSITION_VERIFIED' governance/contest/generated/contest-chain-review.json
          ! grep -q 'LAYERED_REGISTRY_ROOTS_NOT_EQUIVALENT' governance/contest/generated/contest-chain-review.json
          ! grep -q 'LAYERED_ROOT_COMPOSITION_NOT_VERIFIED' governance/contest/generated/contest-chain-review.json
          grep -q '"registryRootEquivalencePending": false' governance/contest/generated/execution-receipt.json
          grep -q '"registryRootEquivalenceMode": "LAYERED_ROOT_COMPOSITION"' governance/contest/generated/execution-receipt.json
          grep -q '"businessRuntimeMutated": false' governance/contest/generated/execution-receipt.json
          grep -q '"databaseMutated": false' governance/contest/generated/execution-receipt.json
          grep -q '"providerCallsExecuted": 0' governance/contest/generated/execution-receipt.json
          grep -q '"physicalDeletionExecuted": false' governance/contest/generated/execution-receipt.json
          echo "ROOT_COMPOSITION_REVIEW=PASS"

      - name: Commit resealed evidence
        shell: bash
        run: |
          set -euo pipefail
          git add governance/contest/generated
          forbidden="$(git diff --cached --name-only | grep -Ev '^governance/contest/generated/' || true)"
          test -z "$forbidden"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "governance(contest): verify layered root composition [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo "ROOT_EVIDENCE_PUSH=PASS"
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 10))
          done

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: contest-root-composition-resume
          path: |
            governance/contest/generated
            /tmp/contest-root-composition-resume-summary.json
          if-no-files-found: error
          retention-days: 14
