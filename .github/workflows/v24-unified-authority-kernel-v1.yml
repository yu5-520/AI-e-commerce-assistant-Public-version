name: V24 Unified Authority Kernel V1

on:
  pull_request:
    paths:
      - 'java-control-plane/**'
      - 'governance/v24/unified-authority-kernel-policy-v1.json'
      - 'scripts/verify_v24_unified_authority_kernel_v1.sh'
      - '.github/workflows/v24-unified-authority-kernel-v1.yml'
  push:
    branches:
      - main
    paths:
      - 'java-control-plane/**'
      - 'governance/v24/unified-authority-kernel-policy-v1.json'
      - 'scripts/verify_v24_unified_authority_kernel_v1.sh'
      - '.github/workflows/v24-unified-authority-kernel-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v24-unified-authority-kernel-v1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified-authority-shadow-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Unified Authority Kernel V1
        run: |
          set -euo pipefail
          chmod +x scripts/verify_v24_unified_authority_kernel_v1.sh
          bash scripts/verify_v24_unified_authority_kernel_v1.sh

      - name: Verify shadow-only authority boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('dist/v24-unified-authority-kernel-v1/verification-report.json').read_text(encoding='utf-8'))
          assert report['verified'] is True
          assert report['enforcementMode'] == 'SHADOW'
          assert report['authorityGrantCreated'] is False
          assert report['productionAuthorityOwnershipChanged'] is False
          assert report['existingAuthorityAdaptersReplaced'] is False
          assert report['singleAuthorityGenerationRootRequired'] is True
          print('V24_UNIFIED_AUTHORITY_SHADOW_BOUNDARY=PASS')
          PY

      - name: Upload authority verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: v24-unified-authority-kernel-v1-${{ github.sha }}
          path: |
            dist/v24-unified-authority-kernel-v1/*.json
            governance/v24/unified-authority-kernel-policy-v1.json
          if-no-files-found: error
          retention-days: 14
