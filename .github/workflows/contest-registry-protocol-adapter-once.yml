name: Verify contest Registry protocol adapter once

on:
  push:
    branches:
      - migration/bulk-bootstrap
    paths:
      - .github/workflows/contest-registry-protocol-adapter-once.yml

permissions:
  contents: write

concurrency:
  group: contest-registry-protocol-adapter-once
  cancel-in-progress: false

jobs:
  verify-protocol-adapter:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      TARGET_BRANCH: analysis/contest-lineage-v1
      AUDIT_PYTHON: /opt/python/3.11.9/bin/python3.11
      EXPECTED_Z_COMPILER_BLOB: 7a9546b02fd598548891fd080c98a6553695b796
      Z_INTERFACE: governance/contest/z-interface/Z1.0.5/tools/registry_compiler/compile_registry.py
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Verify source and interface identities
        shell: bash
        run: |
          set -euo pipefail
          test -x "$AUDIT_PYTHON"
          test "$($AUDIT_PYTHON --version 2>&1)" = "Python 3.11.9"
          test "$(git hash-object "$Z_INTERFACE")" = "$EXPECTED_Z_COMPILER_BLOB"
          test -f governance/contest/registry-protocol-map.json
          test -f .z/adapter/registry-layout.json
          "$AUDIT_PYTHON" -m py_compile tools/contest_governance/verify_registry_protocol_adapter.py
          echo "REGISTRY_PROTOCOL_IDENTITIES=PASS"

      - name: Verify product Registry through pinned Z interface
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          "$AUDIT_PYTHON" tools/contest_governance/verify_registry_protocol_adapter.py \
            --root "$GITHUB_WORKSPACE" \
            --output governance/contest/generated \
            | tee /tmp/contest-registry-protocol-summary.json

          test -f governance/contest/generated/registry-protocol-adapter-review.json
          test -f governance/contest/generated/registry-protocol-adapter-review.md
          test -f governance/contest/generated/registry-protocol-adapter-receipt.json
          grep -q '"sourceDocumentHashesVerified": true' governance/contest/generated/registry-protocol-adapter-review.json
          grep -q '"zCompilerVerified": true' governance/contest/generated/registry-protocol-adapter-review.json
          grep -q '"normalizedRegistryFileCount": 8' governance/contest/generated/registry-protocol-adapter-review.json
          grep -q 'PROTOCOL_ADAPTER_VERIFIED_RUNTIME_SWITCH_NOT_AUTHORIZED' governance/contest/generated/registry-protocol-adapter-review.json
          grep -q '"businessRuntimeMutated": false' governance/contest/generated/registry-protocol-adapter-receipt.json
          grep -q '"databaseMutated": false' governance/contest/generated/registry-protocol-adapter-receipt.json
          grep -q '"providerCallsExecuted": 0' governance/contest/generated/registry-protocol-adapter-receipt.json
          grep -q '"physicalDeletionExecuted": false' governance/contest/generated/registry-protocol-adapter-receipt.json
          echo "REGISTRY_PROTOCOL_ADAPTER=PASS"

      - name: Commit protocol evidence
        shell: bash
        run: |
          set -euo pipefail
          git add \
            governance/contest/generated/registry-protocol-adapter-review.json \
            governance/contest/generated/registry-protocol-adapter-review.md \
            governance/contest/generated/registry-protocol-adapter-receipt.json
          forbidden="$(git diff --cached --name-only | grep -Ev '^governance/contest/generated/registry-protocol-adapter-(review\.json|review\.md|receipt\.json)$' || true)"
          test -z "$forbidden"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "governance(contest): verify product Registry Z protocol adapter [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo "REGISTRY_PROTOCOL_EVIDENCE_PUSH=PASS"
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 10))
          done

      - name: Upload protocol evidence
        uses: actions/upload-artifact@v4
        with:
          name: contest-registry-protocol-adapter
          path: |
            governance/contest/generated/registry-protocol-adapter-review.json
            governance/contest/generated/registry-protocol-adapter-review.md
            governance/contest/generated/registry-protocol-adapter-receipt.json
            /tmp/contest-registry-protocol-summary.json
          if-no-files-found: error
          retention-days: 14
