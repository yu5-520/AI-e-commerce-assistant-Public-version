name: Patch Release Hash Seal Runner

on:
  pull_request:
    paths:
      - '.github/workflows/patch-release-hash-seal-runner.yml'
      - '.github/workflows/release-hash-seal.yml'

permissions:
  contents: write

concurrency:
  group: patch-release-hash-seal-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-pr-runner:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Patch PR validation runner through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          branch = os.environ['HEAD_BRANCH']
          token = os.environ['GH_TOKEN']
          path = '.github/workflows/release-hash-seal.yml'
          api = f'https://api.github.com/repos/{repository}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'release-hash-seal-runner-patcher',
          }

          request = urllib.request.Request(
              api + '?' + urllib.parse.urlencode({'ref': branch}),
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              current = json.load(response)
          content = base64.b64decode(current['content']).decode('utf-8')
          lines = content.splitlines()
          start = next(i for i, line in enumerate(lines) if line == '  pr-validation:')
          end = next(
              i for i, line in enumerate(lines[start + 1:], start + 1)
              if line == '  seal-release:'
          )
          runner_line = next(
              i for i in range(start + 1, end)
              if lines[i].strip().startswith('runs-on:')
          )
          if lines[runner_line].strip() == 'runs-on: self-hosted':
              print('PR validation already uses self-hosted runner')
              raise SystemExit(0)

          old = lines[runner_line]
          lines[runner_line] = '    runs-on: self-hosted'
          updated = '\n'.join(lines) + '\n'
          payload = json.dumps(
              {
                  'message': 'ci: PR哈希封印校验改用自托管Runner',
                  'content': base64.b64encode(updated.encode('utf-8')).decode('ascii'),
                  'sha': current['sha'],
                  'branch': branch,
              }
          ).encode('utf-8')
          write_request = urllib.request.Request(
              api,
              data=payload,
              method='PUT',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(write_request, timeout=120) as response:
              result = json.load(response)
          print(f"Patched {old!r} -> {lines[runner_line]!r}")
          print(f"commit={result['commit']['sha']}")
          PY
