name: Competition Agent1 Exact-Hash Normalization Lineage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: competition-agent1-exact-hash-normalization-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-agent1-exact-hash-normalization:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.sha }}
      COMPETITION_VENV_ROOT: /opt/actions-runner-public/competition-runtime-venvs
      OVERLAY: governance/agent1_exact_hash_normalization_field_semantics_v1.json
      LINEAGE_DIR: dist/competition-agent1-normalization-lineage
      REPORT: dist/agent1-exact-hash-normalization-lineage-report.json
    steps:
      - name: Materialize exact TARGET source
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/agent1-normalization-${TARGET_SHA}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/agent1-normalization-${TARGET_SHA}"
          rm -f "$ARCHIVE"
          rm -rf "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          downloaded=0
          for attempt in $(seq 1 8); do
            echo "Archive download ${TARGET_SHA} attempt ${attempt}/8"
            if curl \
              --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 300 \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${TARGET_SHA}" \
              -o "$ARCHIVE"; then
              downloaded=1
              break
            fi
            rm -f "$ARCHIVE"
            sleep $((attempt * 5))
          done
          test "$downloaded" = "1"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          test -f "$EXTRACTED/scripts/compile_competition_lineage.py"
          test -f "$EXTRACTED/scripts/verify_agent1_exact_hash_normalization_lineage.py"
          test -f "$EXTRACTED/$OVERLAY"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/

      - name: Resolve ECS Python 3.10+
        run: |
          set -euo pipefail
          for candidate in \
            /opt/python/3.11.9/bin/python3.11 \
            python3.13 python3.12 python3.11 python3.10 \
            /usr/local/bin/python3.13 /usr/local/bin/python3.12 \
            /usr/local/bin/python3.11 /usr/local/bin/python3.10 \
            /usr/bin/python3.13 /usr/bin/python3.12 \
            /usr/bin/python3.11 /usr/bin/python3.10; do
            if command -v "$candidate" >/dev/null 2>&1; then
              resolved="$(command -v "$candidate")"
            elif [ -x "$candidate" ]; then
              resolved="$candidate"
            else
              continue
            fi
            if "$resolved" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' 2>/dev/null; then
              printf 'PYTHON_BIN=%s\n' "$resolved" >> "$GITHUB_ENV"
              "$resolved" -c 'import platform; print("python=" + platform.python_version())'
              exit 0
            fi
          done
          echo 'No usable Python 3.10+ runtime exists on ECS runner.' >&2
          exit 1

      - name: Compile exact TARGET Hash Lineage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          rm -rf "$LINEAGE_DIR"
          "$PYTHON_BIN" -m py_compile \
            scripts/compile_competition_lineage.py \
            scripts/verify_agent1_exact_hash_normalization_lineage.py \
            src/services/real_product_judgment_agent_v2259_service.py \
            tests/test_agent1_exact_hash_native_normalizer_v22510.py
          "$PYTHON_BIN" scripts/compile_competition_lineage.py \
            --source-commit "$TARGET_SHA" \
            --output-dir "$LINEAGE_DIR"

      - name: Verify unified Registry and recall Agent1 TARGET consumers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/verify_agent1_exact_hash_normalization_lineage.py \
            --lineage-graph "$LINEAGE_DIR/lineage-graph.json" \
            --overlay "$OVERLAY" \
            --output "$REPORT"
          "$PYTHON_BIN" - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path('dist/agent1-exact-hash-normalization-lineage-report.json').read_text(encoding='utf-8'))
          assert report.get('verified') is True, report.get('findings')
          assert report.get('registeredFieldCount') == 11, report.get('registeredFieldCount')
          assert report.get('registeredModuleContractCount') == 1, report.get('registeredModuleContractCount')
          assert not report.get('findings'), report.get('findings')
          print('agent1ExactHashLineageHash=' + str(report.get('verificationHash')))
          print('consumerRuntimeFileCount=' + str(len(report.get('consumerRuntimeFiles') or [])))
          print('legacyWhitelistEvidence=' + json.dumps(report.get('legacyWhitelistEvidence') or {}, ensure_ascii=False, sort_keys=True))
          for field_id, lineage in sorted((report.get('fieldLineage') or {}).items()):
              print('FIELD ' + field_id + ' aliases=' + ','.join(lineage.get('aliases') or []))
              for hit in lineage.get('runtimeHits') or []:
                  aliases=','.join(f'{key}:{value}' for key,value in sorted((hit.get('aliases') or {}).items()))
                  print('  ' + str(hit.get('path')) + ' ' + str(hit.get('contentHash')) + ' hits=' + str(hit.get('occurrenceCount')) + ' aliases=' + aliases)
          PY

      - name: Verify exact-hash normalizer source contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path
          source=Path('src/services/real_product_judgment_agent_v2259_service.py').read_text(encoding='utf-8')
          required=[
              'NORMALIZATION_AUTHORITY = "itemExecutionId+inputContentHash"',
              'LEGACY_IDENTITY_REMATCH_ALLOWED = False',
              'LEGACY_ACTION_FAMILY_WHITELIST_ALLOWED = False',
              'execution_contract._apply_execution_lock(item, canonical)',
              'legacyActionFamilyWhitelistAllowed',
          ]
          forbidden=[
              'legacy._normalize_judgments(',
              'legacy._source_maps(products)',
              'ALLOWED_ACTION_FAMILIES',
          ]
          missing=[literal for literal in required if literal not in source]
          present=[literal for literal in forbidden if literal in source]
          assert not missing, 'agent1_exact_hash_contract_missing:' + ','.join(missing)
          assert not present, 'agent1_legacy_authority_reintroduced:' + ','.join(present)
          print('agent1ExactHashNormalizerContract=verified')
          PY

      - name: Prepare cached exact application environment
        run: |
          set -euo pipefail
          chmod +x scripts/prepare_competition_runtime_venv.sh
          mkdir -p dist/agent1-normalization-env
          RUNTIME_PYTHON="$(
            COMPETITION_VENV_ROOT="$COMPETITION_VENV_ROOT" \
            COMPETITION_BASE_PYTHON="$PYTHON_BIN" \
            bash scripts/prepare_competition_runtime_venv.sh \
              "$GITHUB_WORKSPACE" \
              "$GITHUB_WORKSPACE/dist/agent1-normalization-env" \
              | tee dist/agent1-normalization-env/runtime-environment-summary.log \
              | tail -n 1
          )"
          [ -x "$RUNTIME_PYTHON" ]
          printf 'COMPETITION_RUNTIME_PYTHON=%s\n' "$RUNTIME_PYTHON" >> "$GITHUB_ENV"

      - name: Replay P10007 exact-hash regression without provider call
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          "$COMPETITION_RUNTIME_PYTHON" tests/test_agent1_exact_hash_native_normalizer_v22510.py

      - name: Upload Agent1 lineage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-exact-hash-normalization-lineage-${{ env.TARGET_SHA }}
          path: |
            dist/agent1-exact-hash-normalization-lineage-report.json
            dist/competition-agent1-normalization-lineage
            dist/agent1-normalization-env/runtime-environment-summary.log
          if-no-files-found: warn
          retention-days: 7
