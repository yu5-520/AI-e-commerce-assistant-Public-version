name: V24 Production Authority Bundle

on:
  pull_request:
    paths:
      - 'java-control-plane/**'
      - 'governance/v24/production-authority-bundle-v24.json'
      - 'scripts/build_v24_production_bundle.sh'
      - 'scripts/verify_v24_production_bundle.sh'
      - 'scripts/start_v24_authority.sh'
      - 'release/release-policy.json'
      - 'scripts/release_verifier.py'
      - 'scripts/check_release_contract.py'
      - '.github/workflows/release-hash-seal.yml'
      - '.github/workflows/v24-production-authority-bundle.yml'
  push:
    branches:
      - main
    paths:
      - 'java-control-plane/**'
      - 'governance/v24/production-authority-bundle-v24.json'
      - 'scripts/build_v24_production_bundle.sh'
      - 'scripts/verify_v24_production_bundle.sh'
      - 'scripts/start_v24_authority.sh'
      - 'release/release-policy.json'
      - 'scripts/release_verifier.py'
      - 'scripts/check_release_contract.py'
      - '.github/workflows/release-hash-seal.yml'
      - '.github/workflows/v24-production-authority-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v24-production-authority-bundle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-authority-bundle:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      V24_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Materialize exact source archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/v24-production-${V24_SOURCE_COMMIT}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/v24-production-${V24_SOURCE_COMMIT}"
          rm -rf "$ARCHIVE" "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          curl --fail --location --silent --show-error             --connect-timeout 20 --max-time 300             -H "Authorization: Bearer ${GH_READ_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${V24_SOURCE_COMMIT}"             -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/

      - name: Prepare exact Temurin JDK tool 17.0.20+101
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17.0.20+101'

      - name: Prepare minimal Python build helper
        shell: bash
        run: |
          set -euo pipefail
          test -x /opt/python/3.11.9/bin/python3.11
          /opt/python/3.11.9/bin/python3.11 -m venv .venv

      - name: Build and verify sealed Java readiness bundle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_v24_production_bundle.sh scripts/verify_v24_production_bundle.sh
          V24_JAVA_HOME="$JAVA_HOME"           V24_SOURCE_COMMIT="$V24_SOURCE_COMMIT"             bash scripts/verify_v24_production_bundle.sh

      - name: Verify retained V24 Phase1-Phase5 boundaries
        shell: bash
        run: |
          set -euo pipefail
          for phase in 1 2 3 4 5; do
            V24_SOURCE_COMMIT="$V24_SOURCE_COMMIT"               bash "scripts/verify_v24_java_phase${phase}.sh"
          done
