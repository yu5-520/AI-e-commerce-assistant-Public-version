name: V26 Field Authority Phase1

on:
  pull_request:
    paths:
      - 'config/v26_field_authority_contract.json'
      - 'config/v23_registry_runtime.json'
      - 'rag/manifest/v269b_manifest.json'
      - 'src/services/v26_field_authority_contract_service.py'
      - 'src/services/runtime_contract_guard_v1_service.py'
      - 'governance/v26-field-authority-update-policy.json'
      - 'java-control-plane/src/main/java/com/zcentury/v24/ProductLifecycleAuthority.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/VolatilityEnvelope.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/PreAgentAdmissionGate.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/ReviewContractAuthority.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/SystemReviewAuthority.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/LocalSubgraphRevisionAuthority.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/V263PreAgentAdmissionMain.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/V264SystemReviewMain.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/V266LocalSubgraphRevisionMain.java'
      - 'scripts/verify_v24_production_bundle.sh'
      - 'tests/test_v26_field_authority_contract.py'
      - 'tests/test_v22_4_v267_closeout.py'
      - 'src/services/v26_sop_evidence_service.py'
      - 'src/services/v26_revision_acceptance_service.py'
      - 'java-control-plane/src/main/java/com/zcentury/v24/V267CloseoutMain.java'
      - 'docs/V26_1_FIELD_AUTHORITY_CONTRACT.md'
      - 'docs/V26_3_PRE_AGENT_ADMISSION.md'
      - 'docs/V26_4_SYSTEM_REVIEW.md'
      - 'docs/V26_6_LOCAL_SUBGRAPH_REVISION.md'
      - '.github/workflows/v26-field-authority-phase1.yml'
      - '.github/workflows/competition-registry-lineage.yml'
  push:
    branches:
      - main
    paths:
      - 'config/v26_field_authority_contract.json'
      - 'config/v23_registry_runtime.json'
      - 'rag/manifest/v269b_manifest.json'
      - 'src/services/v26_field_authority_contract_service.py'
      - 'src/services/runtime_contract_guard_v1_service.py'
      - 'governance/v26-field-authority-update-policy.json'
      - 'java-control-plane/src/main/java/com/zcentury/v24/ProductLifecycleAuthority.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/VolatilityEnvelope.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/PreAgentAdmissionGate.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/ReviewContractAuthority.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/SystemReviewAuthority.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/LocalSubgraphRevisionAuthority.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/V263PreAgentAdmissionMain.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/V264SystemReviewMain.java'
      - 'java-control-plane/src/main/java/com/zcentury/v24/V266LocalSubgraphRevisionMain.java'
      - 'scripts/verify_v24_production_bundle.sh'
      - 'tests/test_v26_field_authority_contract.py'
      - 'tests/test_v22_4_v267_closeout.py'
      - 'src/services/v26_sop_evidence_service.py'
      - 'src/services/v26_revision_acceptance_service.py'
      - 'java-control-plane/src/main/java/com/zcentury/v24/V267CloseoutMain.java'
      - 'docs/V26_4_SYSTEM_REVIEW.md'
      - 'docs/V26_6_LOCAL_SUBGRAPH_REVISION.md'
      - '.github/workflows/v26-field-authority-phase1.yml'
      - '.github/workflows/competition-registry-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v26-field-authority-phase1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  field-authority-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17.0.20+101'

      - name: Verify V26.1 contract documents and registry projection
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/v26_field_authority_contract.json >/dev/null
          python -m json.tool config/v23_registry_runtime.json >/dev/null
          python -m json.tool governance/v26-field-authority-update-policy.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path('config/v26_field_authority_contract.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('config/v23_registry_runtime.json').read_text(encoding='utf-8'))
          policy = json.loads(Path('governance/v26-field-authority-update-policy.json').read_text(encoding='utf-8'))

          assert contract['version'] == '26.1.0'
          assert contract['businessGraphVersion'] == '26.5.0'
          assert contract['localSubgraphRevisionVersion'] == '26.6.0'
          assert contract['headerRegistrationRequired'] is True
          assert contract['semanticPolicy']['authorityValidatorMayInspectBusinessWording'] is False
          assert contract['numericAuthority']['FACT'] == 'system_only'
          assert contract['numericAuthority']['DERIVED'] == 'system_only'
          assert contract['numericAuthority']['JUDGEMENT_NUMERIC'] == 'agent1_only'
          assert contract['numericAuthority']['PLAN'] == 'agent2_only'
          assert contract['numericAuthority']['agent3PlanNumberMode'] == 'reference_only'
          assert contract['stageAuthority']['systemStage']['dynamicModelNodesAllowed'] is False
          assert contract['stageAuthority']['operationStage']['dynamicBusinessStagesAllowed'] is True
          required_revision_headers = {
              'revision.review_hash',
              'revision.scope_mode',
              'revision.breached_metrics',
              'revision.parent_action_graph_hash',
              'revision.reopen_judgement_node_hashes',
              'revision.reopen_action_node_hashes',
              'revision.reopen_operation_node_hashes',
              'revision.revision_hash',
          }
          assert required_revision_headers <= set(contract['registeredHeaders'])
          revision_policy = next(
              item for item in contract['namespacePolicies'] if item['prefix'] == 'revision.'
          )
          assert revision_policy['owner'] == 'java-control-plane'
          assert revision_policy['writableBy'] == ['system', 'java-control-plane']

          assert registry['fieldAuthorityContractVersion'] == '26.1.0'
          assert registry['fieldAuthorityContractPath'] == 'config/v26_field_authority_contract.json'
          assert registry['registryRootHash'] == 'sha256:c6308a05333fadc9467413cb7a68099d2e6958bceca0b265b764a4407b4eb0ac'
          required_modules = registry['requiredModules']
          assert isinstance(required_modules, list) and required_modules
          assert len(required_modules) == len(set(required_modules))
          assert set(required_modules) <= set(registry['modules'])
          base_modules = {
              'release_governance',
              'signal_admission',
              'agent1_input_projection',
              'agent1_runtime',
              'agent2_runtime',
              'agent3_input_projection',
              'agent3_runtime',
              'task_mapping',
              'task_pool',
              'frontend_view',
          }
          assert base_modules <= set(required_modules)
          manifest_path = Path('rag/manifest/v269b_manifest.json')
          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              if manifest.get('version') == '26.9.B.1':
                  b_modules = {'experience_store', 'evaluation_plane', 'experience_retrieval'}
                  if manifest.get('rolloutStatus') == 'active':
                      assert b_modules <= set(required_modules)
                  else:
                      assert not (b_modules & set(required_modules))
          assert registry['rules']['fieldHeaderAuthorityRequired'] is True
          assert registry['rules']['semanticBusinessWordingAuthorityInspectionForbidden'] is True
          assert registry['rules']['systemStageModelMutationForbidden'] is True

          assert policy['defaultProfile'] == 'v26_field_authority'
          profile = policy['profiles']['v26_field_authority']
          assert profile['allowRegistryModuleChanges'] is True
          assert profile['allowRuntimeMembershipChange'] is True
          assert profile['allowEdgeChanges'] is True
          print('V26_1_TO_V26_6_REGISTRY_CONTRACT=PASS')
          print('REQUIRED_MODULES=' + json.dumps(required_modules, ensure_ascii=False))
          PY

      - name: Compile V26.1 authority services
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            src/services/v26_field_authority_contract_service.py \
            src/services/runtime_contract_guard_v1_service.py

      - name: Verify V26.3 through V26.6 Java authority contracts
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${RUNNER_TEMP}/v26-java-classes"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          mapfile -t JAVA_SOURCES < <(find java-control-plane/src/main/java -type f -name '*.java' | sort)
          test "${#JAVA_SOURCES[@]}" -gt 0
          javac --release 17 -d "$BUILD_DIR" "${JAVA_SOURCES[@]}"
          java -cp "$BUILD_DIR" com.zcentury.v24.V263PreAgentAdmissionMain
          printf 'V26_3_PRE_AGENT_ADMISSION_HOSTED_GATE=PASS\n'
          java -cp "$BUILD_DIR" com.zcentury.v24.V264SystemReviewMain
          printf 'V26_4_SYSTEM_REVIEW_HOSTED_GATE=PASS\n'
          java -cp "$BUILD_DIR" com.zcentury.v24.V266LocalSubgraphRevisionMain
          java -cp "$BUILD_DIR" com.zcentury.v24.V267CloseoutMain
          printf 'V26_6_LOCAL_SUBGRAPH_REVISION_HOSTED_GATE=PASS\n'

      - name: Run V26.1 through V26.6 field authority regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_v26_field_authority_contract.py tests/test_v22_4_v267_closeout.py
