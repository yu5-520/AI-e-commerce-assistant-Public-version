name: Diagnose remaining contest Runner drift once

on:
  push:
    branches:
      - migration/bulk-bootstrap
    paths:
      - .github/workflows/contest-runner-drift-diagnose-once.yml

permissions:
  contents: write

concurrency:
  group: contest-runner-drift-diagnose-once
  cancel-in-progress: false

jobs:
  diagnose-runner-drift:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      TARGET_BRANCH: analysis/contest-lineage-v1
      AUDIT_PYTHON: /opt/python/3.11.9/bin/python3.11
      Z_INTERFACE_ROOT: governance/contest/z-interface/Z1.0.5
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Run full registered Runner diagnosis
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          mkdir -p governance/contest/generated

          "$AUDIT_PYTHON" - <<'PY' | tee governance/contest/generated/runner-drift-diagnostic.json
          from __future__ import annotations

          import importlib.util
          import json
          from pathlib import Path

          root = Path.cwd().resolve()
          z_path = root / "governance/contest/z-interface/Z1.0.5/tools/registry_compiler/compile_registry.py"
          spec = importlib.util.spec_from_file_location("_z_compile_for_diagnostic", z_path)
          if spec is None or spec.loader is None:
              raise SystemExit("Z_INTERFACE_LOAD_FAILED")
          z_compile = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(z_compile)

          from tools.contest_governance.run_selection import _load_adapter_documents
          import tools.registry_compiler.compile_registry as product_compile

          def adapter_load_registry_documents(_root=None):
              repository = Path(_root).resolve() if _root is not None else root
              loaded, _ = _load_adapter_documents(repository, z_compile.sha256_value)
              return loaded

          product_compile.load_registry_documents = adapter_load_registry_documents
          product_compile.sha256_value = z_compile.sha256_value

          from tools.registry_compiler.repository_audit import scan_repository
          from tools.registry_compiler.runner_dispatch_evidence import collect_runner_dispatch_evidence

          documents = adapter_load_registry_documents(root)
          modules = {
              str(item.get("moduleId")): item
              for item in documents["modules.json"].get("modules") or []
              if isinstance(item, dict) and str(item.get("moduleId") or "")
          }
          audit = scan_repository(root)
          module_audits = audit.get("moduleAudits") or {}

          diagnostics = []
          for module_id, module in sorted(modules.items()):
              runner = str(module.get("runner") or "")
              module_name, separator, symbol = runner.partition(":")
              direct = collect_runner_dispatch_evidence(
                  root,
                  module_name,
                  symbol if separator else "",
                  limit=20,
              )
              registered = dict(module_audits.get(module_id) or {})
              diagnostics.append(
                  {
                      "moduleId": module_id,
                      "status": module.get("status"),
                      "activationState": module.get("activationState"),
                      "runner": runner,
                      "runnerFileExists": registered.get("runnerFileExists"),
                      "runnerSymbolExists": registered.get("runnerSymbolExists"),
                      "auditDispatchEvidenceCount": registered.get("dispatchEvidenceCount"),
                      "directDispatchEvidenceCount": len(direct),
                      "auditDispatchEvidence": registered.get("dispatchEvidence") or [],
                      "directDispatchEvidence": direct,
                  }
              )

          result = {
              "schema": "contest.runner_drift_diagnostic.v1",
              "repositoryAuditVersion": audit.get("version"),
              "registeredModuleCount": len(modules),
              "runnerDriftCount": audit.get("summary", {}).get("runnerDriftCount"),
              "runnerDrift": audit.get("runnerDrift") or [],
              "modules": diagnostics,
              "businessRuntimeMutated": False,
              "databaseMutated": False,
              "providerCallsExecuted": 0,
              "physicalDeletionExecuted": False,
          }
          print(json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2))
          PY

          grep -q '"businessRuntimeMutated": false' governance/contest/generated/runner-drift-diagnostic.json
          echo "RUNNER_DRIFT_DIAGNOSTIC=PASS"

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git add governance/contest/generated/runner-drift-diagnostic.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "governance(contest): record complete Runner drift diagnostic [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo "RUNNER_DIAGNOSTIC_PUSH=PASS"
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 10))
          done

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: contest-runner-drift-diagnostic
          path: governance/contest/generated/runner-drift-diagnostic.json
          if-no-files-found: error
          retention-days: 14
