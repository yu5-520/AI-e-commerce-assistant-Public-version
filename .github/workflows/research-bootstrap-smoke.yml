name: Research Bootstrap Smoke

on:
  push:
    branches:
      - research/bootstrap-p2
    paths:
      - 'research_bootstrap/**'
      - '.github/workflows/research-bootstrap-smoke.yml'
      - 'src/services/v26_field_authority_contract_service.py'
      - 'config/v26_field_authority_contract.json'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Compile bootstrap harness
        run: python -m compileall -q research_bootstrap
      - name: Unit tests
        working-directory: research_bootstrap
        run: python -m unittest -v test_bootstrap.py test_research_controls.py test_v26_evidence_adapter.py
      - name: Build and validate P3.1 Seed Pack
        working-directory: research_bootstrap
        run: |
          set -euo pipefail
          python build_seed_pack_v2.py | tee seed-pack-build.json
      - name: Build blinded evaluator calibration packet
        working-directory: research_bootstrap
        run: |
          set -euo pipefail
          python build_calibration_packet.py | tee calibration-packet-build.json
      - name: Paired replay smoke
        working-directory: research_bootstrap
        run: |
          set -euo pipefail
          python smoke.py | tee bootstrap-smoke.json
      - name: Resume persistence smoke
        working-directory: research_bootstrap
        run: |
          set -euo pipefail
          python resume_persistence_smoke.py | tee resume-persistence-smoke.json
      - name: Provider binding contract smoke
        working-directory: research_bootstrap
        run: |
          set -euo pipefail
          python provider_binding_smoke.py | tee provider-binding-smoke.json
      - name: V26 authority adapter smoke
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python research_bootstrap/v26_adapter_smoke.py | tee research_bootstrap/v26-adapter-smoke.json
      - name: V26 normalized contract replay
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python research_bootstrap/v26_evidence_smoke.py | tee research_bootstrap/v26-evidence-smoke.json
      - name: Stage A activation gate must remain blocked
        working-directory: research_bootstrap
        run: |
          set -euo pipefail
          python activation_gate_smoke.py | tee activation-gate-smoke.json
      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-bootstrap-smoke
          path: |
            research_bootstrap/bootstrap-smoke.json
            research_bootstrap/resume-persistence-smoke.json
            research_bootstrap/provider-binding-smoke.json
            research_bootstrap/v26-adapter-smoke.json
            research_bootstrap/v26-evidence-smoke.json
            research_bootstrap/seed-pack-build.json
            research_bootstrap/seed_pack_v1.json
            research_bootstrap/calibration-packet-build.json
            research_bootstrap/calibration_packet_v1.json
            research_bootstrap/calibration_key_v1.json
            research_bootstrap/calibration_labels_template_v1.json
            research_bootstrap/activation-gate-smoke.json
          if-no-files-found: warn
