name: Fix Operator Boundary Migrator

on:
  push:
    branches:
      - competition/operator-core-boundary-v1
    paths:
      - '.github/workflows/fix-operator-migrator.yml'

permissions:
  contents: write

jobs:
  fix-migrator:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      PATCH_PYTHON: /opt/python/3.11.9/bin/python3.11
    steps:
      - name: Preserve the new boundary contract test
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          "$PATCH_PYTHON" - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          path = 'scripts/apply_operator_core_boundary.py'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'operator-boundary-migrator-fixer',
          }
          request = urllib.request.Request(
              api + '?' + urllib.parse.urlencode({'ref': branch}), headers=headers
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              current = json.load(response)
          source = base64.b64decode(current['content']).decode('utf-8')
          old = '''    for test in sorted((root / "tests").glob("test_*.py")):\n        content = test.read_text(encoding="utf-8", errors="ignore")\n'''
          new = '''    for test in sorted((root / "tests").glob("test_*.py")):\n        if test.name == "test_competition_operator_boundary.py":\n            continue\n        content = test.read_text(encoding="utf-8", errors="ignore")\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one migration test loop, found {source.count(old)}')
          source = source.replace(old, new, 1)
          compile(source, path, 'exec')
          payload = json.dumps({
              'message': 'fix: 保留运营核心边界合同测试',
              'content': base64.b64encode(source.encode('utf-8')).decode('ascii'),
              'sha': current['sha'],
              'branch': branch,
          }).encode('utf-8')
          write = urllib.request.Request(
              api,
              data=payload,
              method='PUT',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(write, timeout=120) as response:
              result = json.load(response)
          print(result['commit']['sha'])
          PY
