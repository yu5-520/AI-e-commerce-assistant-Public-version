name: Competition Authorized Candidate Deploy V2

on:
  push:
    branches:
      - architecture/hash-lineage-update-controller-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: competition-authorized-candidate-deploy-v2
  cancel-in-progress: false

jobs:
  deploy-sealed-candidate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-v2]')
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      TARGET_SOURCE_COMMIT: 778bdd91b3577a3c38c8f8ad011556f523b36221
      TARGET_RELEASE_RUN_ID: '31294942172'
      TARGET_ARTIFACT_ID: '9032670457'
      TARGET_ARTIFACT_NAME: release-candidate-778bdd91b3577a3c38c8f8ad011556f523b36221
      TARGET_ARTIFACT_ZIP_SHA256: 91ce9c24657b858241ef7fc0f6c770dd9b1727da0e09829569f185b787220738
      TARGET_BRANCH: architecture/hash-lineage-update-controller-v1
      PINNED_PYTHON: /opt/python/3.11.9/bin/python3.11
      EVIDENCE_DIR: /tmp/competition-authorized-deploy-v2
      CONTROLLER: /usr/local/sbin/ai-competition-authorized-deploy-v2
      ROOT_RECEIPT_BASE: /var/lib/ai-ecommerce-authorized-deploy-v2/receipts
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Stage exact branch source on ECS runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Publish bootstrap source location
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$GITHUB_SHA"
          test -f config/deployment/competition_authorized_deploy_v2_controller.sh
          test -f config/deployment/install_competition_authorized_deploy_v2_controller.sh
          echo "BOOTSTRAP_SOURCE_ROOT=$GITHUB_WORKSPACE"
          echo "BOOTSTRAP_SOURCE_HEAD=$ACTUAL_HEAD"
          echo "CONTROLLER_BLOB=$(git hash-object config/deployment/competition_authorized_deploy_v2_controller.sh)"
          echo "INSTALLER_BLOB=$(git hash-object config/deployment/install_competition_authorized_deploy_v2_controller.sh)"

      - name: Download exact validated sealed candidate
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          RUN_JSON="$EVIDENCE_DIR/release-run.json"
          META_JSON="$EVIDENCE_DIR/artifact-meta.json"
          ZIP="$EVIDENCE_DIR/release-candidate.zip"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RELEASE_RUN_ID}" \
            -o "$RUN_JSON"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}" \
            -o "$META_JSON"

          "$PINNED_PYTHON" - "$RUN_JSON" "$META_JSON" <<'PY'
          import json, os, sys
          run = json.load(open(sys.argv[1], encoding="utf-8"))
          artifact = json.load(open(sys.argv[2], encoding="utf-8"))
          assert str(run.get("id")) == os.environ["TARGET_RELEASE_RUN_ID"], run
          assert run.get("head_sha") == os.environ["TARGET_SOURCE_COMMIT"], run
          assert run.get("head_branch") == os.environ["TARGET_BRANCH"], run
          assert run.get("status") == "completed" and run.get("conclusion") == "success", run
          assert str(artifact.get("id")) == os.environ["TARGET_ARTIFACT_ID"], artifact
          assert artifact.get("name") == os.environ["TARGET_ARTIFACT_NAME"], artifact
          assert artifact.get("expired") is False, artifact
          assert artifact.get("digest") == "sha256:" + os.environ["TARGET_ARTIFACT_ZIP_SHA256"], artifact
          assert (artifact.get("workflow_run") or {}).get("head_sha") == os.environ["TARGET_SOURCE_COMMIT"], artifact
          print("SEALED_ARTIFACT_METADATA_OK")
          PY

          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 300 \
            -H "Authorization: Bearer ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" \
            -o "$ZIP"
          echo "${TARGET_ARTIFACT_ZIP_SHA256}  ${ZIP}" | sha256sum --check -
          echo "SEALED_ARTIFACT_DOWNLOAD_OK=true"

      - name: Deploy through immutable root controller
        run: |
          set -euo pipefail
          LOG="$EVIDENCE_DIR/controller.log"
          if [ ! -x "$CONTROLLER" ]; then
            echo "ERROR: immutable root controller is not installed: $CONTROLLER" | tee "$LOG" >&2
            echo "BOOTSTRAP_SOURCE_ROOT=$GITHUB_WORKSPACE" | tee -a "$LOG" >&2
            echo "BOOTSTRAP_SOURCE_HEAD=$GITHUB_SHA" | tee -a "$LOG" >&2
            echo "Run the one-time root bootstrap from the staged checkout: config/deployment/install_competition_authorized_deploy_v2_controller.sh" | tee -a "$LOG" >&2
            exit 78
          fi

          set +e
          if [ "$(id -u)" -eq 0 ]; then
            "$CONTROLLER" 2>&1 | tee "$LOG"
            status=${PIPESTATUS[0]}
          else
            sudo -n "$CONTROLLER" 2>&1 | tee "$LOG"
            status=${PIPESTATUS[0]}
          fi
          set -e

          if [ "$status" -ne 0 ]; then
            if grep -Eqi 'password is required|not allowed to execute|not in the sudoers|a terminal is required' "$LOG"; then
              echo "ERROR: root bridge is not bootstrapped for this runner user." >&2
              echo "Only the zero-argument controller should receive NOPASSWD; do not grant generic sudo." >&2
            fi
            exit "$status"
          fi
          grep -Fxq 'AUTHORIZED_DEPLOYMENT_OK=true' "$LOG"

      - name: Verify immutable deployment receipt
        run: |
          set -euo pipefail
          ROOT_RECEIPT="$ROOT_RECEIPT_BASE/$TARGET_SOURCE_COMMIT"
          test -r "$ROOT_RECEIPT/live-health.json"
          test -r "$ROOT_RECEIPT/live-release-identity.json"
          test -r "$ROOT_RECEIPT/controller-attestation.json"
          test -r "$ROOT_RECEIPT/deploy-release.log"

          OUT="$GITHUB_WORKSPACE/dist/competition-authorized-deploy-v2"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$ROOT_RECEIPT/live-health.json" \
             "$ROOT_RECEIPT/live-release-identity.json" \
             "$ROOT_RECEIPT/controller-attestation.json" \
             "$ROOT_RECEIPT/deploy-release.log" \
             "$EVIDENCE_DIR/controller.log" \
             "$OUT/"

          "$PINNED_PYTHON" - \
            "$OUT/live-release-identity.json" \
            "$OUT/controller-attestation.json" <<'PY'
          import json, os, sys
          identity = json.load(open(sys.argv[1], encoding="utf-8"))
          attestation = json.load(open(sys.argv[2], encoding="utf-8"))
          expected = os.environ["TARGET_SOURCE_COMMIT"]
          expected_zip = "sha256:" + os.environ["TARGET_ARTIFACT_ZIP_SHA256"]
          assert identity.get("verified") is True, identity
          assert identity.get("sourceCommit") == expected, identity
          assert identity.get("workerReleaseMatch") is True, identity
          assert identity.get("runtimeEnvironmentMatch") is True, identity
          assert identity.get("evidenceSemanticVerified") is True, identity
          assert attestation.get("sourceCommit") == expected, attestation
          assert attestation.get("artifactZipSha256") == expected_zip, attestation
          assert attestation.get("extraQwenModelCallPerformed") is False, attestation
          assert attestation.get("modelConfigPreserved") in ("true", "not-hash-verifiable"), attestation
          print("DEPLOYMENT_OK=true")
          print("sourceCommit=" + expected)
          print("artifactZipSha256=" + expected_zip)
          print("workerReleaseMatch=true")
          print("runtimeEnvironmentMatch=true")
          print("extraQwenModelCallPerformed=false")
          PY

          printf '%s\n' "$TARGET_SOURCE_COMMIT" > "$OUT/deployed-source-commit.txt"

      - name: Publish deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competition-authorized-deploy-v2-${{ env.TARGET_SOURCE_COMMIT }}
          path: |
            dist/competition-authorized-deploy-v2
            /tmp/competition-authorized-deploy-v2/controller.log
          if-no-files-found: warn
          retention-days: 30