name: Contest registry lineage review once

on:
  push:
    branches:
      - migration/bulk-bootstrap
    paths:
      - .github/workflows/contest-lineage-review-once.yml

permissions:
  contents: write

concurrency:
  group: contest-registry-lineage-review-once
  cancel-in-progress: false

jobs:
  registry-lineage-review:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      TARGET_BRANCH: analysis/contest-lineage-v1
      MOTHER_COMMIT: f5186451c80631fea550da17d481f5e8793215e5
      EXPECTED_Z_METADATA_TREE: ceb65191be6dde87bb514e41d1c1df7c5ae279d5
      EXPECTED_Z_ADAPTER_TREE: 4a0ed1645fac6d09a44c04a7d0fd2eb477584ee2
      Z_SOURCE_COMMIT: c924e646673a41857cca5e39650e022f9ce8c0a5
      EXPECTED_Z_COMPILER_BLOB: 7a9546b02fd598548891fd080c98a6553695b796
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Locate mother authority by immutable Git identities
        shell: bash
        run: |
          set -euo pipefail

          verify_mother() {
            local candidate="$1"
            test -n "$candidate" || return 1
            test -e "$candidate/.git" || return 1
            git config --global --add safe.directory "$candidate" 2>/dev/null || true
            git -C "$candidate" cat-file -e "$MOTHER_COMMIT^{commit}" 2>/dev/null || return 1
            test "$(git -C "$candidate" rev-parse "$MOTHER_COMMIT:.z" 2>/dev/null || true)" = "$EXPECTED_Z_METADATA_TREE" || return 1
            test "$(git -C "$candidate" rev-parse "$MOTHER_COMMIT:tools/z_adapter" 2>/dev/null || true)" = "$EXPECTED_Z_ADAPTER_TREE" || return 1
            return 0
          }

          mother_repository=""
          preferred="/opt/ai-ecommerce-assistant-deploy/releases/20260626042555_ba081064"

          if verify_mother "$preferred"; then
            mother_repository="$preferred"
          else
            while IFS= read -r candidate; do
              if verify_mother "$candidate"; then
                mother_repository="$candidate"
                break
              fi
            done < <(
              find /opt /srv -maxdepth 10 -name .git -printf '%h\n' 2>/dev/null \
                | awk 'NF && !seen[$0]++'
            )
          fi

          test -n "$mother_repository" || {
            echo "ERROR: mother authority not found by commit and subtree identities"
            exit 1
          }

          echo "MOTHER_REPOSITORY=$mother_repository" >> "$GITHUB_ENV"
          echo "MOTHER_REPOSITORY=$mother_repository"
          echo "MOTHER_AUTHORITY_IDENTITY=PASS"

      - name: Locate exact Z registry interface by Git blob identity
        shell: bash
        run: |
          set -euo pipefail

          interface_source=""
          preferred_candidates="$(
            printf '%s\n' \
              /srv/z-century/runner/_work/Z-Century/Z-Century \
              "$MOTHER_REPOSITORY/.z/dependency-src"
          )"

          candidate_files="$(
            {
              while IFS= read -r candidate; do
                test -n "$candidate" || continue
                printf '%s\n' "$candidate/tools/registry_compiler/compile_registry.py"
              done <<< "$preferred_candidates"

              find /opt /srv -maxdepth 15 -type f \
                -path '*/tools/registry_compiler/compile_registry.py' \
                -print 2>/dev/null || true
            } | awk 'NF && !seen[$0]++'
          )"

          while IFS= read -r candidate_file; do
            test -f "$candidate_file" || continue
            blob="$(git hash-object "$candidate_file" 2>/dev/null || true)"
            if test "$blob" = "$EXPECTED_Z_COMPILER_BLOB"; then
              interface_source="$candidate_file"
              break
            fi
          done <<< "$candidate_files"

          test -n "$interface_source" || {
            echo "ERROR: exact Z Registry compiler interface not found"
            echo "EXPECTED_Z_COMPILER_BLOB=$EXPECTED_Z_COMPILER_BLOB"
            exit 1
          }

          echo "Z_INTERFACE_SOURCE=$interface_source" >> "$GITHUB_ENV"
          echo "Z_INTERFACE_SOURCE=$interface_source"
          echo "Z_INTERFACE_BLOB_IDENTITY=PASS"

      - name: Transfer product Z adapter assets before validation
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT

          git -C "$MOTHER_REPOSITORY" archive "$MOTHER_COMMIT" .z tools/z_adapter \
            | tar -x -C "$stage"

          rm -rf .z tools/z_adapter
          cp -a "$stage/.z" .z
          mkdir -p tools
          cp -a "$stage/tools/z_adapter" tools/z_adapter

          git add .z tools/z_adapter
          candidate_tree="$(git write-tree)"
          actual_z_tree="$(git ls-tree "$candidate_tree" .z | awk '{print $3}')"
          actual_adapter_tree="$(git ls-tree "$candidate_tree" tools/z_adapter | awk '{print $3}')"

          echo "actual_z_tree=$actual_z_tree"
          echo "actual_adapter_tree=$actual_adapter_tree"
          test "$actual_z_tree" = "$EXPECTED_Z_METADATA_TREE"
          test "$actual_adapter_tree" = "$EXPECTED_Z_ADAPTER_TREE"
          echo "PRODUCT_Z_ADAPTER_TRANSFERRED_UNVERIFIED=PASS"

      - name: Materialize immutable Z interface source
        shell: bash
        run: |
          set -euo pipefail
          z_stage="$(mktemp -d)"
          mkdir -p "$z_stage/tools/registry_compiler"
          cp -a "$Z_INTERFACE_SOURCE" "$z_stage/tools/registry_compiler/compile_registry.py"

          test "$(git hash-object "$z_stage/tools/registry_compiler/compile_registry.py")" = "$EXPECTED_Z_COMPILER_BLOB"

          printf '%s\n' "$Z_SOURCE_COMMIT" > "$z_stage/Z_PINNED_SOURCE_COMMIT"
          printf '%s\n' "$EXPECTED_Z_COMPILER_BLOB" > "$z_stage/Z_REGISTRY_COMPILER_BLOB"

          echo "Z_CENTURY_SOURCE_DIR=$z_stage" >> "$GITHUB_ENV"
          echo "Z_STAGE_CLEANUP=$z_stage" >> "$GITHUB_ENV"
          echo "IMMUTABLE_Z_INTERFACE_MATERIALIZED=PASS"

      - name: Resolve report-only Python executor
        shell: bash
        run: |
          set -euo pipefail
          selected=""

          candidates="$(
            {
              command -v python3 2>/dev/null || true
              command -v python 2>/dev/null || true
              printf '%s\n' \
                /usr/bin/python3 \
                /usr/local/bin/python3 \
                /usr/bin/python \
                /usr/local/bin/python
              find /opt /srv -maxdepth 10 \( -type f -o -type l \) \
                \( -name python3.12 -o -name python3.11 -o -name python3.10 -o -name python3 -o -name python \) \
                -print 2>/dev/null || true
            } | awk 'NF && !seen[$0]++'
          )"

          while IFS= read -r candidate; do
            test -x "$candidate" || continue
            if "$candidate" - <<'PY' >/dev/null 2>&1
          import sys
          raise SystemExit(0 if sys.version_info >= (3, 10) else 1)
          PY
            then
              selected="$candidate"
              break
            fi
          done <<< "$candidates"

          test -n "$selected" || {
            echo "ERROR: runner-accessible Python >= 3.10 not found"
            exit 1
          }

          echo "AUDIT_PYTHON=$selected" >> "$GITHUB_ENV"
          "$selected" --version
          echo "REPORT_ONLY_PYTHON_RESOLVED=PASS"

      - name: Run registry to hash-lineage to selection to review
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          "$AUDIT_PYTHON" tools/contest_governance/run_selection.py \
            --root "$GITHUB_WORKSPACE" \
            --request governance/contest/selection-request.json \
            --output governance/contest/generated \
            --z-source "$Z_CENTURY_SOURCE_DIR" \
            | tee /tmp/contest-lineage-summary.json

          test -f governance/contest/generated/registry-snapshot.json
          test -f governance/contest/generated/hash-lineage-graph.json
          test -f governance/contest/generated/contest-selection-manifest.json
          test -f governance/contest/generated/contest-chain-review.json
          test -f governance/contest/generated/contest-chain-review.md
          test -f governance/contest/generated/execution-receipt.json

          grep -q '"reviewState": "REVIEW_PENDING"' governance/contest/generated/contest-chain-review.json
          grep -q '"physicalDeletionExecuted": false' governance/contest/generated/execution-receipt.json
          grep -q '"databaseMutated": false' governance/contest/generated/execution-receipt.json
          grep -q '"providerCallsExecuted": 0' governance/contest/generated/execution-receipt.json
          echo "REGISTRY_LINEAGE_SELECTION_REVIEW=PASS"

      - name: Enforce report-only changed-path boundary
        shell: bash
        run: |
          set -euo pipefail
          git add .z tools/z_adapter governance/contest/generated
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"

          forbidden="$(
            printf '%s\n' "$changed" \
              | grep -Ev '^(\.z/|tools/z_adapter/|governance/contest/generated/)' \
              || true
          )"
          test -z "$forbidden" || {
            echo "ERROR: report-only boundary violated"
            printf '%s\n' "$forbidden"
            exit 1
          }
          echo "REPORT_ONLY_PATH_BOUNDARY=PASS"

      - name: Commit review evidence to analysis branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "REVIEW_EVIDENCE_ALREADY_CURRENT=YES"
          else
            git commit -m "governance(contest): generate registry lineage selection review [skip ci]"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          echo "REVIEW_EVIDENCE_COMMITTED=PASS"

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contest-registry-lineage-review
          path: |
            governance/contest/generated
            /tmp/contest-lineage-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup immutable Z stage
        if: always()
        shell: bash
        run: |
          rm -rf "${Z_STAGE_CLEANUP:-}" 2>/dev/null || true
