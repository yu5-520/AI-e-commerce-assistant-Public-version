name: Verify exact runner dispatch evidence once

on:
  push:
    branches:
      - migration/bulk-bootstrap
    paths:
      - .github/workflows/contest-runner-dispatch-evidence-once.yml

permissions:
  contents: write

concurrency:
  group: contest-runner-dispatch-evidence-once
  cancel-in-progress: false

jobs:
  verify-runner-dispatch:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    env:
      TARGET_BRANCH: analysis/contest-lineage-v1
      AUDIT_PYTHON: /opt/python/3.11.9/bin/python3.11
      Z_INTERFACE_ROOT: governance/contest/z-interface/Z1.0.5
      EXPECTED_Z_COMPILER_BLOB: 7a9546b02fd598548891fd080c98a6553695b796
      EXPECTED_GRAPH_HASH: sha256:95cc643fcf7b468bf86e1dbbfd65fe29fc40392849aa2b752a07413226902d00
      EXPECTED_SELECTION_HASH: sha256:d6d19db916506c22542bbf68e01871330eae0efd110d9abd9a9d05d82e071c7e
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Bind exact dispatch scanner to repository audit
        shell: bash
        run: |
          set -euo pipefail
          "$AUDIT_PYTHON" - <<'PY'
          from pathlib import Path

          path = Path("tools/registry_compiler/repository_audit.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          import_anchor = "from .compile_registry import load_registry_documents, sha256_value"
          import_line = (
              "from .runner_dispatch_evidence import "
              "collect_runner_dispatch_evidence"
          )
          if import_line not in lines:
              index = lines.index(import_anchor)
              lines.insert(index + 1, import_line)

          for index, line in enumerate(lines):
              if line.startswith('REPOSITORY_AUDIT_VERSION = '):
                  lines[index] = 'REPOSITORY_AUDIT_VERSION = "23.0.0-alpha.3"'
                  break
          else:
              raise SystemExit("AUDIT_VERSION_ANCHOR_MISSING")

          start = next(
              index for index, line in enumerate(lines)
              if line.startswith("def _dispatch_evidence(")
          )
          end = next(
              index for index in range(start + 1, len(lines))
              if lines[index].startswith("def scan_repository(")
          )
          replacement = [
              "def _dispatch_evidence(",
              "    root: Path,",
              "    module_name: str,",
              "    symbol: str,",
              ") -> List[Dict[str, Any]]:",
              "    return collect_runner_dispatch_evidence(",
              "        root,",
              "        module_name,",
              "        symbol,",
              "        limit=20,",
              "    )",
              "",
              "",
          ]
          lines[start:end] = replacement
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("REPOSITORY_AUDIT_BOUND=PASS")
          PY

          "$AUDIT_PYTHON" -m py_compile \
            tools/registry_compiler/runner_dispatch_evidence.py \
            tools/registry_compiler/repository_audit.py
          grep -q 'REPOSITORY_AUDIT_VERSION = "23.0.0-alpha.3"' tools/registry_compiler/repository_audit.py
          grep -q 'collect_runner_dispatch_evidence' tools/registry_compiler/repository_audit.py

      - name: Prove all nine registered Runner calls
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          "$AUDIT_PYTHON" - <<'PY' | tee /tmp/runner-dispatch-smoke.json
          import json
          from pathlib import Path
          from tools.registry_compiler.runner_dispatch_evidence import (
              collect_runner_dispatch_evidence,
          )

          root = Path(".").resolve()
          runners = {
              "agent1_input_projection": (
                  "src.services.agent_input_transport_v2258_service",
                  "ensure_agent1_input_ref",
              ),
              "agent1_runtime": (
                  "src.services.agent_token_runtime_hash_exact_v2259_service",
                  "run_agent1_projected_inputs",
              ),
              "agent2_input_projection": (
                  "src.services.agent_input_transport_v230_service",
                  "ensure_agent2_input_ref",
              ),
              "agent3_input_projection": (
                  "src.services.agent3_system_constraint_v23215_service",
                  "ensure_agent3_sop_input_ref_v23216",
              ),
              "agent3_runtime": (
                  "src.services.pipeline_agent3_sop_v225_service",
                  "run_agent3_sop_microbatch",
              ),
              "artifact_execution_runtime": (
                  "src.services.hash_directed_artifact_runtime_v2259_service",
                  "claim_execution",
              ),
              "artifact_transport": (
                  "src.services.artifact_transport_service",
                  "store_artifact",
              ),
              "task_mapping": (
                  "src.services.pipeline_task_mapping_v225_service",
                  "run_task_mapping_microbatch_v225",
              ),
              "task_pool": (
                  "src.services.pipeline_task_mapping_v225_service",
                  "run_task_pool_admission_microbatch_v225",
              ),
          }
          result = {}
          failures = []
          for module_id, (module_name, symbol) in runners.items():
              evidence = collect_runner_dispatch_evidence(
                  root,
                  module_name,
                  symbol,
                  limit=20,
              )
              result[module_id] = {
                  "runner": f"{module_name}:{symbol}",
                  "dispatchCallEvidenceCount": len(evidence),
                  "evidence": evidence,
              }
              if not evidence:
                  failures.append(module_id)

          receipt = {
              "schema": "contest.runner_dispatch_smoke.v1",
              "runnerCount": len(runners),
              "verifiedRunnerCount": len(runners) - len(failures),
              "failedModuleIds": failures,
              "modules": result,
              "businessRuntimeMutated": False,
              "databaseMutated": False,
              "providerCallsExecuted": 0,
          }
          print(json.dumps(receipt, ensure_ascii=False, sort_keys=True, indent=2))
          if failures:
              raise SystemExit("RUNNER_DISPATCH_EVIDENCE_MISSING:" + ",".join(failures))
          PY
          grep -q '"verifiedRunnerCount": 9' /tmp/runner-dispatch-smoke.json
          grep -q '"failedModuleIds": \[\]' /tmp/runner-dispatch-smoke.json
          echo "NINE_RUNNER_DISPATCH_CALLS=PASS"

      - name: Commit audit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/registry_compiler/runner_dispatch_evidence.py \
            tools/registry_compiler/repository_audit.py
          git commit -m "governance(contest): verify exact Runner dispatch calls [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo "RUNNER_AUDIT_PUSH=PASS"
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 10))
          done

      - name: Regenerate complete contest review
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          interface="$GITHUB_WORKSPACE/$Z_INTERFACE_ROOT/tools/registry_compiler/compile_registry.py"
          test "$(git hash-object "$interface")" = "$EXPECTED_Z_COMPILER_BLOB"

          rm -rf governance/contest/generated
          "$AUDIT_PYTHON" tools/contest_governance/run_selection.py \
            --root "$GITHUB_WORKSPACE" \
            --request governance/contest/selection-request.json \
            --output governance/contest/generated \
            --z-source "$GITHUB_WORKSPACE/$Z_INTERFACE_ROOT" \
            | tee /tmp/contest-runner-dispatch-summary.json

          grep -q '"runnerDriftCount": 0' governance/contest/generated/repository-audit.json
          ! grep -q 'REGISTERED_RUNNER_DRIFT_REVIEW_REQUIRED' governance/contest/generated/contest-chain-review.json
          grep -q '"rootEquivalent": true' governance/contest/generated/registry-snapshot.json
          grep -q "\"graphHash\": \"$EXPECTED_GRAPH_HASH\"" governance/contest/generated/contest-chain-review.json
          grep -q "\"selectionHash\": \"$EXPECTED_SELECTION_HASH\"" governance/contest/generated/contest-chain-review.json
          grep -q '"KEEP_CORE": 14' governance/contest/generated/contest-chain-review.json
          grep -q '"KEEP_SUPPORT": 2' governance/contest/generated/contest-chain-review.json
          grep -q '"ISOLATE": 7' governance/contest/generated/contest-chain-review.json
          grep -q '"businessRuntimeMutated": false' governance/contest/generated/execution-receipt.json
          grep -q '"databaseMutated": false' governance/contest/generated/execution-receipt.json
          grep -q '"providerCallsExecuted": 0' governance/contest/generated/execution-receipt.json
          grep -q '"physicalDeletionExecuted": false' governance/contest/generated/execution-receipt.json
          echo "RUNNER_DRIFT_CLEARED_WITH_HASHES_STABLE=PASS"

      - name: Commit resealed review evidence
        shell: bash
        run: |
          set -euo pipefail
          git add governance/contest/generated
          forbidden="$(git diff --cached --name-only | grep -Ev '^governance/contest/generated/' || true)"
          test -z "$forbidden"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "governance(contest): reseal Runner dispatch evidence [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo "RUNNER_REVIEW_PUSH=PASS"
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 10))
          done

      - name: Upload Runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: contest-runner-dispatch-evidence
          path: |
            governance/contest/generated
            /tmp/runner-dispatch-smoke.json
            /tmp/contest-runner-dispatch-summary.json
          if-no-files-found: error
          retention-days: 14
