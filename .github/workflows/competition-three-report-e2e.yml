name: Competition Three Report E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'web_demo/**'
      - 'config/**'
      - 'contracts/**'
      - 'fixtures/competition/**'
      - 'scripts/**'
      - 'release/**'
      - 'requirements.lock'
      - 'VERSION.md'
      - '.github/workflows/competition-three-report-e2e.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: competition-three-report-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-three-report-e2e:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      COMPETITION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPETITION_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
      COMPETITION_TOOL_PYTHON: /opt/python/3.11.9/bin/python3.11
      COMPETITION_VENV_ROOT: /opt/actions-runner-public/competition-runtime-venvs
      COMPETITION_E2E_BASE: /opt/actions-runner-public/competition-e2e/ai-ecommerce-assistant-public
    steps:
      - name: Materialize exact source commit with retries
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ ! -d .git ]; then
            git init .
          fi
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 | tr -d '\n')"
          FETCHED=0
          for attempt in $(seq 1 12); do
            echo "Fetch attempt ${attempt}/12 for ${COMPETITION_SOURCE_REF}@${COMPETITION_SOURCE_COMMIT}"
            if git \
              -c http.version=HTTP/1.1 \
              -c http.lowSpeedLimit=1 \
              -c http.lowSpeedTime=120 \
              -c http.https://github.com/.extraheader="$AUTH_HEADER" \
              fetch --force --no-tags --prune --depth=1 origin \
              "+refs/heads/${COMPETITION_SOURCE_REF}:refs/remotes/origin/${COMPETITION_SOURCE_REF}"; then
              if git cat-file -e "${COMPETITION_SOURCE_COMMIT}^{commit}" 2>/dev/null; then
                FETCHED=1
                break
              fi
            fi
            sleep $((attempt * 5))
          done
          unset AUTH_HEADER
          test "$FETCHED" = "1"
          git checkout --detach --force "$COMPETITION_SOURCE_COMMIT"
          git reset --hard "$COMPETITION_SOURCE_COMMIT"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$COMPETITION_SOURCE_COMMIT"

      - name: Verify exact tool Python and scripts
        run: |
          set -euo pipefail
          [ -x "$COMPETITION_TOOL_PYTHON" ]
          test "$($COMPETITION_TOOL_PYTHON -c 'import platform; print(platform.python_version())')" = "3.11.9"
          chmod +x scripts/prepare_competition_runtime_venv.sh
          "$COMPETITION_TOOL_PYTHON" -m py_compile \
            scripts/compile_competition_lineage.py \
            scripts/build_competition_runtime_package.py \
            scripts/verify_competition_runtime_package.py \
            scripts/deploy_competition_candidate.py \
            scripts/competition_contract_fixture_provider.py \
            scripts/run_competition_three_report_e2e.py
          "$COMPETITION_TOOL_PYTHON" -m json.tool fixtures/competition/three_report_scenario.json >/dev/null

      - name: Compile registry and exact hash lineage
        run: |
          set -euo pipefail
          rm -rf \
            dist/competition-lineage \
            dist/competition-runtime \
            dist/competition-three-report-e2e
          mkdir -p dist/competition-three-report-e2e
          "$COMPETITION_TOOL_PYTHON" scripts/compile_competition_lineage.py \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --output-dir dist/competition-lineage \
            2>&1 | tee dist/competition-three-report-e2e/lineage-summary.log

      - name: Build and independently verify precise runtime package
        run: |
          set -euo pipefail
          "$COMPETITION_TOOL_PYTHON" scripts/build_competition_runtime_package.py \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --lineage-dir dist/competition-lineage \
            --output-dir dist/competition-runtime \
            --archive-name "competition-runtime-${COMPETITION_SOURCE_COMMIT}.tar.gz" \
            2>&1 | tee dist/competition-three-report-e2e/package-build-summary.log
          ARCHIVE="dist/competition-runtime/competition-runtime-${COMPETITION_SOURCE_COMMIT}.tar.gz"
          "$COMPETITION_TOOL_PYTHON" scripts/verify_competition_runtime_package.py \
            "$ARCHIVE" \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --output dist/competition-runtime/competition-runtime-verification.json \
            2>&1 | tee dist/competition-three-report-e2e/package-verification-summary.log

      - name: Prepare cached exact Python 3.11.9 application environment
        run: |
          set -euo pipefail
          RUNTIME_PYTHON="$(
            COMPETITION_VENV_ROOT="$COMPETITION_VENV_ROOT" \
            COMPETITION_BASE_PYTHON="$COMPETITION_TOOL_PYTHON" \
            bash scripts/prepare_competition_runtime_venv.sh \
              "$GITHUB_WORKSPACE" \
              "$GITHUB_WORKSPACE/dist/competition-three-report-e2e" \
              | tee dist/competition-three-report-e2e/runtime-environment-summary.log \
              | tail -n 1
          )"
          [ -x "$RUNTIME_PYTHON" ]
          test "$($RUNTIME_PYTHON -c 'import platform; print(platform.python_version())')" = "3.11.9"
          printf 'COMPETITION_RUNTIME_PYTHON=%s\n' "$RUNTIME_PYTHON" >> "$GITHUB_ENV"

      - name: Run fixed three-report full business chain
        run: |
          set -euo pipefail
          ARCHIVE="dist/competition-runtime/competition-runtime-${COMPETITION_SOURCE_COMMIT}.tar.gz"
          "$COMPETITION_TOOL_PYTHON" scripts/run_competition_three_report_e2e.py \
            "$ARCHIVE" \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --scenario fixtures/competition/three_report_scenario.json \
            --candidate-base "$COMPETITION_E2E_BASE" \
            --runtime-python "$COMPETITION_RUNTIME_PYTHON" \
            --tool-python "$COMPETITION_TOOL_PYTHON" \
            --app-port 39280 \
            --provider-port 39180 \
            --startup-timeout 150 \
            --max-ticks 120 \
            --output dist/competition-three-report-e2e/three-report-e2e-attestation.json \
            2>&1 | tee dist/competition-three-report-e2e/three-report-e2e-summary.log

      - name: Verify E2E evidence boundary
        if: success()
        run: |
          set -euo pipefail
          "$COMPETITION_TOOL_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path('dist/competition-three-report-e2e/three-report-e2e-attestation.json').read_text(encoding='utf-8')
          )
          assert report.get('schema') == 'competition.three_report_e2e.v1', report
          assert report.get('verified') is True, report.get('errors')
          assert report.get('sourceCommit') == os.environ['COMPETITION_SOURCE_COMMIT'], report
          assert report.get('mode') == 'fixed_reports_with_deterministic_contract_fixture', report
          assert report.get('modelQualityProof') is False, report
          assert report.get('realBailianRunStillRequired') is True, report
          assert len(report.get('imports') or []) == 3, report
          assert all((report.get('assertions') or {}).values()), report.get('assertions')
          assert (report.get('replayCheck') or {}).get('additionalProviderCalls') == 0, report
          print(json.dumps({
              'verified': report['verified'],
              'sourceCommit': report['sourceCommit'],
              'scenarioId': report['scenarioId'],
              'latestDataVersion': report['latestDataVersion'],
              'taskCount': report['views']['taskCount'],
              'providerStageCounts': report['replayCheck']['before']['stageCounts'],
              'verificationHash': report['verificationHash'],
              'realBailianRunStillRequired': report['realBailianRunStillRequired'],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publish fixed three-report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competition-three-report-e2e-${{ env.COMPETITION_SOURCE_COMMIT }}
          path: |
            dist/competition-three-report-e2e
            dist/competition-runtime/competition-runtime-build.json
            dist/competition-runtime/competition-runtime-verification.json
            dist/competition-runtime/*.sha256
            dist/competition-lineage/evidence-manifest.json
            dist/competition-lineage/verification-report.json
            fixtures/competition/three_report_scenario.json
          if-no-files-found: warn
          retention-days: 14
