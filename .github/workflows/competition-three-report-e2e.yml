name: Competition Three Report E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'web_demo/**'
      - 'config/**'
      - 'contracts/**'
      - 'fixtures/competition/**'
      - 'governance/competition_misrouted_fix_recovery_v1.json'
      - 'scripts/compile_competition_lineage.py'
      - 'scripts/build_competition_runtime_package.py'
      - 'scripts/verify_competition_runtime_package.py'
      - 'scripts/deploy_competition_candidate.py'
      - 'scripts/competition_contract_fixture_provider.py'
      - 'scripts/competition_e2e_compat_runtime/**'
      - 'scripts/run_competition_three_report_e2e.py'
      - 'scripts/run_competition_three_report_e2e_compat.py'
      - 'scripts/run_competition_three_report_e2e_history_warmup.py'
      - 'scripts/verify_competition_recovery_behavior.py'
      - 'scripts/verify_competition_era_recovery_contract.py'
      - 'scripts/finalize_competition_recovery_verification.py'
      - 'release/**'
      - 'requirements.lock'
      - 'VERSION.md'
      - '.github/workflows/competition-three-report-e2e.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: competition-three-report-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-three-report-e2e:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      COMPETITION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPETITION_TOOL_PYTHON: /opt/python/3.11.9/bin/python3.11
      COMPETITION_VENV_ROOT: /opt/actions-runner-public/competition-runtime-venvs
      COMPETITION_E2E_BASE: /opt/actions-runner-public/competition-e2e/ai-ecommerce-assistant-public
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Materialize exact source commit archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/competition-source-${COMPETITION_SOURCE_COMMIT}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/competition-source-${COMPETITION_SOURCE_COMMIT}"
          rm -rf "$ARCHIVE" "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          DOWNLOADED=0
          for attempt in $(seq 1 8); do
            echo "Archive download attempt ${attempt}/8"
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 20 \
              --max-time 300 \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${COMPETITION_SOURCE_COMMIT}" \
              -o "$ARCHIVE"; then
              DOWNLOADED=1
              break
            fi
            rm -f "$ARCHIVE"
            sleep $((attempt * 5))
          done
          test "$DOWNLOADED" = "1"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          test -f "$EXTRACTED/scripts/run_competition_three_report_e2e_history_warmup.py"
          test -f "$EXTRACTED/scripts/verify_competition_recovery_behavior.py"
          test -f "$EXTRACTED/scripts/verify_competition_era_recovery_contract.py"
          test -f "$EXTRACTED/scripts/finalize_competition_recovery_verification.py"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$COMPETITION_SOURCE_COMMIT" > "$GITHUB_WORKSPACE/.competition-source-commit"
          test "$(cat "$GITHUB_WORKSPACE/.competition-source-commit")" = "$COMPETITION_SOURCE_COMMIT"

      - name: Verify exact tool Python and scripts
        run: |
          set -euo pipefail
          [ -x "$COMPETITION_TOOL_PYTHON" ]
          test "$($COMPETITION_TOOL_PYTHON -c 'import platform; print(platform.python_version())')" = "3.11.9"
          chmod +x scripts/prepare_competition_runtime_venv.sh
          "$COMPETITION_TOOL_PYTHON" -m py_compile \
            scripts/compile_competition_lineage.py \
            scripts/build_competition_runtime_package.py \
            scripts/verify_competition_runtime_package.py \
            scripts/deploy_competition_candidate.py \
            scripts/competition_contract_fixture_provider.py \
            scripts/competition_e2e_compat_runtime/competition_contract_fixture_provider.py \
            scripts/run_competition_three_report_e2e.py \
            scripts/run_competition_three_report_e2e_compat.py \
            scripts/run_competition_three_report_e2e_history_warmup.py \
            scripts/verify_competition_recovery_behavior.py \
            scripts/verify_competition_era_recovery_contract.py \
            scripts/finalize_competition_recovery_verification.py
          "$COMPETITION_TOOL_PYTHON" -m json.tool fixtures/competition/three_report_scenario.json >/dev/null
          "$COMPETITION_TOOL_PYTHON" -m json.tool governance/competition_misrouted_fix_recovery_v1.json >/dev/null

      - name: Compile registry and exact hash lineage
        run: |
          set -euo pipefail
          rm -rf \
            dist/competition-lineage \
            dist/competition-runtime \
            dist/competition-three-report-e2e
          mkdir -p dist/competition-three-report-e2e
          "$COMPETITION_TOOL_PYTHON" scripts/compile_competition_lineage.py \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --output-dir dist/competition-lineage \
            2>&1 | tee dist/competition-three-report-e2e/lineage-summary.log

      - name: Build and independently verify precise runtime package
        run: |
          set -euo pipefail
          "$COMPETITION_TOOL_PYTHON" scripts/build_competition_runtime_package.py \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --lineage-dir dist/competition-lineage \
            --output-dir dist/competition-runtime \
            --archive-name "competition-runtime-${COMPETITION_SOURCE_COMMIT}.tar.gz" \
            2>&1 | tee dist/competition-three-report-e2e/package-build-summary.log
          ARCHIVE="dist/competition-runtime/competition-runtime-${COMPETITION_SOURCE_COMMIT}.tar.gz"
          "$COMPETITION_TOOL_PYTHON" scripts/verify_competition_runtime_package.py \
            "$ARCHIVE" \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --output dist/competition-runtime/competition-runtime-verification.json \
            2>&1 | tee dist/competition-three-report-e2e/package-verification-summary.log

      - name: Prepare cached exact Python 3.11.9 application environment
        run: |
          set -euo pipefail
          RUNTIME_PYTHON="$(
            COMPETITION_VENV_ROOT="$COMPETITION_VENV_ROOT" \
            COMPETITION_BASE_PYTHON="$COMPETITION_TOOL_PYTHON" \
            bash scripts/prepare_competition_runtime_venv.sh \
              "$GITHUB_WORKSPACE" \
              "$GITHUB_WORKSPACE/dist/competition-three-report-e2e" \
              | tee dist/competition-three-report-e2e/runtime-environment-summary.log \
              | tail -n 1
          )"
          [ -x "$RUNTIME_PYTHON" ]
          test "$($RUNTIME_PYTHON -c 'import platform; print(platform.python_version())')" = "3.11.9"
          "$RUNTIME_PYTHON" -c 'import uvicorn, fastapi, openpyxl'
          RUNTIME_LAUNCHER="$GITHUB_WORKSPACE/dist/competition-three-report-e2e/runtime-python-launcher.sh"
          cat > "$RUNTIME_LAUNCHER" <<EOF
          #!/usr/bin/env bash
          exec "$RUNTIME_PYTHON" "\$@"
          EOF
          chmod +x "$RUNTIME_LAUNCHER"
          test "$($RUNTIME_LAUNCHER -c 'import platform; print(platform.python_version())')" = "3.11.9"
          printf 'COMPETITION_RUNTIME_PYTHON=%s\n' "$RUNTIME_PYTHON" >> "$GITHUB_ENV"
          printf 'COMPETITION_RUNTIME_LAUNCHER=%s\n' "$RUNTIME_LAUNCHER" >> "$GITHUB_ENV"

      - name: Verify ERA 10x3 sample and canonical history recovery
        run: |
          set -euo pipefail
          "$COMPETITION_RUNTIME_PYTHON" scripts/verify_competition_era_recovery_contract.py \
            --output dist/competition-three-report-e2e/era-recovery-contract.json \
            2>&1 | tee dist/competition-three-report-e2e/era-recovery-summary.log

      - name: Run fixed three-report full business chain
        run: |
          set -euo pipefail
          ARCHIVE="dist/competition-runtime/competition-runtime-${COMPETITION_SOURCE_COMMIT}.tar.gz"
          "$COMPETITION_TOOL_PYTHON" scripts/run_competition_three_report_e2e_history_warmup.py \
            "$ARCHIVE" \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --scenario fixtures/competition/three_report_scenario.json \
            --candidate-base "$COMPETITION_E2E_BASE" \
            --runtime-python "$COMPETITION_RUNTIME_LAUNCHER" \
            --tool-python "$COMPETITION_TOOL_PYTHON" \
            --app-port 39280 \
            --provider-port 39180 \
            --startup-timeout 150 \
            --max-ticks 120 \
            --output dist/competition-three-report-e2e/three-report-e2e-attestation.json \
            2>&1 | tee dist/competition-three-report-e2e/three-report-e2e-summary.log

      - name: Verify misplaced-fix recovery behavior
        run: |
          set -euo pipefail
          "$COMPETITION_RUNTIME_PYTHON" scripts/verify_competition_recovery_behavior.py \
            --attestation dist/competition-three-report-e2e/three-report-e2e-attestation.json \
            --recovery governance/competition_misrouted_fix_recovery_v1.json \
            --source-root "$GITHUB_WORKSPACE" \
            --output dist/competition-three-report-e2e/recovery-behavior-verification.json \
            2>&1 | tee dist/competition-three-report-e2e/recovery-behavior-summary.log

      - name: Finalize complete recovery evidence
        run: |
          set -euo pipefail
          "$COMPETITION_TOOL_PYTHON" scripts/finalize_competition_recovery_verification.py \
            --behavior dist/competition-three-report-e2e/recovery-behavior-verification.json \
            --era dist/competition-three-report-e2e/era-recovery-contract.json \
            --output dist/competition-three-report-e2e/recovery-complete-verification.json \
            2>&1 | tee dist/competition-three-report-e2e/recovery-complete-summary.log

      - name: Verify E2E evidence boundary
        if: success()
        run: |
          set -euo pipefail
          "$COMPETITION_TOOL_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path('dist/competition-three-report-e2e/three-report-e2e-attestation.json').read_text(encoding='utf-8')
          )
          recovery = json.loads(
              Path('dist/competition-three-report-e2e/recovery-behavior-verification.json').read_text(encoding='utf-8')
          )
          era = json.loads(
              Path('dist/competition-three-report-e2e/era-recovery-contract.json').read_text(encoding='utf-8')
          )
          complete = json.loads(
              Path('dist/competition-three-report-e2e/recovery-complete-verification.json').read_text(encoding='utf-8')
          )
          assert report.get('schema') == 'competition.three_report_e2e.v1', report
          assert report.get('verified') is True, report.get('errors')
          assert report.get('sourceCommit') == os.environ['COMPETITION_SOURCE_COMMIT'], report
          assert report.get('mode') == 'fixed_reports_with_deterministic_contract_fixture', report
          assert report.get('modelQualityProof') is False, report
          assert report.get('realBailianRunStillRequired') is True, report
          assert len(report.get('imports') or []) == 3, report
          assert all((report.get('assertions') or {}).values()), report.get('assertions')
          assert (report.get('replayCheck') or {}).get('additionalProviderCalls') == 0, report
          assert (report.get('freshUploadProbe') or {}).get('verified') is True, report.get('freshUploadProbe')
          assert (report.get('workerHandoffProbe') or {}).get('verified') is True, report.get('workerHandoffProbe')
          assert recovery.get('verified') is True, recovery.get('failedRequirementIds')
          assert era.get('verified') is True, era
          assert [item.get('operatingUnitCount') for item in era.get('periods') or []] == [30, 30, 30], era
          assert [item.get('globalProductCount') for item in era.get('periods') or []] == [10, 10, 10], era
          assert [item.get('storeCount') for item in era.get('periods') or []] == [3, 3, 3], era
          assert (era.get('canonicalHistory') or {}).get('verified') is True, era
          assert complete.get('verified') is True, complete.get('failedRequirementIds')
          assert complete.get('sourceCommit') == os.environ['COMPETITION_SOURCE_COMMIT'], complete
          assert complete.get('motherRepairCodeMigrationRequired') is False, complete
          assert complete.get('motherDeploymentImplementationMigrationAllowed') is False, complete
          print(json.dumps({
              'verified': complete['verified'],
              'sourceCommit': complete['sourceCommit'],
              'decision': complete['decision'],
              'recoveryCompleteHash': complete['recoveryCompleteHash'],
              'eraRecoveryHash': era['eraRecoveryHash'],
              'freshUploadProbe': report['freshUploadProbe'],
              'workerHandoffProbe': report['workerHandoffProbe'],
              'requirements': {
                  key: value.get('status')
                  for key, value in complete['requirements'].items()
              },
              'realBailianRunStillRequired': report['realBailianRunStillRequired'],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publish fixed three-report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competition-three-report-e2e-${{ env.COMPETITION_SOURCE_COMMIT }}
          path: |
            dist/competition-three-report-e2e
            dist/competition-runtime/competition-runtime-build.json
            dist/competition-runtime/competition-runtime-verification.json
            dist/competition-runtime/*.sha256
            dist/competition-lineage/evidence-manifest.json
            dist/competition-lineage/verification-report.json
            fixtures/competition/three_report_scenario.json
            governance/competition_misrouted_fix_recovery_v1.json
          if-no-files-found: warn
          retention-days: 14
