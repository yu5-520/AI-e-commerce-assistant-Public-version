name: Public Runner Migration PR Once

on:
  pull_request:
    paths:
      - '.github/workflows/public-runner-migration-pr-once.yml'
      - 'scripts/migrate_public_runner_triggers.py'

permissions:
  contents: write

jobs:
  migrate-public-runner-boundary:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Migrate remaining private-runner PR triggers
        run: |
          set -euo pipefail
          python3 scripts/migrate_public_runner_triggers.py

      - name: Remove one-time migration artifacts before final scan
        run: |
          set -euo pipefail
          rm -f scripts/migrate_public_runner_triggers.py
          rm -f .github/workflows/public-runner-migration-once.yml
          rm -f .github/workflows/public-runner-migration-pr-once.yml

      - name: Verify repository-wide public runner boundary
        run: |
          set -euo pipefail
          python3 scripts/check_public_runner_boundary.py

      - name: Commit hardened workflow boundary
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git commit -m 'Security: finalize public runner boundary [skip ci]'
          git push origin HEAD:${GITHUB_HEAD_REF}
