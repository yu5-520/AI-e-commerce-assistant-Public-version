name: V24 Java Deterministic Core Phase5

on:
  push:
    branches:
      - main
    paths:
      - 'java-control-plane/**'
      - 'governance/v24/phase5-**'
      - 'governance/v24/deployment-compatibility-contract-v24.json'
      - 'governance/v24/legacy-removal-contract-v24.json'
      - 'scripts/export_v24_phase5_deployment_evidence.py'
      - 'scripts/verify_v24_java_phase5.sh'
      - 'src/deployment/**'
      - 'scripts/runtime_exclusivity_guard.sh'
      - 'scripts/check_release_contract.py'
      - 'config/deployment/runtime_callable_authority_v1.json'
      - '.github/workflows/v24-java-deterministic-core-phase5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v24-java-deterministic-core-phase5-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase5-deployment-authority:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      V24_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Materialize exact source archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$V24_SOURCE_COMMIT"
          ARCHIVE="${RUNNER_TEMP}/v24-phase5-${SOURCE_COMMIT}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/v24-phase5-${SOURCE_COMMIT}"
          rm -rf "$ARCHIVE" "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          downloaded=0
          for attempt in $(seq 1 8); do
            echo "Archive download ${SOURCE_COMMIT} attempt ${attempt}/8"
            if curl \
              --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 300 \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${SOURCE_COMMIT}" \
              -o "$ARCHIVE"; then
              downloaded=1
              break
            fi
            rm -f "$ARCHIVE"
            sleep $((attempt * 5))
          done
          test "$downloaded" = "1"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          test -f "$EXTRACTED/scripts/verify_v24_java_phase5.sh"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$SOURCE_COMMIT" > .v24-phase5-source-commit

      - name: Prepare JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Python 3.10+
        shell: bash
        run: |
          set -euo pipefail
          for candidate in \
            /opt/python/3.11.9/bin/python3.11 \
            python3.13 python3.12 python3.11 python3.10 python3; do
            if { command -v "$candidate" >/dev/null 2>&1 || [ -x "$candidate" ]; } \
              && "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3,10) else 1)' 2>/dev/null; then
              if command -v "$candidate" >/dev/null 2>&1; then candidate="$(command -v "$candidate")"; fi
              echo "PYTHON_BIN=$candidate" >> "$GITHUB_ENV"
              "$candidate" -c 'import platform; print("python=" + platform.python_version())'
              exit 0
            fi
          done
          echo 'Python 3.10+ is required.' >&2
          exit 1

      - name: Verify V24.18-V24.20 deployment authority
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_v24_java_phase5.sh

      - name: Verify Phase5 production boundary
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('dist/v24-java-phase5/phase5-verification-report.json').read_text(encoding='utf-8'))
          assert report['verified'] is True
          assert report['enforcementMode'] == 'SHADOW'
          assert report['deploymentReadPure'] is True
          assert report['deploymentCasSingleWinner'] is True
          assert report['staleGenerationBlocked'] is True
          assert report['incompatibleCandidateBlocked'] is True
          assert report['explicitSchemaMigrationRequired'] is True
          assert report['legacyPrematureRemovalBlocked'] is True
          assert report['legacyRemovalAfterProof'] is True
          assert report['automaticLegacyFallbackForbidden'] is True
          assert report['productionDeploymentWriterUnchanged'] is True
          assert report['javaProductionDeploymentCutoverEnabled'] is False
          assert report['productionLegacyDeletionByJavaEnabled'] is False
          print('V24_PHASE5_AUTHORITY_BOUNDARY=PASS')
          PY

      - name: Upload V24 phase5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v24-java-deterministic-core-phase5-${{ github.sha }}
          path: dist/v24-java-phase5/*.json
          if-no-files-found: error
          retention-days: 14
