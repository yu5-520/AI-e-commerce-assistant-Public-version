name: Competition Runtime Callable Authority

on:
  pull_request:
    paths:
      - 'src/**'
      - 'governance/runtime_callable_authority_v1.json'
      - 'governance/competition_lineage_update_policy.json'
      - 'scripts/verify_runtime_callable_authority.py'
      - '.github/workflows/competition-runtime-callable-authority.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: competition-runtime-callable-authority-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-runtime-callable-authority:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      COMPETITION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Materialize exact TARGET source archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$COMPETITION_SOURCE_COMMIT"
          ARCHIVE="${RUNNER_TEMP}/competition-callable-authority-${SOURCE_COMMIT}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/competition-callable-authority-${SOURCE_COMMIT}"
          rm -f "$ARCHIVE"
          rm -rf "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          downloaded=0
          for attempt in $(seq 1 8); do
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 20 \
              --max-time 300 \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${SOURCE_COMMIT}" \
              -o "$ARCHIVE"; then
              downloaded=1
              break
            fi
            rm -f "$ARCHIVE"
            sleep $((attempt * 5))
          done
          test "$downloaded" = "1"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          test -f "$EXTRACTED/scripts/compile_competition_lineage.py"
          test -f "$EXTRACTED/scripts/verify_runtime_callable_authority.py"
          test -f "$EXTRACTED/governance/runtime_callable_authority_v1.json"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/

      - name: Resolve ECS Python 3.10+
        run: |
          set -euo pipefail
          for candidate in \
            python3.13 python3.12 python3.11 python3.10 \
            /usr/local/bin/python3.13 /usr/local/bin/python3.12 \
            /usr/local/bin/python3.11 /usr/local/bin/python3.10 \
            /usr/bin/python3.13 /usr/bin/python3.12 \
            /usr/bin/python3.11 /usr/bin/python3.10; do
            if command -v "$candidate" >/dev/null 2>&1; then
              resolved="$(command -v "$candidate")"
            elif [ -x "$candidate" ]; then
              resolved="$candidate"
            else
              continue
            fi
            if "$resolved" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' 2>/dev/null; then
              printf 'PYTHON_BIN=%s\n' "$resolved" >> "$GITHUB_ENV"
              "$resolved" -c 'import platform; print("python=" + platform.python_version())'
              exit 0
            fi
          done
          echo 'No usable Python 3.10+ runtime exists on ECS runner.' >&2
          exit 1

      - name: Compile exact TARGET Hash Lineage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          rm -rf dist/competition-runtime-callable-authority
          "$PYTHON_BIN" -m py_compile \
            scripts/compile_competition_lineage.py \
            scripts/verify_runtime_callable_authority.py
          "$PYTHON_BIN" scripts/compile_competition_lineage.py \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --output-dir dist/competition-runtime-callable-authority

      - name: Verify callable owner and contract authority
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/verify_runtime_callable_authority.py \
            --lineage-graph dist/competition-runtime-callable-authority/lineage-graph.json \
            --spec governance/runtime_callable_authority_v1.json \
            --output dist/runtime-callable-authority-report.json
          "$PYTHON_BIN" - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('dist/runtime-callable-authority-report.json').read_text(encoding='utf-8'))
          assert report.get('verified') is True, report.get('findings')
          assert report.get('callableCount') == 1, report
          assert report.get('anchorCount') == 8, report
          assert not report.get('findings'), report
          print('runtimeCallableAuthorityHash=' + str(report.get('verificationHash')))
          PY
