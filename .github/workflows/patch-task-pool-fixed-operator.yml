name: Patch Task Pool Fixed Operator

on:
  push:
    branches:
      - competition/operator-core-boundary-v1
    paths:
      - 'src/services/competition_operator_context_service.py'
      - '.github/workflows/patch-task-pool-fixed-operator.yml'

permissions:
  contents: write

concurrency:
  group: patch-task-pool-fixed-operator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-task-pool:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      PATCH_PYTHON: /opt/python/3.11.9/bin/python3.11
    steps:
      - name: Replace retired account-service import
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          "$PATCH_PYTHON" - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          path = 'src/services/task_pool_admission_core_v20_service.py'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'task-pool-fixed-operator-patcher',
          }
          request = urllib.request.Request(
              api + '?' + urllib.parse.urlencode({'ref': branch}), headers=headers
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              current = json.load(response)
          source = base64.b64decode(current['content']).decode('utf-8')
          old_import = 'from src.services.account_service import default_operator\n'
          new_import = 'from src.services.competition_operator_context_service import default_operator\n'
          if source.count(old_import) != 1:
              raise SystemExit(f'expected one retired account import, found {source.count(old_import)}')
          source = source.replace(old_import, new_import, 1)
          old_source = '            plan["operatorBindingSource"] = "v22_store_assignment_policy"\n'
          new_source = '            plan["operatorBindingSource"] = "competition_fixed_operator_context"\n'
          if source.count(old_source) != 1:
              raise SystemExit(f'expected one binding source, found {source.count(old_source)}')
          source = source.replace(old_source, new_source, 1)
          compile(source, path, 'exec')
          payload = json.dumps({
              'message': 'fix: 任务入池改用固定运营工作台上下文',
              'content': base64.b64encode(source.encode('utf-8')).decode('ascii'),
              'sha': current['sha'],
              'branch': branch,
          }).encode('utf-8')
          write = urllib.request.Request(
              api,
              data=payload,
              method='PUT',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(write, timeout=120) as response:
              result = json.load(response)
          print(result['commit']['sha'])
          PY
