name: Revalidate contest field compatibility Registry and lineage

on:
  push:
    branches:
      - migration/bulk-bootstrap
    paths:
      - .github/workflows/contest-field-registry-revalidate-once.yml

permissions:
  contents: write

concurrency:
  group: contest-field-registry-revalidate-once
  cancel-in-progress: false

jobs:
  revalidate-registry:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    env:
      TARGET_BRANCH: migration/contest-field-registry-v1
      AUDIT_PYTHON: /opt/python/3.11.9/bin/python3.11
      EXPECTED_GRAPH_HASH: sha256:95cc643fcf7b468bf86e1dbbfd65fe29fc40392849aa2b752a07413226902d00
      EXPECTED_SELECTION_HASH: sha256:d6d19db916506c22542bbf68e01871330eae0efd110d9abd9a9d05d82e071c7e
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout field Registry branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Verify registered migration authority
        shell: bash
        run: |
          set -euo pipefail
          test -x "$AUDIT_PYTHON"
          test "$($AUDIT_PYTHON --version 2>&1)" = "Python 3.11.9"
          grep -q 'REG-MIG-CONTEST-FIELD-COMPAT-001' contracts/registry/migrations.json
          grep -q '"activationState":"COMPATIBILITY_ACTIVE"' contracts/registry/migrations.json
          grep -q '"compatibilityCommit":"d9708ebd9e3221df0fa3bafe20e08bedabf73a4d"' contracts/registry/migrations.json
          test "$(grep -o '"status":"COMPATIBILITY_ACTIVE"' contracts/registry/tombstones.json | wc -l | tr -d ' ')" = "2"
          grep -q '"state": "FIELD_COMPATIBILITY_SEMANTICS_VERIFIED"' governance/contest/generated/field-compat-semantic-verification.json
          echo "FIELD_REGISTRY_AUTHORITY=PASS"

      - name: Reseal Registry and rerun lineage audit
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          "$AUDIT_PYTHON" -m py_compile tools/contest_governance/revalidate_field_compat_registry.py
          "$AUDIT_PYTHON" tools/contest_governance/revalidate_field_compat_registry.py \
            | tee /tmp/field-registry-revalidation-summary.json

          test -f governance/contest/generated/field-compat-registry-revalidation.json
          test -f governance/contest/generated/field-compat-registry-revalidation-receipt.json
          test -f governance/contest/generated/repository-audit-post-field-compat.json
          grep -q '"state": "FIELD_MIGRATION_VERIFIED_COMPATIBILITY_WINDOW_ACTIVE"' governance/contest/generated/field-compat-registry-revalidation.json
          grep -q "\"graphHash\": \"$EXPECTED_GRAPH_HASH\"" governance/contest/generated/field-compat-registry-revalidation.json
          grep -q "\"selectionHash\": \"$EXPECTED_SELECTION_HASH\"" governance/contest/generated/field-compat-registry-revalidation.json
          grep -q '"runnerDriftCount": 0' governance/contest/generated/repository-audit-post-field-compat.json
          grep -q '"logicalIsolationAuthorizedNext": true' governance/contest/generated/field-compat-registry-revalidation.json
          grep -q '"physicalDeletionAuthorized": false' governance/contest/generated/field-compat-registry-revalidation.json
          grep -q '"mainMutated": false' governance/contest/generated/field-compat-registry-revalidation.json
          echo "FIELD_REGISTRY_REVALIDATION=PASS"

      - name: Build exact four-file governance commit
        shell: bash
        run: |
          set -euo pipefail
          git add \
            contracts/registry/registry-manifest.json \
            governance/contest/generated/field-compat-registry-revalidation.json \
            governance/contest/generated/field-compat-registry-revalidation-receipt.json \
            governance/contest/generated/repository-audit-post-field-compat.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          forbidden="$(git diff --cached --name-only | grep -Ev '^(contracts/registry/registry-manifest\.json|governance/contest/generated/(field-compat-registry-revalidation(-receipt)?|repository-audit-post-field-compat)\.json)$' || true)"
          test -z "$forbidden"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base_commit="$(git rev-parse HEAD)"
          git commit -m "governance(contest): reseal field compatibility Registry lineage [skip ci]"
          echo "BASE_COMMIT=$base_commit" >> "$GITHUB_ENV"
          echo "LOCAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "LOCAL_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "FIELD_REGISTRY_LOCAL_COMMIT=PASS"

      - name: Publish exact commit through Git Data API
        shell: bash
        run: |
          set -euo pipefail
          "$AUDIT_PYTHON" - <<'PY' | tee /tmp/field-registry-api-publish.json
          from __future__ import annotations
          import base64, json, os, subprocess, time, urllib.error, urllib.request
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          api = "https://api.github.com/repos/yu5-520/AI-e-commerce-assistant-Public-version"
          token = os.environ["GH_API_TOKEN"]
          branch = os.environ["TARGET_BRANCH"]
          base_commit = os.environ["BASE_COMMIT"]
          local_commit = os.environ["LOCAL_COMMIT"]
          local_tree = os.environ["LOCAL_TREE"]

          def git(*args):
              return subprocess.run(["git", *args], cwd=root, check=True, capture_output=True, text=True).stdout.strip()

          def request(method, path, payload=None):
              body = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              last = None
              for attempt in range(1, 9):
                  req = urllib.request.Request(api + path, data=body, method=method, headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "contest-field-registry-publisher",
                      "Content-Type": "application/json",
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return json.loads(response.read().decode())
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                      last = exc
                      if isinstance(exc, urllib.error.HTTPError) and exc.code < 500 and exc.code not in {408, 409, 429}:
                          raise RuntimeError(f"API_ERROR:{method}:{path}:{exc.code}:{exc.read().decode(errors='replace')}") from exc
                      time.sleep(attempt * 5)
              raise RuntimeError(f"API_RETRIES_EXHAUSTED:{method}:{path}:{last}")

          assert git("rev-parse", "HEAD") == local_commit
          assert git("rev-parse", "HEAD^") == base_commit
          current = request("GET", f"/git/ref/heads/{branch}")
          if current["object"]["sha"] != base_commit:
              raise RuntimeError(f"BRANCH_LEASE_MISMATCH:{current['object']['sha']}:{base_commit}")
          base_tree = request("GET", f"/git/commits/{base_commit}")["tree"]["sha"]
          paths = git("diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD").splitlines()
          if len(paths) != 4:
              raise RuntimeError(f"PATH_COUNT_MISMATCH:{len(paths)}")
          entries = []
          for path in paths:
              data = (root / path).read_bytes()
              blob = request("POST", "/git/blobs", {"content": base64.b64encode(data).decode(), "encoding": "base64"})
              mode_line = git("ls-tree", base_commit, "--", path)
              mode = mode_line.split()[0] if mode_line else "100644"
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})
          tree = request("POST", "/git/trees", {"base_tree": base_tree, "tree": entries})
          if tree["sha"] != local_tree:
              raise RuntimeError(f"TREE_MISMATCH:{tree['sha']}:{local_tree}")
          commit = request("POST", "/git/commits", {
              "message": "governance(contest): reseal field compatibility Registry lineage [skip ci]",
              "tree": tree["sha"],
              "parents": [base_commit],
          })
          request("PATCH", f"/git/refs/heads/{branch}", {"sha": commit["sha"], "force": False})
          remote = request("GET", f"/git/commits/{commit['sha']}")
          if remote["tree"]["sha"] != local_tree or [p["sha"] for p in remote["parents"]] != [base_commit]:
              raise RuntimeError("REMOTE_COMMIT_VALIDATION_FAILED")
          print(json.dumps({
              "state": "FIELD_REGISTRY_LINEAGE_REVALIDATED",
              "remoteCommit": commit["sha"],
              "parentCommit": base_commit,
              "treeSha": tree["sha"],
              "fileCount": len(paths),
              "mainMutated": False,
              "physicalDeletionExecuted": False,
          }, sort_keys=True, indent=2))
          PY
          grep -q '"state": "FIELD_REGISTRY_LINEAGE_REVALIDATED"' /tmp/field-registry-api-publish.json
          grep -q '"fileCount": 4' /tmp/field-registry-api-publish.json
          echo "FIELD_REGISTRY_API_PUBLISH=PASS"

      - name: Upload revalidation evidence
        uses: actions/upload-artifact@v4
        with:
          name: contest-field-registry-revalidation
          path: |
            contracts/registry/registry-manifest.json
            governance/contest/generated/field-compat-registry-revalidation.json
            governance/contest/generated/field-compat-registry-revalidation-receipt.json
            governance/contest/generated/repository-audit-post-field-compat.json
            /tmp/field-registry-revalidation-summary.json
            /tmp/field-registry-api-publish.json
          if-no-files-found: error
          retention-days: 14
