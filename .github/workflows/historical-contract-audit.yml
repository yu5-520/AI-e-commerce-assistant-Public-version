name: Historical Contract Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-retired-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install exact audit environment
        run: |
          python -m pip install -r requirements-dev.lock
          python scripts/check_dependency_lock.py requirements-dev.lock --strict

      - name: Run every historical and active test explicitly
        id: audit
        continue-on-error: true
        env:
          PYTHONPATH: .
          ARTIFACT_ROOT: /tmp/ai-ecommerce-historical-audit-artifacts
          AI_RELEASE_REQUIRED: '0'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -o pipefail
          mkdir -p audit-artifacts
          mapfile -t ALL_TESTS < <(find tests -maxdepth 1 -type f -name 'test_*.py' -print | sort)
          test "${#ALL_TESTS[@]}" -gt 0
          python -m pytest -q "${ALL_TESTS[@]}" 2>&1 | tee audit-artifacts/historical-pytest.log

      - name: Publish historical audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-contract-audit-${{ github.sha }}
          path: audit-artifacts
          if-no-files-found: error
          retention-days: 7
