name: Finalize Runner dispatch evidence once

on:
  push:
    branches:
      - migration/bulk-bootstrap
    paths:
      - .github/workflows/contest-runner-dispatch-finalize-once.yml

permissions:
  contents: write

concurrency:
  group: contest-runner-dispatch-finalize-once
  cancel-in-progress: false

jobs:
  finalize-runner-evidence:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      TARGET_BRANCH: analysis/contest-lineage-v1
      AUDIT_PYTHON: /opt/python/3.11.9/bin/python3.11
      Z_INTERFACE_ROOT: governance/contest/z-interface/Z1.0.5
      EXPECTED_Z_COMPILER_BLOB: 7a9546b02fd598548891fd080c98a6553695b796
      EXPECTED_GRAPH_HASH: sha256:95cc643fcf7b468bf86e1dbbfd65fe29fc40392849aa2b752a07413226902d00
      EXPECTED_SELECTION_HASH: sha256:d6d19db916506c22542bbf68e01871330eae0efd110d9abd9a9d05d82e071c7e
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Verify Agent2 registered alias target dispatch
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          "$AUDIT_PYTHON" - <<'PY' | tee /tmp/agent2-runner-alias-evidence.json
          import json
          from pathlib import Path
          from tools.registry_compiler.runner_dispatch_evidence import (
              collect_runner_dispatch_evidence,
          )

          evidence = collect_runner_dispatch_evidence(
              Path(".").resolve(),
              "src.services.agent_runtime_hard_interface_v22515_service",
              "run_agent2_microbatch_hard",
              limit=20,
          )
          result = {
              "schema": "contest.agent2_runner_alias_evidence.v1",
              "runner": (
                  "src.services.agent_runtime_hard_interface_v22515_service:"
                  "run_agent2_microbatch_hard"
              ),
              "evidenceCount": len(evidence),
              "evidence": evidence,
              "businessRuntimeMutated": False,
              "databaseMutated": False,
              "providerCallsExecuted": 0,
          }
          print(json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2))
          if not any(
              item.get("kind") == "registered_alias_target_call"
              and item.get("matchedSymbol") == "run_agent2_draft_microbatch_hard"
              and item.get("path")
              == "src/services/agent_runtime_hard_interface_v22515_service.py"
              for item in evidence
          ):
              raise SystemExit("AGENT2_REGISTERED_ALIAS_TARGET_CALL_NOT_PROVED")
          PY
          grep -q 'registered_alias_target_call' /tmp/agent2-runner-alias-evidence.json
          echo "AGENT2_ALIAS_TARGET_DISPATCH=PASS"

      - name: Regenerate full review and enforce zero Runner drift
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          "$AUDIT_PYTHON" -m py_compile \
            tools/registry_compiler/runner_dispatch_evidence.py \
            tools/registry_compiler/repository_audit.py \
            tools/contest_governance/root_equivalence.py \
            tools/contest_governance/run_selection.py

          interface="$GITHUB_WORKSPACE/$Z_INTERFACE_ROOT/tools/registry_compiler/compile_registry.py"
          test "$(git hash-object "$interface")" = "$EXPECTED_Z_COMPILER_BLOB"

          rm -rf governance/contest/generated
          "$AUDIT_PYTHON" tools/contest_governance/run_selection.py \
            --root "$GITHUB_WORKSPACE" \
            --request governance/contest/selection-request.json \
            --output governance/contest/generated \
            --z-source "$GITHUB_WORKSPACE/$Z_INTERFACE_ROOT" \
            | tee /tmp/contest-runner-dispatch-final-summary.json

          grep -q '"registeredModuleCount": 23' governance/contest/generated/repository-audit.json
          grep -q '"runnerDriftCount": 0' governance/contest/generated/repository-audit.json
          grep -q '"runnerDrift": \[\]' governance/contest/generated/repository-audit.json
          ! grep -q 'REGISTERED_RUNNER_DRIFT_REVIEW_REQUIRED' governance/contest/generated/contest-chain-review.json

          grep -q '"rootEquivalent": true' governance/contest/generated/registry-snapshot.json
          grep -q 'REGISTRY_DOCUMENTS_VERIFIED_LAYERED_ROOT_COMPOSITION_VERIFIED' governance/contest/generated/contest-chain-review.json
          grep -q "\"graphHash\": \"$EXPECTED_GRAPH_HASH\"" governance/contest/generated/contest-chain-review.json
          grep -q "\"selectionHash\": \"$EXPECTED_SELECTION_HASH\"" governance/contest/generated/contest-chain-review.json
          grep -q '"KEEP_CORE": 14' governance/contest/generated/contest-chain-review.json
          grep -q '"KEEP_SUPPORT": 2' governance/contest/generated/contest-chain-review.json
          grep -q '"ISOLATE": 7' governance/contest/generated/contest-chain-review.json
          grep -q '"REMOVE_CANDIDATE": 0' governance/contest/generated/contest-chain-review.json
          grep -q '"REVIEW_REQUIRED": 0' governance/contest/generated/contest-chain-review.json

          grep -q '"businessRuntimeMutated": false' governance/contest/generated/execution-receipt.json
          grep -q '"databaseMutated": false' governance/contest/generated/execution-receipt.json
          grep -q '"providerCallsExecuted": 0' governance/contest/generated/execution-receipt.json
          grep -q '"physicalDeletionExecuted": false' governance/contest/generated/execution-receipt.json
          echo "ZERO_RUNNER_DRIFT_WITH_SELECTION_STABLE=PASS"

      - name: Commit final Runner evidence
        shell: bash
        run: |
          set -euo pipefail
          git add governance/contest/generated
          forbidden="$(git diff --cached --name-only | grep -Ev '^governance/contest/generated/' || true)"
          test -z "$forbidden"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "governance(contest): seal zero Runner drift evidence [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo "FINAL_RUNNER_EVIDENCE_PUSH=PASS"
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 10))
          done

      - name: Upload final Runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: contest-runner-dispatch-final
          path: |
            governance/contest/generated
            /tmp/agent2-runner-alias-evidence.json
            /tmp/contest-runner-dispatch-final-summary.json
          if-no-files-found: error
          retention-days: 14
