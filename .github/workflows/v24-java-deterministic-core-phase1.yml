name: V24 Java Deterministic Core Phase1

on:
  push:
    branches:
      - main
    paths:
      - 'java-control-plane/**'
      - 'governance/v24/**'
      - 'contracts/v24/**'
      - 'contracts/registry/**'
      - 'config/competition_runtime_scope.json'
      - 'config/competition_source_identity.json'
      - 'config/v23_registry_runtime.json'
      - 'scripts/compile_competition_lineage.py'
      - 'scripts/competition_interface_gate.py'
      - 'scripts/verify_v24_java_phase1.sh'
      - '.github/workflows/v24-java-deterministic-core-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v24-java-deterministic-core-phase1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-shadow-authority:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      V24_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Materialize exact source archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$V24_SOURCE_COMMIT"
          ARCHIVE="${RUNNER_TEMP}/v24-phase1-${SOURCE_COMMIT}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/v24-phase1-${SOURCE_COMMIT}"
          rm -rf "$ARCHIVE" "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          downloaded=0
          for attempt in $(seq 1 8); do
            echo "Archive download ${SOURCE_COMMIT} attempt ${attempt}/8"
            if curl \
              --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 300 \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${SOURCE_COMMIT}" \
              -o "$ARCHIVE"; then
              downloaded=1
              break
            fi
            rm -f "$ARCHIVE"
            sleep $((attempt * 5))
          done
          test "$downloaded" = "1"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          test -f "$EXTRACTED/scripts/verify_v24_java_phase1.sh"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$SOURCE_COMMIT" > .v24-phase1-source-commit

      - name: Prepare JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Python 3.10+
        shell: bash
        run: |
          set -euo pipefail
          for candidate in \
            /opt/python/3.11.9/bin/python3.11 \
            python3.13 python3.12 python3.11 python3.10 python3; do
            if { command -v "$candidate" >/dev/null 2>&1 || [ -x "$candidate" ]; } \
              && "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3,10) else 1)' 2>/dev/null; then
              if command -v "$candidate" >/dev/null 2>&1; then candidate="$(command -v "$candidate")"; fi
              echo "PYTHON_BIN=$candidate" >> "$GITHUB_ENV"
              "$candidate" -c 'import platform; print("python=" + platform.python_version())'
              exit 0
            fi
          done
          echo 'Python 3.10+ is required.' >&2
          exit 1

      - name: Verify V24.0-V24.5 shadow authority
        run: |
          set -euo pipefail
          bash scripts/verify_v24_java_phase1.sh

      - name: Verify evidence is default-deny and exact
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json
          from pathlib import Path

          root = Path('dist/v24-java-phase1')
          graph = json.loads((root / 'active-runtime-graph.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'active-runtime-manifest.json').read_text(encoding='utf-8'))
          phase = json.loads((root / 'phase1-verification-report.json').read_text(encoding='utf-8'))
          admission = json.loads((root / 'runtime-admission-report.json').read_text(encoding='utf-8'))
          assert graph['defaultRuntimeEligibility'] == 'DENY'
          assert graph['compatibilityDefault'] == 'DENY'
          assert manifest['unknownRuntimeNode'] == 'BLOCK'
          assert manifest['compatibilityDefault'] == 'DENY'
          assert phase['verified'] is True
          assert admission['verified'] is True
          print('V24_PHASE1_EVIDENCE_GATE=PASS')
          PY

      - name: Upload V24 phase1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v24-java-deterministic-core-phase1-${{ github.sha }}
          path: |
            dist/competition-lineage-v24/*.json
            dist/competition-lineage-v24/runtime-files.txt
            dist/competition-lineage-v24/runtime-files.sha256
            dist/v24-java-phase1/*.json
          if-no-files-found: error
          retention-days: 14
