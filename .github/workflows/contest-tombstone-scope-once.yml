name: Scope contest tombstone references once

on:
  push:
    branches:
      - migration/bulk-bootstrap
    paths:
      - .github/workflows/contest-tombstone-scope-once.yml

permissions:
  contents: write

concurrency:
  group: contest-tombstone-scope-once
  cancel-in-progress: false

jobs:
  scope-tombstones:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      TARGET_BRANCH: analysis/contest-lineage-v1
      AUDIT_PYTHON: /opt/python/3.11.9/bin/python3.11
      EXPECTED_GRAPH_HASH: sha256:95cc643fcf7b468bf86e1dbbfd65fe29fc40392849aa2b752a07413226902d00
      EXPECTED_SELECTION_HASH: sha256:d6d19db916506c22542bbf68e01871330eae0efd110d9abd9a9d05d82e071c7e
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Verify shared closure authority
        shell: bash
        run: |
          set -euo pipefail
          test -x "$AUDIT_PYTHON"
          test "$($AUDIT_PYTHON --version 2>&1)" = "Python 3.11.9"
          "$AUDIT_PYTHON" -m py_compile \
            tools/contest_governance/scope_unregistered_fields.py \
            tools/contest_governance/scope_tombstone_references.py
          grep -q '"runnerDriftCount": 0' governance/contest/generated/repository-audit.json
          grep -q '"rootEquivalent": true' governance/contest/generated/registry-snapshot.json
          grep -q "\"graphHash\": \"$EXPECTED_GRAPH_HASH\"" governance/contest/generated/contest-selection-manifest.json
          grep -q "\"selectionHash\": \"$EXPECTED_SELECTION_HASH\"" governance/contest/generated/contest-selection-manifest.json
          grep -q '"closurePathCount": 126' governance/contest/generated/unregistered-field-scope-review.json
          grep -q '"registeredPathSeedCount": 55' governance/contest/generated/unregistered-field-scope-review.json
          echo "TOMBSTONE_CLOSURE_AUTHORITY=PASS"

      - name: Partition all tombstone references
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          "$AUDIT_PYTHON" tools/contest_governance/scope_tombstone_references.py \
            --root "$GITHUB_WORKSPACE" \
            --generated governance/contest/generated \
            | tee /tmp/contest-tombstone-scope-summary.json

          test -f governance/contest/generated/tombstone-scope-review.json
          test -f governance/contest/generated/tombstone-scope-review.md
          test -f governance/contest/generated/tombstone-scope-receipt.json
          grep -q '"sourceReferenceCount": 67' governance/contest/generated/tombstone-scope-review.json
          grep -q '"partitionReferenceCount": 67' governance/contest/generated/tombstone-scope-review.json
          grep -q '"tombstoneKeyCount": 4' governance/contest/generated/tombstone-scope-review.json
          grep -q '"closurePathCount": 126' governance/contest/generated/tombstone-scope-review.json
          grep -q '"registeredPathSeedCount": 55' governance/contest/generated/tombstone-scope-review.json
          grep -q "\"graphHash\": \"$EXPECTED_GRAPH_HASH\"" governance/contest/generated/tombstone-scope-review.json
          grep -q "\"selectionHash\": \"$EXPECTED_SELECTION_HASH\"" governance/contest/generated/tombstone-scope-review.json
          grep -q '"businessRuntimeMutated": false' governance/contest/generated/tombstone-scope-receipt.json
          grep -q '"databaseMutated": false' governance/contest/generated/tombstone-scope-receipt.json
          grep -q '"providerCallsExecuted": 0' governance/contest/generated/tombstone-scope-receipt.json
          grep -q '"physicalDeletionExecuted": false' governance/contest/generated/tombstone-scope-receipt.json
          echo "TOMBSTONE_SCOPE_PARTITION=PASS"

      - name: Commit tombstone scope evidence
        shell: bash
        run: |
          set -euo pipefail
          git add \
            governance/contest/generated/tombstone-scope-review.json \
            governance/contest/generated/tombstone-scope-review.md \
            governance/contest/generated/tombstone-scope-receipt.json
          forbidden="$(git diff --cached --name-only | grep -Ev '^governance/contest/generated/tombstone-scope-(review\.json|review\.md|receipt\.json)$' || true)"
          test -z "$forbidden"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "governance(contest): scope tombstones to selected closure [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo "TOMBSTONE_SCOPE_PUSH=PASS"
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * 10))
          done

      - name: Upload tombstone evidence
        uses: actions/upload-artifact@v4
        with:
          name: contest-tombstone-scope-evidence
          path: |
            governance/contest/generated/tombstone-scope-review.json
            governance/contest/generated/tombstone-scope-review.md
            governance/contest/generated/tombstone-scope-receipt.json
            /tmp/contest-tombstone-scope-summary.json
          if-no-files-found: error
          retention-days: 14
