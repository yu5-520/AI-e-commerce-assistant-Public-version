name: V24 Java Deterministic Core Phase4

on:
  pull_request:
    paths:
      - 'java-control-plane/**'
      - 'governance/v24/phase4-**'
      - 'governance/v24/frontend-view-contract-v24.json'
      - 'scripts/export_v24_phase4_frontend_evidence.py'
      - 'scripts/verify_v24_java_phase4.sh'
      - 'src/api/routes/frontend_views.py'
      - 'src/services/frontend_view_artifact_v2259_service.py'
      - 'web_demo/core/hash-view-client-v2259.js'
      - '.github/workflows/v24-java-deterministic-core-phase4.yml'
  push:
    branches:
      - main
    paths:
      - 'java-control-plane/**'
      - 'governance/v24/phase4-**'
      - 'governance/v24/frontend-view-contract-v24.json'
      - 'scripts/export_v24_phase4_frontend_evidence.py'
      - 'scripts/verify_v24_java_phase4.sh'
      - 'src/api/routes/frontend_views.py'
      - 'src/services/frontend_view_artifact_v2259_service.py'
      - 'web_demo/core/hash-view-client-v2259.js'
      - '.github/workflows/v24-java-deterministic-core-phase4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v24-java-deterministic-core-phase4-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase4-frontend-authority:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      V24_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Materialize exact source archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$V24_SOURCE_COMMIT"
          ARCHIVE="${RUNNER_TEMP}/v24-phase4-${SOURCE_COMMIT}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/v24-phase4-${SOURCE_COMMIT}"
          rm -rf "$ARCHIVE" "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          downloaded=0
          for attempt in $(seq 1 8); do
            echo "Archive download ${SOURCE_COMMIT} attempt ${attempt}/8"
            if curl \
              --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 300 \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${SOURCE_COMMIT}" \
              -o "$ARCHIVE"; then
              downloaded=1
              break
            fi
            rm -f "$ARCHIVE"
            sleep $((attempt * 5))
          done
          test "$downloaded" = "1"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          test -f "$EXTRACTED/scripts/verify_v24_java_phase4.sh"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$SOURCE_COMMIT" > .v24-phase4-source-commit

      - name: Prepare JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Python 3.10+
        shell: bash
        run: |
          set -euo pipefail
          for candidate in \
            /opt/python/3.11.9/bin/python3.11 \
            python3.13 python3.12 python3.11 python3.10 python3; do
            if { command -v "$candidate" >/dev/null 2>&1 || [ -x "$candidate" ]; } \
              && "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3,10) else 1)' 2>/dev/null; then
              if command -v "$candidate" >/dev/null 2>&1; then candidate="$(command -v "$candidate")"; fi
              echo "PYTHON_BIN=$candidate" >> "$GITHUB_ENV"
              "$candidate" -c 'import platform; print("python=" + platform.python_version())'
              exit 0
            fi
          done
          echo 'Python 3.10+ is required.' >&2
          exit 1

      - name: Verify V24.16-V24.17 frontend authority
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_v24_java_phase4.sh

      - name: Verify Phase4 production boundary
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('dist/v24-java-phase4/phase4-verification-report.json').read_text(encoding='utf-8'))
          assert report['verified'] is True
          assert report['enforcementMode'] == 'SHADOW'
          assert report['headReadPure'] is True
          assert report['casSingleWinner'] is True
          assert report['staleGenerationBlocked'] is True
          assert report['duplicateSseSuppressed'] is True
          assert report['changedModuleFetchIsolation'] is True
          assert report['pythonProductionViewWriteAuthorityUnchanged'] is True
          assert report['browserJsRuntimeUnchanged'] is True
          assert report['javaProductionViewCutoverEnabled'] is False
          assert report['networkSseCutoverEnabled'] is False
          print('V24_PHASE4_AUTHORITY_BOUNDARY=PASS')
          PY

      - name: Upload V24 phase4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v24-java-deterministic-core-phase4-${{ github.sha }}
          path: dist/v24-java-phase4/*.json
          if-no-files-found: error
          retention-days: 14
