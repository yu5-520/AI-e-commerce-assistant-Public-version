name: Apply Operator Core Boundary

on:
  push:
    branches:
      - competition/operator-core-boundary-v1
    paths:
      - 'scripts/apply_operator_core_boundary.py'
      - '.github/workflows/apply-operator-core-boundary.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-operator-core-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-boundary:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      PATCH_PYTHON: /opt/python/3.11.9/bin/python3.11
      TARGET_BRANCH: competition/operator-core-boundary-v1
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - name: Materialize exact branch head archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/operator-boundary-${EXPECTED_HEAD}.tar.gz"
          ROOT="${RUNNER_TEMP}/operator-boundary-${EXPECTED_HEAD}"
          rm -rf "$ARCHIVE" "$ROOT"
          mkdir -p "$ROOT"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --connect-timeout 20 \
            --max-time 300 \
            -H "Authorization: Bearer ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${EXPECTED_HEAD}" \
            -o "$ARCHIVE"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$ROOT" --strip-components=1
          test -f "$ROOT/scripts/apply_operator_core_boundary.py"
          printf 'PATCH_ROOT=%s\n' "$ROOT" >> "$GITHUB_ENV"

      - name: Apply validated atomic repository migration
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -x "$PATCH_PYTHON" ]
          "$PATCH_PYTHON" "$PATCH_ROOT/scripts/apply_operator_core_boundary.py" \
            --root "$PATCH_ROOT" \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$TARGET_BRANCH" \
            --token "$GH_WRITE_TOKEN" \
            --expected-head "$EXPECTED_HEAD"
