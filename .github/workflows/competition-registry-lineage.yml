name: Competition Registry Lineage

on:
  pull_request:
    paths:
      - 'src/**'
      - 'web_demo/**'
      - 'config/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'release/**'
      - 'requirements.lock'
      - 'VERSION.md'
      - '.github/workflows/competition-registry-lineage.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: competition-registry-lineage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-lineage:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      COMPETITION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Materialize exact source commit archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/competition-lineage-source-${COMPETITION_SOURCE_COMMIT}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/competition-lineage-source-${COMPETITION_SOURCE_COMMIT}"
          rm -rf "$ARCHIVE" "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          DOWNLOADED=0
          for attempt in $(seq 1 8); do
            echo "Archive download attempt ${attempt}/8"
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 20 \
              --max-time 300 \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${COMPETITION_SOURCE_COMMIT}" \
              -o "$ARCHIVE"; then
              DOWNLOADED=1
              break
            fi
            rm -f "$ARCHIVE"
            sleep $((attempt * 5))
          done
          test "$DOWNLOADED" = "1"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          test -f "$EXTRACTED/scripts/compile_competition_lineage.py"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$COMPETITION_SOURCE_COMMIT" > "$GITHUB_WORKSPACE/.competition-source-commit"
          test "$(cat "$GITHUB_WORKSPACE/.competition-source-commit")" = "$COMPETITION_SOURCE_COMMIT"
          echo "competitionSourceCommit=$COMPETITION_SOURCE_COMMIT"

      - name: Resolve ECS Python 3.10+
        run: |
          set -euo pipefail
          CANDIDATE_FILE="${RUNNER_TEMP}/competition-python-candidates.txt"
          : > "$CANDIDATE_FILE"

          for candidate in \
            python3.13 python3.12 python3.11 python3.10 \
            /usr/local/bin/python3.13 /usr/local/bin/python3.12 \
            /usr/local/bin/python3.11 /usr/local/bin/python3.10 \
            /usr/bin/python3.13 /usr/bin/python3.12 \
            /usr/bin/python3.11 /usr/bin/python3.10; do
            if command -v "$candidate" >/dev/null 2>&1; then
              command -v "$candidate" >> "$CANDIDATE_FILE"
            elif [ -x "$candidate" ]; then
              printf '%s\n' "$candidate" >> "$CANDIDATE_FILE"
            fi
          done

          for search_root in /opt /usr/local /home "$RUNNER_TOOL_CACHE"; do
            [ -d "$search_root" ] || continue
            find "$search_root" -maxdepth 7 -type f \
              \( -name 'python3.13' -o -name 'python3.12' -o -name 'python3.11' -o -name 'python3.10' -o -name 'python' \) \
              -perm -u+x -print 2>/dev/null >> "$CANDIDATE_FILE" || true
          done

          sort -u "$CANDIDATE_FILE" -o "$CANDIDATE_FILE"
          echo 'Discovered Python candidates:'
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            version="$($candidate -c 'import platform; print(platform.python_version())' 2>/dev/null || true)"
            printf '  %s -> %s\n' "$candidate" "${version:-unusable}"
            if "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' 2>/dev/null; then
              printf 'PYTHON_BIN=%s\n' "$candidate" >> "$GITHUB_ENV"
              printf 'Resolved PYTHON_BIN=%s (%s)\n' "$candidate" "$version"
              exit 0
            fi
          done < "$CANDIDATE_FILE"

          echo 'No usable Python 3.10+ runtime exists on this ECS runner.' >&2
          echo 'Install Python 3.10+ once on ECS or point the workflow to an existing application venv.' >&2
          exit 1

      - name: Verify resolved Python
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import platform
          import sys
          assert sys.version_info >= (3, 10), sys.version
          print(platform.python_version())
          PY

      - name: Compile registry and hash lineage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          rm -rf dist/competition-lineage dist/competition-lineage-summary.json
          "$PYTHON_BIN" -m py_compile scripts/compile_competition_lineage.py
          mkdir -p dist
          "$PYTHON_BIN" scripts/compile_competition_lineage.py \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --output-dir dist/competition-lineage \
            | tee dist/competition-lineage-summary.json

      - name: Verify evidence files
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m json.tool dist/competition-lineage/source-identity.json >/dev/null
          "$PYTHON_BIN" -m json.tool dist/competition-lineage/registry-snapshot.json >/dev/null
          "$PYTHON_BIN" -m json.tool dist/competition-lineage/lineage-graph.json >/dev/null
          "$PYTHON_BIN" -m json.tool dist/competition-lineage/verification-report.json >/dev/null
          "$PYTHON_BIN" -m json.tool dist/competition-lineage/evidence-manifest.json >/dev/null
          test -s dist/competition-lineage/runtime-files.txt
          test -s dist/competition-lineage/runtime-files.sha256
          "$PYTHON_BIN" - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path('dist/competition-lineage/verification-report.json').read_text(encoding='utf-8')
          )
          assert report.get('verified') is True, report.get('findings')
          assert report.get('sourceCommit') == os.environ['COMPETITION_SOURCE_COMMIT'], report
          assert report.get('runtimeFileCount', 0) > 0, report
          assert report.get('registryModuleCount') == 9, report
          assert report.get('shadowEntrypoints') == [], report
          print(json.dumps({
              'verified': report['verified'],
              'sourceCommit': report['sourceCommit'],
              'runtimeFileCount': report['runtimeFileCount'],
              'registryModuleCount': report['registryModuleCount'],
              'runtimeHash': report['runtimeHash'],
              'graphHash': report['graphHash'],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publish lineage evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: competition-registry-lineage-${{ env.COMPETITION_SOURCE_COMMIT }}
          path: |
            dist/competition-lineage
            dist/competition-lineage-summary.json
          if-no-files-found: error
          retention-days: 14
