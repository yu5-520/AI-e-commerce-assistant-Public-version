name: Competition Registry Lineage

on:
  pull_request:
    paths:
      - 'src/**'
      - 'web_demo/**'
      - 'config/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'release/**'
      - 'governance/**'
      - 'requirements.lock'
      - 'VERSION.md'
      - '.github/workflows/competition-registry-lineage.yml'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      baseline_commit:
        description: 'Optional exact BASE commit. Defaults to PR base, push before, or current SHA.'
        required: false
        type: string
      profile:
        description: 'Lineage update policy profile.'
        required: false
        default: governance_bootstrap
        type: string

permissions:
  contents: read

concurrency:
  group: competition-registry-lineage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-lineage:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      COMPETITION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPETITION_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || inputs.baseline_commit || github.event.before || github.sha }}
      LINEAGE_UPDATE_PROFILE: ${{ inputs.profile || 'governance_bootstrap' }}
      LINEAGE_UPDATE_POLICY: governance/competition_lineage_update_policy.json
    steps:
      - name: Materialize exact BASE and TARGET source archives
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SOURCE_COMMIT="$COMPETITION_SOURCE_COMMIT"
          BASE_COMMIT="$COMPETITION_BASELINE_COMMIT"
          if ! [[ "$BASE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            BASE_COMMIT="$SOURCE_COMMIT"
          fi
          printf 'COMPETITION_BASELINE_COMMIT=%s\n' "$BASE_COMMIT" >> "$GITHUB_ENV"

          download_archive() {
            local commit="$1"
            local archive="$2"
            local downloaded=0
            rm -f "$archive"
            for attempt in $(seq 1 8); do
              echo "Archive download ${commit} attempt ${attempt}/8"
              if curl \
                --fail \
                --location \
                --silent \
                --show-error \
                --connect-timeout 20 \
                --max-time 300 \
                -H "Authorization: Bearer ${GH_READ_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${commit}" \
                -o "$archive"; then
                downloaded=1
                break
              fi
              rm -f "$archive"
              sleep $((attempt * 5))
            done
            test "$downloaded" = "1"
            test -s "$archive"
          }

          TARGET_ARCHIVE="${RUNNER_TEMP}/competition-lineage-target-${SOURCE_COMMIT}.tar.gz"
          TARGET_EXTRACTED="${RUNNER_TEMP}/competition-lineage-target-${SOURCE_COMMIT}"
          BASE_ARCHIVE="${RUNNER_TEMP}/competition-lineage-base-${BASE_COMMIT}.tar.gz"
          BASE_EXTRACTED="${RUNNER_TEMP}/competition-lineage-base-${BASE_COMMIT}"

          rm -rf "$TARGET_EXTRACTED" "$BASE_EXTRACTED"
          mkdir -p "$TARGET_EXTRACTED" "$BASE_EXTRACTED"
          download_archive "$SOURCE_COMMIT" "$TARGET_ARCHIVE"
          download_archive "$BASE_COMMIT" "$BASE_ARCHIVE"
          tar -xzf "$TARGET_ARCHIVE" -C "$TARGET_EXTRACTED" --strip-components=1
          tar -xzf "$BASE_ARCHIVE" -C "$BASE_EXTRACTED" --strip-components=1

          test -f "$TARGET_EXTRACTED/scripts/compile_competition_lineage.py"
          test -f "$TARGET_EXTRACTED/scripts/verify_competition_lineage_update.py"
          test -f "$TARGET_EXTRACTED/scripts/plan_competition_recovery_scope.py"
          test -f "$TARGET_EXTRACTED/governance/competition_lineage_update_policy.json"
          test -f "$TARGET_EXTRACTED/governance/runtime_contract_lineage_repair_policy.json"
          test -f "$TARGET_EXTRACTED/governance/competition_misrouted_fix_recovery_v1.json"
          test -f "$BASE_EXTRACTED/scripts/compile_competition_lineage.py"

          PROFILE="$LINEAGE_UPDATE_PROFILE"
          POLICY="$LINEAGE_UPDATE_POLICY"
          TARGET_CONTRACT_REGISTRY="$TARGET_EXTRACTED/config/runtime_contract_lineage_registry_v1.json"
          BASE_CONTRACT_REGISTRY="$BASE_EXTRACTED/config/runtime_contract_lineage_registry_v1.json"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            V25_PHASE3_CHANGED=0
            for relative in \
              src/__init__.py \
              src/services/unified_agent_knowledge_v25_service.py \
              src/services/v25_agent_input_ingress_service.py \
              src/services/v25_knowledge_runtime_projection.py \
              src/services/v25_knowledge_runtime_projection_install_service.py \
              governance/v25/knowledge-composition-table-v25.json \
              governance/v25/phase3-agent-knowledge-migration-policy.json; do
              if [ ! -f "$TARGET_EXTRACTED/$relative" ]; then
                continue
              fi
              if [ ! -f "$BASE_EXTRACTED/$relative" ] || ! cmp -s "$BASE_EXTRACTED/$relative" "$TARGET_EXTRACTED/$relative"; then
                V25_PHASE3_CHANGED=1
                break
              fi
            done
            if [ "$V25_PHASE3_CHANGED" = "1" ]; then
              test -f "$TARGET_EXTRACTED/governance/v25/competition-lineage-update-policy-phase3.json"
              PROFILE="v25_phase3_knowledge_ingress"
              POLICY="governance/v25/competition-lineage-update-policy-phase3.json"
            elif [ -f "$TARGET_CONTRACT_REGISTRY" ] && { [ ! -f "$BASE_CONTRACT_REGISTRY" ] || ! cmp -s "$BASE_CONTRACT_REGISTRY" "$TARGET_CONTRACT_REGISTRY"; }; then
              PROFILE="runtime_contract_lineage_repair"
              POLICY="governance/runtime_contract_lineage_repair_policy.json"
            else
              TASK_EVIDENCE_REPAIR_CHANGED=0
              for relative in \
                governance/task_evidence_canonical_history_repair_v1.json \
                src/services/task_evidence_canonical_history_v1_service.py \
                src/services/task_evidence_canonical_history_install_v1_service.py \
                scripts/verify_task_evidence_canonical_history.py; do
                if [ ! -f "$TARGET_EXTRACTED/$relative" ]; then
                  continue
                fi
                if [ ! -f "$BASE_EXTRACTED/$relative" ] || ! cmp -s "$BASE_EXTRACTED/$relative" "$TARGET_EXTRACTED/$relative"; then
                  TASK_EVIDENCE_REPAIR_CHANGED=1
                  break
                fi
              done
              if [ "$TASK_EVIDENCE_REPAIR_CHANGED" = "1" ]; then
                test -f "$TARGET_EXTRACTED/governance/task_evidence_canonical_history_repair_v1.json"
                PROFILE="runtime_contract_lineage_repair"
                POLICY="governance/runtime_contract_lineage_repair_policy.json"
              else
                PRECACHE_CHANGED=0
                for relative in \
                  config/competition_hash_precache_registry_v1.json \
                  src/services/competition_hash_precache_registry_v1_service.py \
                  src/services/competition_evidence_v215_runtime_service.py; do
                  if [ ! -f "$TARGET_EXTRACTED/$relative" ]; then
                    continue
                  fi
                  if [ ! -f "$BASE_EXTRACTED/$relative" ] || ! cmp -s "$BASE_EXTRACTED/$relative" "$TARGET_EXTRACTED/$relative"; then
                    PRECACHE_CHANGED=1
                    break
                  fi
                done
                if [ "$PRECACHE_CHANGED" = "1" ]; then
                  test -f "$TARGET_EXTRACTED/governance/competition_hash_precache_lineage_policy.json"
                  PROFILE="hash_precache_registry"
                  POLICY="governance/competition_hash_precache_lineage_policy.json"
                fi
              fi
            fi
          fi
          printf 'LINEAGE_UPDATE_PROFILE=%s\n' "$PROFILE" >> "$GITHUB_ENV"
          printf 'LINEAGE_UPDATE_POLICY=%s\n' "$POLICY" >> "$GITHUB_ENV"

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$TARGET_EXTRACTED"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$SOURCE_COMMIT" > "$GITHUB_WORKSPACE/.competition-source-commit"
          test "$(cat "$GITHUB_WORKSPACE/.competition-source-commit")" = "$SOURCE_COMMIT"
          printf 'BASELINE_ROOT=%s\n' "$BASE_EXTRACTED" >> "$GITHUB_ENV"
          echo "competitionBaselineCommit=$BASE_COMMIT"
          echo "competitionSourceCommit=$SOURCE_COMMIT"
          echo "lineageUpdateProfile=$PROFILE"
          echo "lineageUpdatePolicy=$POLICY"

      - name: Resolve ECS Python 3.10+
        run: |
          set -euo pipefail
          CANDIDATE_FILE="${RUNNER_TEMP}/competition-python-candidates.txt"
          : > "$CANDIDATE_FILE"

          for candidate in \
            python3.13 python3.12 python3.11 python3.10 \
            /usr/local/bin/python3.13 /usr/local/bin/python3.12 \
            /usr/local/bin/python3.11 /usr/local/bin/python3.10 \
            /usr/bin/python3.13 /usr/bin/python3.12 \
            /usr/bin/python3.11 /usr/bin/python3.10; do
            if command -v "$candidate" >/dev/null 2>&1; then
              command -v "$candidate" >> "$CANDIDATE_FILE"
            elif [ -x "$candidate" ]; then
              printf '%s\n' "$candidate" >> "$CANDIDATE_FILE"
            fi
          done

          for search_root in /opt /usr/local /home "$RUNNER_TOOL_CACHE"; do
            [ -d "$search_root" ] || continue
            find "$search_root" -maxdepth 7 -type f \
              \( -name 'python3.13' -o -name 'python3.12' -o -name 'python3.11' -o -name 'python3.10' -o -name 'python' \) \
              -perm -u+x -print 2>/dev/null >> "$CANDIDATE_FILE" || true
          done

          sort -u "$CANDIDATE_FILE" -o "$CANDIDATE_FILE"
          echo 'Discovered Python candidates:'
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            version="$($candidate -c 'import platform; print(platform.python_version())' 2>/dev/null || true)"
            printf '  %s -> %s\n' "$candidate" "${version:-unusable}"
            if "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' 2>/dev/null; then
              printf 'PYTHON_BIN=%s\n' "$candidate" >> "$GITHUB_ENV"
              printf 'Resolved PYTHON_BIN=%s (%s)\n' "$candidate" "$version"
              exit 0
            fi
          done < "$CANDIDATE_FILE"

          echo 'No usable Python 3.10+ runtime exists on this ECS runner.' >&2
          echo 'Install Python 3.10+ once on ECS or point the workflow to an existing application venv.' >&2
          exit 1

      - name: Verify resolved Python
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import platform
          import sys
          assert sys.version_info >= (3, 10), sys.version
          print(platform.python_version())
          PY

      - name: Compile TARGET registry and hash lineage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          rm -rf dist/competition-lineage dist/competition-lineage-baseline
          rm -f dist/competition-lineage-summary.json dist/competition-lineage-baseline-summary.json
          rm -f dist/competition-lineage-update-report.json dist/competition-lineage-update-summary.json
          rm -f dist/competition-recovery-scope-plan.json dist/competition-recovery-scope-summary.json
          "$PYTHON_BIN" -m py_compile \
            scripts/compile_competition_lineage.py \
            scripts/verify_competition_lineage_update.py \
            scripts/plan_competition_recovery_scope.py
          mkdir -p dist
          "$PYTHON_BIN" scripts/compile_competition_lineage.py \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --output-dir dist/competition-lineage \
            | tee dist/competition-lineage-summary.json

      - name: Plan misplaced competition fixes from TARGET lineage
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/plan_competition_recovery_scope.py \
            --recovery governance/competition_misrouted_fix_recovery_v1.json \
            --lineage-dir dist/competition-lineage \
            --output dist/competition-recovery-scope-plan.json \
            | tee dist/competition-recovery-scope-summary.json

      - name: Compile BASE registry and hash lineage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test -n "$BASELINE_ROOT"
          test -f "$BASELINE_ROOT/scripts/compile_competition_lineage.py"
          "$PYTHON_BIN" -m py_compile "$BASELINE_ROOT/scripts/compile_competition_lineage.py"
          BASE_OUTPUT="$BASELINE_ROOT/dist/competition-lineage-baseline"
          rm -rf "$BASE_OUTPUT" dist/competition-lineage-baseline
          (
            cd "$BASELINE_ROOT"
            "$PYTHON_BIN" scripts/compile_competition_lineage.py \
              --root "$BASELINE_ROOT" \
              --source-commit "$COMPETITION_BASELINE_COMMIT" \
              --output-dir dist/competition-lineage-baseline
          ) | tee dist/competition-lineage-baseline-summary.json
          test -d "$BASE_OUTPUT"
          cp -a "$BASE_OUTPUT" dist/competition-lineage-baseline

      - name: Verify BASE to TARGET hash-lineage update scope
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/verify_competition_lineage_update.py \
            --baseline-dir dist/competition-lineage-baseline \
            --target-dir dist/competition-lineage \
            --policy "$LINEAGE_UPDATE_POLICY" \
            --profile "$LINEAGE_UPDATE_PROFILE" \
            --output dist/competition-lineage-update-report.json \
            | tee dist/competition-lineage-update-summary.json

      - name: Verify evidence files
        run: |
          set -euo pipefail
          for evidence_dir in dist/competition-lineage-baseline dist/competition-lineage; do
            "$PYTHON_BIN" -m json.tool "$evidence_dir/source-identity.json" >/dev/null
            "$PYTHON_BIN" -m json.tool "$evidence_dir/registry-snapshot.json" >/dev/null
            "$PYTHON_BIN" -m json.tool "$evidence_dir/lineage-graph.json" >/dev/null
            "$PYTHON_BIN" -m json.tool "$evidence_dir/verification-report.json" >/dev/null
            "$PYTHON_BIN" -m json.tool "$evidence_dir/evidence-manifest.json" >/dev/null
            test -s "$evidence_dir/runtime-files.txt"
            test -s "$evidence_dir/runtime-files.sha256"
          done
          "$PYTHON_BIN" -m json.tool dist/competition-lineage-update-report.json >/dev/null
          "$PYTHON_BIN" -m json.tool dist/competition-recovery-scope-plan.json >/dev/null
          "$PYTHON_BIN" - <<'PY'
          import json
          import os
          from pathlib import Path

          target = json.loads(
              Path('dist/competition-lineage/verification-report.json').read_text(encoding='utf-8')
          )
          baseline = json.loads(
              Path('dist/competition-lineage-baseline/verification-report.json').read_text(encoding='utf-8')
          )
          update = json.loads(
              Path('dist/competition-lineage-update-report.json').read_text(encoding='utf-8')
          )
          recovery = json.loads(
              Path('dist/competition-recovery-scope-plan.json').read_text(encoding='utf-8')
          )
          assert target.get('verified') is True, target.get('findings')
          assert baseline.get('verified') is True, baseline.get('findings')
          assert target.get('sourceCommit') == os.environ['COMPETITION_SOURCE_COMMIT'], target
          assert baseline.get('sourceCommit') == os.environ['COMPETITION_BASELINE_COMMIT'], baseline
          assert target.get('runtimeFileCount', 0) > 0, target
          assert target.get('registryModuleCount') == 9, target
          assert target.get('shadowEntrypoints') == [], target
          assert update.get('verified') is True, update.get('findings')
          assert recovery.get('verified') is True, recovery.get('findings')
          assert recovery.get('sourceCommit') == os.environ['COMPETITION_SOURCE_COMMIT'], recovery
          print(json.dumps({
              'verified': update['verified'],
              'profile': update['profile'],
              'baselineCommit': update['baselineCommit'],
              'targetCommit': update['targetCommit'],
              'baselineRuntimeHash': update['baselineRuntimeHash'],
              'targetRuntimeHash': update['targetRuntimeHash'],
              'baselineGraphHash': update['baselineGraphHash'],
              'targetGraphHash': update['targetGraphHash'],
              'runtimeHashChanged': update['runtimeHashChanged'],
              'graphHashChanged': update['graphHashChanged'],
              'changedRuntimeFiles': update['changedRuntimeFiles'],
              'changedRegistryModules': update['changedRegistryModules'],
              'updateHash': update['updateHash'],
              'recoveryPlanHash': recovery['planHash'],
              'recoveryRequirements': [
                  {
                      'id': item['id'],
                      'status': item['structuralStatus'],
                      'candidateRuntimePathCount': len(item['candidateRuntimePaths']),
                  }
                  for item in recovery['requirements']
              ],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publish lineage and update-control evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: competition-registry-lineage-${{ env.COMPETITION_SOURCE_COMMIT }}
          path: |
            dist/competition-lineage
            dist/competition-lineage-baseline
            dist/competition-lineage-summary.json
            dist/competition-lineage-baseline-summary.json
            dist/competition-lineage-update-report.json
            dist/competition-lineage-update-summary.json
            dist/competition-recovery-scope-plan.json
            dist/competition-recovery-scope-summary.json
          if-no-files-found: error
          retention-days: 14
