name: Finalize Operator Boundary Cleanup

on:
  push:
    branches:
      - competition/operator-core-boundary-v1
    paths:
      - 'scripts/finalize_operator_boundary_cleanup.py'
      - '.github/workflows/finalize-operator-boundary-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-operator-boundary-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-boundary:
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      PATCH_PYTHON: /opt/python/3.11.9/bin/python3.11
    steps:
      - name: Materialize exact finalizer
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/operator-boundary-finalizer-${GITHUB_SHA}"
          ARCHIVE="${ROOT}.tar.gz"
          rm -rf "$ROOT" "$ARCHIVE"
          mkdir -p "$ROOT"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --connect-timeout 20 \
            --max-time 300 \
            -H "Authorization: Bearer ${GH_READ_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$ROOT" --strip-components=1
          test -f "$ROOT/scripts/finalize_operator_boundary_cleanup.py"
          printf 'PATCH_ROOT=%s\n' "$ROOT" >> "$GITHUB_ENV"

      - name: Apply final fixed-operator boundary cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ -x "$PATCH_PYTHON" ]
          "$PATCH_PYTHON" "$PATCH_ROOT/scripts/finalize_operator_boundary_cleanup.py"
