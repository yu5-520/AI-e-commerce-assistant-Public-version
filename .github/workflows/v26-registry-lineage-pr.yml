name: V26 Registry Lineage PR Gate

on:
  pull_request:
    paths:
      - 'src/services/v269*.py'
      - 'tests/test_v22_4_v269*.py'
      - 'src/services/agent_input_contract_v225_service.py'
      - 'src/services/agent_input_contract_v2258_service.py'
      - 'src/services/agent_input_transport_v2258_service.py'
      - 'src/services/agent_token_runtime_hash_exact_v2259_service.py'
      - 'src/services/real_product_judgment_agent_v2259_service.py'
      - 'src/services/v25_agent_input_ingress_service.py'
      - 'src/services/agent_hash_routed_rag_bridge_v1_service.py'
      - 'src/services/v26_revision_acceptance_service.py'
      - 'src/services/v26_sop_evidence_service.py'
      - 'src/services/agent_input_transport_v225_service.py'
      - 'src/services/agent_token_runtime_v22520_service.py'
      - 'src/services/agent3_runtime_v23215_service.py'
      - 'config/v23_registry_runtime.json'
      - 'config/v26_field_authority_contract.json'
      - 'governance/v26-field-authority-update-policy.json'
      - 'src/services/v26_field_authority_contract_service.py'
      - 'src/services/v26_business_graph_bridge_service.py'
      - 'src/services/v26_node_edge_lineage_service.py'
      - 'src/services/agent_token_runtime_v225_service.py'
      - '.github/workflows/v26-registry-lineage-pr.yml'
      - '.github/workflows/competition-registry-lineage.yml'

permissions:
  contents: read

concurrency:
  group: v26-registry-lineage-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  verify-base-target-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact TARGET
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target-src
          persist-credentials: false

      - name: Checkout exact BASE
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-src
          persist-credentials: false

      - name: Prepare exact release Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Compile exact BASE and TARGET lineage evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_SHA" != "$TARGET_SHA"
          python -m py_compile \
            target-src/scripts/compile_competition_lineage.py \
            target-src/scripts/verify_competition_lineage_update.py

          (
            cd base-src
            python scripts/compile_competition_lineage.py \
              --source-commit "$BASE_SHA" \
              --output-dir dist/v26-pr-lineage
          )
          (
            cd target-src
            python scripts/compile_competition_lineage.py \
              --source-commit "$TARGET_SHA" \
              --output-dir dist/v26-pr-lineage
          )

      - name: Verify BASE to TARGET with existing V26 policy
        shell: bash
        run: |
          set -euo pipefail
          python target-src/scripts/verify_competition_lineage_update.py \
            --baseline-dir base-src/dist/v26-pr-lineage \
            --target-dir target-src/dist/v26-pr-lineage \
            --policy target-src/governance/v26-field-authority-update-policy.json \
            --profile v26_field_authority \
            --output target-src/dist/v26-pr-lineage-update-report.json

          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('target-src/dist/v26-pr-lineage-update-report.json').read_text(encoding='utf-8'))
          assert report['verified'] is True
          assert report['profile'] == 'v26_field_authority'
          assert report['baselineCommit'] != report['targetCommit']
          print('V26_PR_REGISTRY_LINEAGE=PASS')
          print('BASE=' + report['baselineCommit'])
          print('TARGET=' + report['targetCommit'])
          print('UPDATE_HASH=' + report['updateHash'])
          PY

      - name: Verify runtime regressions on exact release Python
        working-directory: target-src
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m pytest -q
