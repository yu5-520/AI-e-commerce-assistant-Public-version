name: Public Release Unsafe Branch Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-release-unsafe-branch-cleanup-once.yml'

permissions:
  contents: write

jobs:
  preserve-and-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve all archived unsafe tips behind a non-branch tag
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_TAG: public-release-unsafe-branch-archive-20260901
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          tag = os.environ['ARCHIVE_TAG']
          api = f'https://api.github.com/repos/{repo}'

          def call(method, path, payload=None, allow_404=False):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  body = exc.read().decode('utf-8', 'replace')
                  raise SystemExit(f'GitHub API {method} {path} failed: {exc.code} {body}')

          manifest = json.loads(Path('governance/public_release_archived_unsafe_branch_tips.json').read_text(encoding='utf-8'))
          branch_tips = [str(item['tipSha']) for item in manifest['branches']]
          unique_tips = sorted(set(branch_tips))
          assert manifest['unsafeBranchCount'] == 71, manifest['unsafeBranchCount']
          assert manifest['unsafeWorkflowCount'] == 1081, manifest['unsafeWorkflowCount']
          assert len(branch_tips) == 71
          assert unique_tips
          assert all(len(sha) == 40 for sha in unique_tips)

          ref = call('GET', f'/git/ref/tags/{tag}', allow_404=True)
          if ref is None:
              for sha in unique_tips:
                  assert call('GET', f'/git/commits/{sha}', allow_404=True) is not None, f'missing archived commit {sha}'
              head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
              archive_commit = call('POST', '/git/commits', {
                  'message': 'Public release archive: preserve removed unsafe branch tips',
                  'tree': tree,
                  'parents': [head, *unique_tips],
              })
              ref = call('POST', '/git/refs', {
                  'ref': f'refs/tags/{tag}',
                  'sha': archive_commit['sha'],
              })

          archive_sha = ref['object']['sha']
          archive_commit = call('GET', f'/git/commits/{archive_sha}')
          parents = {item['sha'] for item in archive_commit['parents']}
          missing = sorted(set(unique_tips) - parents)
          assert not missing, f'archive tag is missing preserved tips: {missing}'
          print(f'PUBLIC_RELEASE_ARCHIVE_TAG={tag}')
          print(f'PUBLIC_RELEASE_ARCHIVE_COMMIT={archive_sha}')
          print(f'PUBLIC_RELEASE_ARCHIVED_BRANCH_RECORDS={len(branch_tips)}')
          print(f'PUBLIC_RELEASE_ARCHIVED_UNIQUE_TIPS={len(unique_tips)}')
          print('PUBLIC_RELEASE_ARCHIVE_TAG_BOUNDARY=verified')
          PY

      - name: Remove closed audit PR head ref if unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BRANCH: security/ref-boundary-audit-v1
          EXPECTED_AUDIT_SHA: 652201448692781bda9cc251c0e0303257dc943a
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          branch = os.environ['AUDIT_BRANCH']
          expected = os.environ['EXPECTED_AUDIT_SHA']
          api = f'https://api.github.com/repos/{repo}'

          def call(method, path, allow_404=False):
              req = urllib.request.Request(
                  api + path,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  body = exc.read().decode('utf-8', 'replace')
                  raise SystemExit(f'GitHub API {method} {path} failed: {exc.code} {body}')

          path = f'/git/ref/heads/{branch}'
          ref = call('GET', path, allow_404=True)
          if ref is None:
              print('PUBLIC_RELEASE_AUDIT_BRANCH_ALREADY_REMOVED=true')
          else:
              actual = ref['object']['sha']
              assert actual == expected, f'audit branch moved: expected={expected} actual={actual}'
              call('DELETE', f'/git/refs/heads/{branch}')
              print('PUBLIC_RELEASE_AUDIT_BRANCH_REMOVED=verified')
          PY

      - name: Retire one-time cleanup machinery from main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/public-release-unsafe-branch-cleanup-once.yml
          git rm scripts/cleanup_public_release_unsafe_branches.py
          git diff --cached --check
          git commit -m 'Security: retire one-time public-release cleanup machinery'
          git push origin HEAD:main
          echo 'PUBLIC_RELEASE_ONE_TIME_CLEANUP_RETIRED=verified'
