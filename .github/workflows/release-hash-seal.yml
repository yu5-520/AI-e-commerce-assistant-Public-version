name: V22.4.0 Release Hash Seal

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-hash-seal-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-seal:
    name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'seal-release' || 'pr-validation' }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      RELEASE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RELEASE_SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      RELEASE_EVENT: ${{ github.event_name }}
      RELEASE_REF: ${{ github.ref }}
      RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
      RELEASE_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'formal' || 'candidate' }}
      RELEASE_DEPLOYABLE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
      RELEASE_BASE_PYTHON: /opt/python/3.11.9/bin/python3.11
      RELEASE_RUNTIME_VENV_ROOT: /opt/actions-runner-public/release-runtime-venvs
      RELEASE_VALIDATION_VENV_ROOT: /opt/actions-runner-public/release-validation-venvs
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Materialize exact source commit archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/release-source-${RELEASE_SOURCE_COMMIT}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/release-source-${RELEASE_SOURCE_COMMIT}"
          rm -rf "$ARCHIVE" "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          DOWNLOADED=0
          for attempt in $(seq 1 8); do
            echo "Archive download attempt ${attempt}/8 for ${RELEASE_SOURCE_COMMIT}"
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 20 \
              --max-time 300 \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${RELEASE_SOURCE_COMMIT}" \
              -o "$ARCHIVE"; then
              DOWNLOADED=1
              break
            fi
            rm -f "$ARCHIVE"
            sleep $((attempt * 5))
          done
          test "$DOWNLOADED" = "1"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          test -f "$EXTRACTED/scripts/generate_release_manifest.py"
          test -f "$EXTRACTED/scripts/release_verifier.py"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$RELEASE_SOURCE_COMMIT" > "$GITHUB_WORKSPACE/.release-source-commit"
          test "$(cat "$GITHUB_WORKSPACE/.release-source-commit")" = "$RELEASE_SOURCE_COMMIT"
          if [ "$RELEASE_MODE" = "formal" ]; then
            test "$RELEASE_EVENT" = "push"
            test "$RELEASE_REF" = "refs/heads/main"
            test "$RELEASE_BRANCH" = "main"
          fi
          printf 'sourceCommit=%s\nsourceRef=%s\nmode=%s\n' \
            "$RELEASE_SOURCE_COMMIT" "$RELEASE_SOURCE_REF" "$RELEASE_MODE"

      - name: Prepare exact Temurin JDK tool 17.0.20+101
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17.0.20+101'

      - name: Prepare exact cached Python environments
        run: |
          set -euo pipefail
          [ -x "$RELEASE_BASE_PYTHON" ]
          test "$($RELEASE_BASE_PYTHON -c 'import platform; print(platform.python_version())')" = "3.11.9"
          mkdir -p dist/release-meta "$RELEASE_RUNTIME_VENV_ROOT" "$RELEASE_VALIDATION_VENV_ROOT"

          prepare_exact_venv() {
            local lock_file="$1"
            local venv_root="$2"
            local env_name="$3"
            local label="$4"
            local lock_hash venv_dir venv_python lock_path tmp_venv old_venv
            lock_hash="$(sha256sum "$lock_file" | awk '{print $1}')"
            venv_dir="$venv_root/$lock_hash"
            venv_python="$venv_dir/bin/python"
            lock_path="$venv_root/.${lock_hash}.lock"
            mkdir -p "$venv_root"
            exec 9>"$lock_path"
            if command -v flock >/dev/null 2>&1; then
              flock -w 1200 9
            fi
            if ! [ -x "$venv_python" ] || \
               ! timeout 120 "$venv_python" scripts/check_dependency_lock.py "$lock_file" --strict >/dev/null 2>&1; then
              tmp_venv="${venv_dir}.tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$$"
              rm -rf "$tmp_venv"
              "$RELEASE_BASE_PYTHON" -m venv "$tmp_venv"
              install_lock() {
                local index_url="$1"
                local trusted_host="$2"
                timeout 900 "$tmp_venv/bin/python" -m pip install \
                  --no-input \
                  --disable-pip-version-check \
                  --prefer-binary \
                  --timeout 30 \
                  --retries 4 \
                  --index-url "$index_url" \
                  --trusted-host "$trusted_host" \
                  -r "$lock_file"
              }
              if ! install_lock "https://mirrors.aliyun.com/pypi/simple/" "mirrors.aliyun.com" \
                  2>&1 | tee "dist/release-meta/${label}-dependency-install.log"; then
                install_lock "https://pypi.org/simple/" "pypi.org" \
                  2>&1 | tee -a "dist/release-meta/${label}-dependency-install.log"
              fi
              timeout 180 "$tmp_venv/bin/python" scripts/check_dependency_lock.py "$lock_file" --strict \
                | tee "dist/release-meta/${label}-dependency-verification.json"
              old_venv="${venv_dir}.old-$$"
              rm -rf "$old_venv"
              if [ -e "$venv_dir" ]; then
                mv "$venv_dir" "$old_venv"
              fi
              mv "$tmp_venv" "$venv_dir"
              rm -rf "$old_venv"
            else
              timeout 180 "$venv_python" scripts/check_dependency_lock.py "$lock_file" --strict \
                | tee "dist/release-meta/${label}-dependency-verification.json"
            fi
            test "$($venv_python -c 'import platform; print(platform.python_version())')" = "3.11.9"
            printf '%s=%s\n' "$env_name" "$venv_python" >> "$GITHUB_ENV"
          }

          prepare_exact_venv requirements.lock "$RELEASE_RUNTIME_VENV_ROOT" RELEASE_RUNTIME_PYTHON runtime
          prepare_exact_venv requirements-dev.lock "$RELEASE_VALIDATION_VENV_ROOT" RELEASE_VALIDATION_PYTHON validation

          NODE_BIN=''
          for candidate in \
            /opt/actions-runner-public/externals/node24/bin/node \
            /opt/actions-runner-public/externals/node20/bin/node \
            /opt/actions-runner-public/externals/node16/bin/node \
            /usr/local/bin/node \
            /usr/bin/node; do
            if [ -x "$candidate" ]; then
              NODE_BIN="$candidate"
              break
            fi
          done
          if [ -z "$NODE_BIN" ]; then
            NODE_BIN="$(find /opt/actions-runner-public /opt /usr/local -maxdepth 7 -type f -name node -perm -u+x -print 2>/dev/null | head -n 1 || true)"
          fi
          [ -n "$NODE_BIN" ] && [ -x "$NODE_BIN" ]
          printf '%s\n' "$(dirname "$NODE_BIN")" >> "$GITHUB_PATH"
          "$NODE_BIN" --version | tee dist/release-meta/node-version.txt

      - name: Build and verify sealed V24 Java readiness runtime
        env:
          V24_SOURCE_COMMIT: ${{ env.RELEASE_SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          chmod +x             scripts/build_v24_production_bundle.sh             scripts/verify_v24_production_bundle.sh             scripts/start_v24_authority.sh
          V24_JAVA_HOME="$JAVA_HOME"           V24_BUILD_PYTHON="$RELEASE_VALIDATION_PYTHON"           V24_SOURCE_COMMIT="$V24_SOURCE_COMMIT"             bash scripts/verify_v24_production_bundle.sh             | tee dist/release-meta/v24-production-authority-bundle.log

      - name: Produce sealed gray-test evidence
        env:
          PYTHONPATH: .
          ARTIFACT_ROOT: /tmp/ai-ecommerce-release-ci-artifacts
          AI_RELEASE_REQUIRED: '0'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          mkdir -p ci-attestation ci-artifacts
          rm -rf release-bundle sealed-app-smoke-bundle tampered-bundle

          {
            "$RELEASE_VALIDATION_PYTHON" -m compileall -q src scripts tests
            bash -n \
              scripts/runtime_service_resolver.sh \
              scripts/runtime_exclusivity_guard.sh \
              scripts/start_server.sh \
              scripts/deploy_release.sh \
              scripts/deploy_github_artifact.sh \
              scripts/install_release_verifier.sh
            "$RELEASE_VALIDATION_PYTHON" scripts/check_python36_bootstrap.py
            "$RELEASE_VALIDATION_PYTHON" scripts/sqlite_backup_rotate.py --help >/dev/null
            "$RELEASE_VALIDATION_PYTHON" scripts/release_verifier.py --help >/dev/null
            node --check web_demo/modules/report/page.js
            node --check web_demo/modules/system-status/page.js
            node --check web_demo/core/api-client.js
            node --check web_demo/core/router.js
            node --check web_demo/bootstrap.js

            PIN_ROOT="/tmp/ai-release-verifier-pin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            rm -rf "$PIN_ROOT"
            mkdir -p "$PIN_ROOT/state"
            cp scripts/release_verifier.py "$PIN_ROOT/ai-release-verifier"
            chmod 0755 "$PIN_ROOT/ai-release-verifier"
            PINNED_VERIFIER_HASH="$(sha256sum "$PIN_ROOT/ai-release-verifier" | awk '{print $1}')"
            printf '%s\n' "$PINNED_VERIFIER_HASH" > "$PIN_ROOT/state/release-verifier.sha256"
            test "$PINNED_VERIFIER_HASH" = "$(sha256sum "$PIN_ROOT/ai-release-verifier" | awk '{print $1}')"
            test "$PINNED_VERIFIER_HASH" = "$(tr -d '[:space:]' < "$PIN_ROOT/state/release-verifier.sha256")"
            "$RELEASE_BASE_PYTHON" "$PIN_ROOT/ai-release-verifier" --help >/dev/null

            grep -F '[ "${EUID:-$(id -u)}" -eq 0 ] || fail "Run as root"' scripts/install_release_verifier.sh >/dev/null
            grep -F 'ordinary release deployment cannot rotate root trust' scripts/install_release_verifier.sh >/dev/null
            grep -F 'Verifier rotation requires AI_RELEASE_VERIFIER_EXPECTED_OLD_SHA256' scripts/install_release_verifier.sh >/dev/null
            grep -F 'Expected old verifier SHA256 does not match the root-pinned value' scripts/install_release_verifier.sh >/dev/null

            cp scripts/release_verifier.py "$PIN_ROOT/candidate-release-verifier"
            printf '\n# simulated unauthorized verifier change\n' >> "$PIN_ROOT/candidate-release-verifier"
            CANDIDATE_HASH="$(sha256sum "$PIN_ROOT/candidate-release-verifier" | awk '{print $1}')"
            test "$CANDIDATE_HASH" != "$PINNED_VERIFIER_HASH"

            simulate_rotation_gate() {
              local rotate="$1"
              local expected_old_hash="$2"
              if [ "$CANDIDATE_HASH" = "$PINNED_VERIFIER_HASH" ]; then
                return 0
              fi
              case "${rotate,,}" in
                1|true|yes|on) ;;
                *) return 1 ;;
              esac
              [ -n "$expected_old_hash" ] || return 1
              [ "$expected_old_hash" = "$PINNED_VERIFIER_HASH" ] || return 1
              return 0
            }
            if simulate_rotation_gate 0 ''; then
              echo 'ordinary release unexpectedly rotated root trust' >&2
              exit 1
            fi
            if simulate_rotation_gate 1 "$(printf '0%.0s' {1..64})"; then
              echo 'rotation with wrong old hash unexpectedly passed' >&2
              exit 1
            fi
            simulate_rotation_gate 1 "$PINNED_VERIFIER_HASH"
            rm -rf "$PIN_ROOT"
            echo 'compile, bootstrap, root pin contract and frontend checks passed'
          } 2>&1 | tee ci-attestation/compile-syntax.log

          "$RELEASE_VALIDATION_PYTHON" scripts/check_release_contract.py \
            2>&1 | tee ci-attestation/static-contract.log
          "$RELEASE_VALIDATION_PYTHON" -m pytest -q tests/test_v22_4_app_route_smoke.py \
            2>&1 | tee ci-attestation/app-route-smoke.log
          "$RELEASE_VALIDATION_PYTHON" -m pytest -q \
            2>&1 | tee ci-attestation/pytest.log
          "$RELEASE_RUNTIME_PYTHON" scripts/check_dependency_lock.py requirements.lock --strict \
            | tee ci-attestation/production-runtime-verification.json

          "$RELEASE_VALIDATION_PYTHON" - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.').resolve()
          policy = json.loads((root / 'release/release-policy.json').read_text(encoding='utf-8'))
          paths = set()
          for pattern in policy.get('attestedGlobs') or []:
              paths.update(path for path in root.glob(str(pattern)) if path.is_file())
          for pattern in policy.get('excludeGlobs') or []:
              for path in root.glob(str(pattern)):
                  if path.is_file():
                      paths.discard(path)
          lines = []
          for path in sorted(paths, key=lambda item: item.relative_to(root).as_posix()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {path.relative_to(root).as_posix()}')
          if not lines:
              raise SystemExit('attested source set is empty')
          Path('ci-attestation/attested-files.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          "$RELEASE_VALIDATION_PYTHON" - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          deployable = os.environ['RELEASE_DEPLOYABLE'].lower() == 'true'
          required = [
              'compile-syntax.log',
              'static-contract.log',
              'app-route-smoke.log',
              'pytest.log',
              'production-runtime-verification.json',
              'attested-files.sha256',
              'test-attestation.json',
              'pip-freeze.txt',
              'python-runtime.json',
          ]
          payload = {
              'schema': 'release.test-attestation.v1',
              'sourceCommit': os.environ['RELEASE_SOURCE_COMMIT'],
              'releaseEvent': os.environ['RELEASE_EVENT'],
              'releaseRef': os.environ['RELEASE_REF'],
              'releaseBranch': os.environ['RELEASE_BRANCH'],
              'releaseWorkflow': os.environ['GITHUB_WORKFLOW'],
              'releaseWorkflowPath': '.github/workflows/release-hash-seal.yml',
              'deployableArtifact': deployable,
              'pullRequestMergeArtifact': False,
              'grayPythonVersion': platform.python_version(),
              'productionPythonVersion': '3.11.9',
              'requiredEvidenceFiles': required,
              'staticCheckerImportedRuntime': False,
              'cleanProcessRouteSmokePassed': True,
              'dependencyLockVerified': True,
              'cleanProductionRuntimeVerified': True,
              'python36BootstrapChecked': True,
              'rootVerifierPinningChecked': True,
              'ordinaryVerifierRotationRejected': True,
              'compilePassed': True,
              'shellSyntaxPassed': True,
              'frontendSyntaxPassed': True,
              'staticContractPassed': True,
              'pytestPassed': True,
              'sqliteBackupLifecycleChecked': True,
              'legacyBranchDeployAbsent': True,
              'shadowServiceRetirementChecked': True,
              'strayRuntimeRetirementChecked': True,
              'forbiddenLegacyPathCleanupChecked': True,
              'legacyWorkingTreeRetirementChecked': True,
              'externalBundleControllerChecked': True,
              'attestedSourcesSealed': True,
              'testEvidenceSealed': True,
              'testLogsSealed': True,
          }
          Path('ci-attestation/test-attestation.json').write_text(
              json.dumps(payload, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Generate and verify immutable release bundle
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          "$RELEASE_VALIDATION_PYTHON" scripts/generate_release_manifest.py \
            --source-commit "$RELEASE_SOURCE_COMMIT" \
            --dependency-lock requirements.lock \
            --runtime-python "$RELEASE_RUNTIME_PYTHON" \
            --test-evidence-dir ci-attestation \
            --staging-dir release-bundle \
            | tee ci-artifacts/release-generation.json
          "$RELEASE_VALIDATION_PYTHON" scripts/release_verifier.py \
            --root release-bundle \
            --manifest release-bundle/release/release-manifest.json \
            | tee ci-artifacts/release-verification.json
          "$RELEASE_RUNTIME_PYTHON" release-bundle/scripts/check_dependency_lock.py \
            release-bundle/requirements.lock --strict \
            | tee ci-artifacts/dependency-lock-verification.json

          rm -rf sealed-app-smoke-bundle
          cp -a release-bundle sealed-app-smoke-bundle
          (
            cd sealed-app-smoke-bundle
            AI_RELEASE_ROOT="$PWD" \
            AI_RELEASE_MANIFEST="$PWD/release/release-manifest.json" \
            AI_RELEASE_REQUIRED=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$PWD" \
            ARTIFACT_ROOT=/tmp/ai-ecommerce-sealed-app-smoke \
            "$RELEASE_RUNTIME_PYTHON" - <<'PY'
          import json
          from src.api.main import api_version, app

          paths = sorted((app.openapi().get('paths') or {}).keys())
          version = api_version()
          identity = version.get('releaseIdentity') or {}
          assert '/api/system/release-identity' in paths, paths
          assert identity.get('verified') is True, identity
          assert identity.get('evidenceSemanticVerified') is True, identity
          assert identity.get('runtimeEnvironmentMatch') is True, identity
          assert identity.get('runtimePythonVersion') == '3.11.9', identity
          assert identity.get('buildPythonVersion') == '3.11.9', identity
          assert identity.get('runtimePipFreezeHash') == identity.get('pipFreezeHash'), identity
          assert identity.get('testRunHash') == identity.get('calculatedTestRunHash'), identity
          assert identity.get('extraRuntimeFileCount') == 0, identity
          assert identity.get('extraAttestedFileCount') == 0, identity
          assert identity.get('extraTestEvidenceFileCount') == 0, identity
          print(json.dumps({
              'schema': 'release.sealed-app-smoke.v1',
              'version': version.get('version'),
              'runtimeMode': version.get('runtimeMode'),
              'routeCount': len(paths),
              'releaseHash': identity.get('releaseHash'),
              'sourceCommit': identity.get('sourceCommit'),
              'runtimeEnvironmentMatch': identity.get('runtimeEnvironmentMatch'),
              'evidenceSemanticVerified': identity.get('evidenceSemanticVerified'),
              'proofSetMatch': True,
          }, ensure_ascii=False, sort_keys=True))
          PY
          ) | tee ci-artifacts/sealed-app-smoke.json
          "$RELEASE_VALIDATION_PYTHON" scripts/release_verifier.py \
            --root sealed-app-smoke-bundle \
            --manifest sealed-app-smoke-bundle/release/release-manifest.json \
            | tee ci-artifacts/post-smoke-release-verification.json

          expect_rejection() {
            local label="$1"
            if "$RELEASE_VALIDATION_PYTHON" scripts/release_verifier.py \
                --root tampered-bundle \
                --manifest tampered-bundle/release/release-manifest.json \
                >"ci-artifacts/${label}.log" 2>&1; then
              echo "Root verifier accepted ${label}" >&2
              cat "ci-artifacts/${label}.log" >&2
              exit 1
            fi
          }

          rm -rf tampered-bundle
          cp -a release-bundle tampered-bundle
          "$RELEASE_VALIDATION_PYTHON" - <<'PY'
          import json
          from pathlib import Path
          root = Path('tampered-bundle')
          manifest = json.loads((root / 'release/release-manifest.json').read_text(encoding='utf-8'))
          target = root / manifest['attestedFiles'][0]['path']
          target.write_bytes(target.read_bytes() + b'\nattested-tamper\n')
          PY
          expect_rejection tampered-attested-source

          rm -rf tampered-bundle
          cp -a release-bundle tampered-bundle
          "$RELEASE_VALIDATION_PYTHON" - <<'PY'
          import json
          from pathlib import Path
          root = Path('tampered-bundle')
          manifest = json.loads((root / 'release/release-manifest.json').read_text(encoding='utf-8'))
          target = root / manifest['testEvidenceFiles'][0]['path']
          target.write_bytes(target.read_bytes() + b'\ntest-evidence-tamper\n')
          PY
          expect_rejection tampered-test-evidence

          rm -rf tampered-bundle
          cp -a release-bundle tampered-bundle
          printf 'LEGACY = True\n' > tampered-bundle/src/legacy_runtime_overlay.py
          expect_rejection extra-runtime-file

          rm -rf tampered-bundle
          cp -a release-bundle tampered-bundle
          printf 'LEGACY = True\n' > tampered-bundle/tests/legacy_contract_overlay.py
          expect_rejection extra-attested-file

          rm -rf tampered-bundle
          cp -a release-bundle tampered-bundle
          printf 'legacy evidence\n' > tampered-bundle/release/attestation/legacy-gray-proof.log
          expect_rejection extra-test-evidence
          rm -rf tampered-bundle sealed-app-smoke-bundle

          RELEASE_HASH="$($RELEASE_VALIDATION_PYTHON -c 'import json; print(json.load(open("release-bundle/release/release-manifest.json"))["releaseHash"].split(":",1)[1])')"
          ARCHIVE_NAME="${RELEASE_MODE}-release-${RELEASE_SOURCE_COMMIT}-${RELEASE_HASH}.tar.gz"
          tar -C release-bundle -czf "ci-artifacts/${ARCHIVE_NAME}" .
          cp release-bundle/release/release-manifest.json ci-artifacts/release-manifest.json
          "$RELEASE_VALIDATION_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('ci-artifacts/release-manifest.json').read_text(encoding='utf-8'))
          summary = {
              'schema': 'release.self_hosted_seal.v1',
              'mode': os.environ['RELEASE_MODE'],
              'deployable': os.environ['RELEASE_DEPLOYABLE'].lower() == 'true',
              'sourceCommit': os.environ['RELEASE_SOURCE_COMMIT'],
              'releaseHash': manifest['releaseHash'],
              'manifestHash': manifest['manifestHash'],
              'testRunHash': manifest['testRunHash'],
              'runtimeFileCount': len(manifest['runtimeFiles']),
              'attestedFileCount': len(manifest['attestedFiles']),
              'testEvidenceFileCount': len(manifest['testEvidenceFiles']),
              'productionSwitched': False,
              'productionServiceRestarted': False,
              'verified': True,
          }
          Path('ci-artifacts/release-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publish sealed release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_MODE }}-${{ env.RELEASE_SOURCE_COMMIT }}
          path: |
            ci-artifacts
            ci-attestation
            dist/release-meta
          if-no-files-found: warn
          retention-days: 14
