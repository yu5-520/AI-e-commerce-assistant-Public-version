name: Clean bytecode and commit verified field compatibility

on:
  push:
    branches:
      - migration/bulk-bootstrap
    paths:
      - .github/workflows/contest-field-compat-local-clean-commit-once.yml

permissions:
  contents: write

concurrency:
  group: contest-field-compat-local-clean-commit-once
  cancel-in-progress: false

jobs:
  clean-commit-push:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      WORK: /opt/actions-runner-public/_work/AI-e-commerce-assistant-Public-version/AI-e-commerce-assistant-Public-version
      BASE_COMMIT: 42732acfdec2dc7d94693880c4e9969ceffad04e
      TARGET_BRANCH: migration/contest-field-compat-applied-v1
      GH_PUSH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify preserved verified migration workspace
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$WORK" 2>/dev/null || true
          cd "$WORK"
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test -f governance/contest/generated/field-compat-apply-receipt.json
          test -f governance/contest/generated/field-compat-semantic-verification.json
          grep -q '"changedFileCount": 11' governance/contest/generated/field-compat-apply-receipt.json
          grep -q '"editCount": 26' governance/contest/generated/field-compat-apply-receipt.json
          grep -q '"postApplyViolationCount": 0' governance/contest/generated/field-compat-apply-receipt.json
          grep -q '"state": "FIELD_COMPATIBILITY_SEMANTICS_VERIFIED"' governance/contest/generated/field-compat-semantic-verification.json
          grep -q '"legacyPairedReads": 21' governance/contest/generated/field-compat-semantic-verification.json
          grep -q '"legacyCleanupPops": 3' governance/contest/generated/field-compat-semantic-verification.json
          grep -q '"modernWrites": 13' governance/contest/generated/field-compat-semantic-verification.json
          grep -q '"violationCount": 0' governance/contest/generated/field-compat-semantic-verification.json
          echo "PRESERVED_FIELD_COMPAT_VERIFICATION=PASS"

      - name: Remove generated bytecode and rebuild exact index
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          git reset
          find src tools -type d -name __pycache__ -prune -exec rm -rf {} +
          find src tools -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          mapfile -t changed_python < <(git diff --name-only -- 'src/services/*.py' | sort)
          test "${#changed_python[@]}" -eq 11
          printf '%s\n' "${changed_python[@]}"

          git add "${changed_python[@]}" \
            governance/contest/generated/field-compat-transaction.json \
            governance/contest/generated/field-compat-apply-receipt.json \
            governance/contest/generated/field-compat-semantic-verification.json

          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "14"
          test -z "$(git diff --cached --name-only | grep -E '(__pycache__|\.py[co]$)' || true)"
          forbidden="$(git diff --cached --name-only | grep -Ev '^(src/services/.*\.py|governance/contest/generated/field-compat-(transaction|apply-receipt|semantic-verification)\.json)$' || true)"
          test -z "$forbidden"
          echo "EXACT_FIELD_COMPAT_INDEX=PASS"

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "migration(contest): apply verified dual-read new-write fields [skip ci]"
          echo "FIELD_COMPAT_COMMIT=$(git rev-parse HEAD)" | tee /tmp/field-compat-clean-commit.txt
          echo "FIELD_COMPAT_LOCAL_COMMIT=PASS"

      - name: Push verified commit without fetching
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_PUSH_TOKEN" ;;
          esac
          SH
          chmod 700 "$askpass"
          pushed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
              git push --force-with-lease="refs/heads/$TARGET_BRANCH:$BASE_COMMIT" \
              https://github.com/yu5-520/AI-e-commerce-assistant-Public-version.git \
              "HEAD:refs/heads/$TARGET_BRANCH"; then
              pushed=1
              break
            fi
            sleep $((attempt * 10))
          done
          test "$pushed" = "1"
          echo "FIELD_COMPAT_VERIFIED_PUSH=PASS"
