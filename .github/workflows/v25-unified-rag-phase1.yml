name: V25 Unified RAG Phase1

on:
  push:
    branches:
      - main
    paths:
      - 'java-control-plane/**'
      - 'governance/v25/**'
      - 'scripts/export_v25_phase1_knowledge_baseline.py'
      - 'scripts/verify_v25_java_phase1.sh'
      - 'src/services/operating_policy_context_v2028_service.py'
      - 'src/services/agent_rag_context_v2028_service.py'
      - 'src/services/company_sop_rag_context_v225_service.py'
      - 'src/services/agent2_action_draft_core_v225_service.py'
      - 'src/services/agent3_system_constraint_base_v23214_service.py'
      - 'src/services/hash_routed_rag_service.py'
      - 'src/services/agent_hash_routed_rag_bridge_v1_service.py'
      - '.github/workflows/v25-unified-rag-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v25-unified-rag-phase1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-knowledge-authority:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      V25_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Materialize exact source archive
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$V25_SOURCE_COMMIT"
          ARCHIVE="${RUNNER_TEMP}/v25-phase1-${SOURCE_COMMIT}.tar.gz"
          EXTRACTED="${RUNNER_TEMP}/v25-phase1-${SOURCE_COMMIT}"
          rm -rf "$ARCHIVE" "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          downloaded=0
          for attempt in $(seq 1 8); do
            echo "Archive download ${SOURCE_COMMIT} attempt ${attempt}/8"
            if curl \
              --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 300 \
              -H "Authorization: Bearer ${GH_READ_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${SOURCE_COMMIT}" \
              -o "$ARCHIVE"; then
              downloaded=1
              break
            fi
            rm -f "$ARCHIVE"
            sleep $((attempt * 5))
          done
          test "$downloaded" = "1"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED" --strip-components=1
          test -f "$EXTRACTED/scripts/verify_v25_java_phase1.sh"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$EXTRACTED"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$SOURCE_COMMIT" > .v25-phase1-source-commit

      - name: Prepare JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Python 3.10+
        shell: bash
        run: |
          set -euo pipefail
          for candidate in \
            /opt/python/3.11.9/bin/python3.11 \
            python3.13 python3.12 python3.11 python3.10 python3; do
            if { command -v "$candidate" >/dev/null 2>&1 || [ -x "$candidate" ]; } \
              && "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3,10) else 1)' 2>/dev/null; then
              if command -v "$candidate" >/dev/null 2>&1; then candidate="$(command -v "$candidate")"; fi
              echo "PYTHON_BIN=$candidate" >> "$GITHUB_ENV"
              "$candidate" -c 'import platform; print("python=" + platform.python_version())'
              exit 0
            fi
          done
          echo 'Python 3.10+ is required.' >&2
          exit 1

      - name: Verify V25.0-V25.2 knowledge authority
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_v25_java_phase1.sh

      - name: Verify Phase1 production boundary
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('dist/v25-phase1/phase1-verification-report.json').read_text(encoding='utf-8'))
          assert report['verified'] is True
          assert report['enforcementMode'] == 'SHADOW'
          assert report['fieldToDomainResolutionVerified'] is True
          assert report['unknownKnowledgeFieldBlocked'] is True
          assert report['systemContractLeakBlocked'] is True
          assert report['productionAgentInputsUnchanged'] is True
          assert report['productionRagWriterUnchanged'] is True
          assert report['vectorRetrievalCutoverEnabled'] is False
          print('V25_PHASE1_AUTHORITY_BOUNDARY=PASS')
          PY

      - name: Upload V25 phase1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v25-unified-rag-phase1-${{ github.sha }}
          path: dist/v25-phase1/*.json
          if-no-files-found: error
          retention-days: 14
