name: Patch Static Release Contract

on:
  push:
    branches:
      - release/self-hosted-main-seal-v1
    paths:
      - '.github/workflows/patch-static-release-contract.yml'

permissions:
  contents: write

concurrency:
  group: patch-static-release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-contract:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Replace obsolete hosted-runner markers through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          /opt/python/3.11.9/bin/python3.11 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          path = 'scripts/check_release_contract.py'
          api = f'https://api.github.com/repos/{repository}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'self-hosted-release-contract-migrator',
          }
          request = urllib.request.Request(
              api + '?' + urllib.parse.urlencode({'ref': branch}),
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              current = json.load(response)
          source = base64.b64decode(current['content']).decode('utf-8')
          replacements = {
              '"python-version: \'3.11.9\'",': '"RELEASE_BASE_PYTHON: /opt/python/3.11.9/bin/python3.11",',
              '"requirements-dev.lock --strict",': '"prepare_exact_venv requirements-dev.lock",',
              '"/tmp/ai-release-runtime-venv",': '"RELEASE_RUNTIME_VENV_ROOT",',
              '"--runtime-python /tmp/ai-release-runtime-venv/bin/python",': '"--runtime-python \\\"$RELEASE_RUNTIME_PYTHON\\\"",',
              '"Ordinary release rotated root verifier trust",': '"ordinary release unexpectedly rotated root trust",',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'missing obsolete marker: {old}')
              source = source.replace(old, new, 1)
          anchor = '    workflow = text(".github/workflows/release-hash-seal.yml")\n'
          addition = (
              anchor
              + '    assert "runs-on: self-hosted" in workflow\n'
              + '    assert "tarball/${RELEASE_SOURCE_COMMIT}" in workflow\n'
              + '    assert "RELEASE_MODE" in workflow\n'
              + '    assert "RELEASE_DEPLOYABLE" in workflow\n'
          )
          if anchor not in source:
              raise SystemExit('workflow assertion anchor missing')
          source = source.replace(anchor, addition, 1)
          compile(source, path, 'exec')
          payload = json.dumps({
              'message': 'release: 静态合同适配ECS自托管封印',
              'content': base64.b64encode(source.encode('utf-8')).decode('ascii'),
              'sha': current['sha'],
              'branch': branch,
          }).encode('utf-8')
          write_request = urllib.request.Request(
              api,
              data=payload,
              method='PUT',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(write_request, timeout=120) as response:
              result = json.load(response)
          print(f"updatedCommit={result['commit']['sha']}")
          PY
