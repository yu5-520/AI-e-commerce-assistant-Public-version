name: Fix Operator Boundary Fixer Quotes

on:
  push:
    branches:
      - competition/operator-core-boundary-v1
    paths:
      - '.github/workflows/fix-fixer-quotes.yml'

permissions:
  contents: write

jobs:
  fix-quotes:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      PATCH_PYTHON: /opt/python/3.11.9/bin/python3.11
    steps:
      - name: Correct nested multiline string delimiters
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          "$PATCH_PYTHON" - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          path = 'scripts/fix_operator_boundary_consumers.py'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'operator-boundary-fixer-quote-corrector',
          }
          request = urllib.request.Request(
              api + '?' + urllib.parse.urlencode({'ref': branch}), headers=headers
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              current = json.load(response)
          source = base64.b64decode(current['content']).decode('utf-8')
          start = "    fixed_consumers = r'''\n"
          end = "\n'''\n    replace_once(\n        \"\\ndef build_product_boundary() -> dict[str, Any]:\\n\","
          isolation_doc = '''    isolation = ''' + "'''\"\"\"Competition fixed-workspace data-scope helpers.\n\nThe public competition runtime has no application account system and accepts no\nclient-selected user, role, tenant or organization identity. These helpers preserve\nthe existing row-scope API while pinning the demo namespace on the server side.\n\"\"\"\nfrom __future__ import annotations\n"
          isolation_comment = '''    isolation = ''' + "'''# Competition fixed-workspace data-scope helpers.\n# The public runtime accepts no client-selected identity and pins the demo namespace.\nfrom __future__ import annotations\n"
          if source.count(start) != 1 or source.count(end) != 1 or source.count(isolation_doc) != 1:
              raise SystemExit(
                  f'markers not unique: start={source.count(start)} end={source.count(end)} isolation={source.count(isolation_doc)}'
              )
          source = source.replace(isolation_doc, isolation_comment, 1)
          source = source.replace(start, '    fixed_consumers = r"""\n', 1)
          source = source.replace(end, '\n"""\n    replace_once(\n        "\\ndef build_product_boundary() -> dict[str, Any]:\\n",', 1)
          compile(source, path, 'exec')
          payload = json.dumps({
              'message': 'fix: 修正消费者补丁脚本嵌套字符串',
              'content': base64.b64encode(source.encode('utf-8')).decode('ascii'),
              'sha': current['sha'],
              'branch': branch,
          }).encode('utf-8')
          write = urllib.request.Request(
              api,
              data=payload,
              method='PUT',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(write, timeout=120) as response:
              result = json.load(response)
          print(result['commit']['sha'])
          PY
