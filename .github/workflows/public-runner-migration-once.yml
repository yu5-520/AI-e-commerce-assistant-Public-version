name: Public Runner Migration Once

on:
  push:
    branches:
      - security/public-release-hardening-v1
    paths:
      - '.github/workflows/public-runner-migration-once.yml'
      - 'scripts/migrate_public_runner_triggers.py'

permissions:
  contents: write

jobs:
  migrate-public-runner-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: security/public-release-hardening-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Migrate remaining self-hosted PR triggers
        run: |
          set -euo pipefail
          python3 scripts/migrate_public_runner_triggers.py

      - name: Verify repository-wide public runner boundary
        run: |
          set -euo pipefail
          python3 scripts/check_public_runner_boundary.py

      - name: Remove one-time migration artifacts
        run: |
          set -euo pipefail
          rm -f scripts/migrate_public_runner_triggers.py
          rm -f .github/workflows/public-runner-migration-once.yml

      - name: Commit hardened workflow boundary
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git commit -m 'Security: finalize public runner boundary [skip ci]'
          git push origin HEAD:security/public-release-hardening-v1
