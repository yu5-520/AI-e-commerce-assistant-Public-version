name: Competition Runtime Package

on:
  pull_request:
    paths:
      - 'src/**'
      - 'web_demo/**'
      - 'config/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'release/**'
      - 'requirements.lock'
      - 'VERSION.md'
      - '.github/workflows/competition-runtime-package.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: competition-runtime-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime-package:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      COMPETITION_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPETITION_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Materialize exact source commit with retries
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ ! -d .git ]; then
            git init .
          fi
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 | tr -d '\n')"
          FETCHED=0
          for attempt in $(seq 1 12); do
            echo "Fetch attempt ${attempt}/12 for ${COMPETITION_SOURCE_REF}@${COMPETITION_SOURCE_COMMIT}"
            if git \
              -c http.version=HTTP/1.1 \
              -c http.lowSpeedLimit=1 \
              -c http.lowSpeedTime=120 \
              -c http.https://github.com/.extraheader="$AUTH_HEADER" \
              fetch --force --no-tags --prune --depth=1 origin \
              "+refs/heads/${COMPETITION_SOURCE_REF}:refs/remotes/origin/${COMPETITION_SOURCE_REF}"; then
              if git cat-file -e "${COMPETITION_SOURCE_COMMIT}^{commit}" 2>/dev/null; then
                FETCHED=1
                break
              fi
            fi
            sleep $((attempt * 5))
          done
          unset AUTH_HEADER
          test "$FETCHED" = "1"
          git checkout --detach --force "$COMPETITION_SOURCE_COMMIT"
          git reset --hard "$COMPETITION_SOURCE_COMMIT"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$COMPETITION_SOURCE_COMMIT"
          echo "competitionSourceCommit=$COMPETITION_SOURCE_COMMIT"

      - name: Resolve ECS Python 3.10+
        run: |
          set -euo pipefail
          CANDIDATE_FILE="${RUNNER_TEMP}/competition-package-python-candidates.txt"
          : > "$CANDIDATE_FILE"
          for candidate in \
            python3.13 python3.12 python3.11 python3.10 \
            /usr/local/bin/python3.13 /usr/local/bin/python3.12 \
            /usr/local/bin/python3.11 /usr/local/bin/python3.10 \
            /usr/bin/python3.13 /usr/bin/python3.12 \
            /usr/bin/python3.11 /usr/bin/python3.10; do
            if command -v "$candidate" >/dev/null 2>&1; then
              command -v "$candidate" >> "$CANDIDATE_FILE"
            elif [ -x "$candidate" ]; then
              printf '%s\n' "$candidate" >> "$CANDIDATE_FILE"
            fi
          done
          for search_root in /opt /usr/local /home "$RUNNER_TOOL_CACHE"; do
            [ -d "$search_root" ] || continue
            find "$search_root" -maxdepth 7 -type f \
              \( -name 'python3.13' -o -name 'python3.12' -o -name 'python3.11' -o -name 'python3.10' -o -name 'python' \) \
              -perm -u+x -print 2>/dev/null >> "$CANDIDATE_FILE" || true
          done
          sort -u "$CANDIDATE_FILE" -o "$CANDIDATE_FILE"
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            version="$($candidate -c 'import platform; print(platform.python_version())' 2>/dev/null || true)"
            printf '  %s -> %s\n' "$candidate" "${version:-unusable}"
            if "$candidate" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' 2>/dev/null; then
              printf 'PYTHON_BIN=%s\n' "$candidate" >> "$GITHUB_ENV"
              printf 'Resolved PYTHON_BIN=%s (%s)\n' "$candidate" "$version"
              exit 0
            fi
          done < "$CANDIDATE_FILE"
          echo 'No usable Python 3.10+ runtime exists on this ECS runner.' >&2
          exit 1

      - name: Compile exact registry and lineage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          rm -rf dist/competition-lineage dist/competition-runtime
          mkdir -p dist
          "$PYTHON_BIN" -m py_compile \
            scripts/compile_competition_lineage.py \
            scripts/build_competition_runtime_package.py \
            scripts/verify_competition_runtime_package.py
          "$PYTHON_BIN" scripts/compile_competition_lineage.py \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --output-dir dist/competition-lineage \
            2>&1 | tee dist/competition-lineage-summary.json

      - name: Build whitelist runtime package
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/build_competition_runtime_package.py \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --lineage-dir dist/competition-lineage \
            --output-dir dist/competition-runtime \
            --archive-name "competition-runtime-${COMPETITION_SOURCE_COMMIT}.tar.gz" \
            2>&1 | tee dist/competition-runtime-build-summary.json

      - name: Verify package from archive only
        run: |
          set -euo pipefail
          ARCHIVE="dist/competition-runtime/competition-runtime-${COMPETITION_SOURCE_COMMIT}.tar.gz"
          "$PYTHON_BIN" scripts/verify_competition_runtime_package.py \
            "$ARCHIVE" \
            --source-commit "$COMPETITION_SOURCE_COMMIT" \
            --output dist/competition-runtime/competition-runtime-verification.json \
            2>&1 | tee dist/competition-runtime-verification-summary.json
          test -s "$ARCHIVE"
          test -s "${ARCHIVE}.sha256"

      - name: Publish precise runtime package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competition-runtime-${{ env.COMPETITION_SOURCE_COMMIT }}
          path: |
            dist/competition-runtime
            dist/competition-lineage
            dist/competition-lineage-summary.json
            dist/competition-runtime-build-summary.json
            dist/competition-runtime-verification-summary.json
          if-no-files-found: warn
          retention-days: 14
